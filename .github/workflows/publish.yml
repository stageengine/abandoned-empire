name: Publish

on:
  push:
    tags: ['*-v*']

  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to build and release, e.g. abandoned-empire-1-v0.1.0.'
        required: true
      engine:
        description: Which Stage to build with.
        required: false

permissions:
  contents: write

env:
  STAGE: ${{ inputs.engine || '0.15.0' }}

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Parse the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^(.+)-v([0-9].*)$ ]]; then
            echo "::error::tag $TAG does not look like <game>-v<version>, e.g. abandoned-empire-1-v0.1.0."
            exit 1
          fi

          game="${BASH_REMATCH[1]}"

          if [ ! -d "$game" ]; then
            echo "::error::no directory '$game' in this repo (parsed from tag $TAG)."
            exit 1
          fi

          echo "game=$game" >> "$GITHUB_OUTPUT"

      - name: Fetch the Stages to write into
        run: |
          set -euo pipefail

          mkdir -p templates

          for asset in \
            checksums.txt \
            stage-macos-arm64 \
            stage-macos-x86_64 \
            stage-linux-arm64 \
            stage-linux-x86_64 \
            stage-windows-x86_64.exe
          do
            curl -fsSL -o "templates/$asset" \
              "https://engine.sgail.com/download/engine@${STAGE}/$asset"
          done

          chmod +x templates/stage-macos-arm64

          # The one this runner can actually execute, which is also the one that does the
          # exporting. Its own version has to match the templates', which is the whole
          # reason there is a single `STAGE` above rather than one per asset.
          cp templates/stage-macos-arm64 stage

          ./stage --version

      - name: Build the game
        env:
          GAME: ${{ steps.tag.outputs.game }}
        run: |
          set -euo pipefail

          # Not --strict: the full 8-point compass unavoidably trips the engine's
          # near-miss vocabulary check (northeast/northwest/southeast/southwest
          # are all within its edit-distance threshold of each other), which
          # would block every build regardless of real content mistakes.
          ./stage compile "$GAME" --output game.stg

      - name: Read what was built
        id: built
        run: |
          set -euo pipefail

          python3 - <<'PY' >> "$GITHUB_OUTPUT"

          import gzip, json

          raw = open('game.stg', 'rb').read()

          if raw[:4] != b'STG\x00':
              raise SystemExit('game.stg does not begin like a Stage game')

          built = json.loads(gzip.decompress(raw[5:]))
          about = built['game'].get('metadata') or {}

          for name, value in (
              ('id', built['game']['id']),
              ('title', about.get('title', '')),
              ('version', about.get('version', '')),
              ('engine', built.get('engine', '')),
          ):
              print(f'{name}={value}')
          PY

      - name: Check the tag against the game
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GAME: ${{ steps.tag.outputs.game }}
          ID: ${{ steps.built.outputs.id }}
          VERSION: ${{ steps.built.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$ID" != "$GAME" ]; then
            echo "::error::built game id ($ID) does not match the directory the tag named ($GAME)."
            exit 1
          fi

          expected="${TAG#"${GAME}"-v}"
          if [ "$expected" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match the version in the game ($VERSION)."
            echo "Set metadata.version in $GAME/config.yaml, or tag ${GAME}-v$VERSION."
            exit 1
          fi

      - name: Export a program for every platform
        run: |
          set -euo pipefail

          ./stage export game.stg --output exports --templates templates

      - name: Name every program for the release
        env:
          ID: ${{ steps.built.outputs.id }}
          VERSION: ${{ steps.built.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p release

          for platform in exports/*/; do
            name="$(basename "$platform")"

            app="$(find "$platform" -maxdepth 1 -name '*.app' -print -quit)"

            if [ -n "$app" ]; then
              ditto -c -k --sequesterRsrc --keepParent "$app" "release/${ID}-${VERSION}-${name}.zip"
              continue
            fi

            program="$(find "$platform" -maxdepth 1 -type f -print -quit)"
            suffix=''

            case "$name" in
              windows-*) suffix='.exe' ;;
            esac

            cp "$program" "release/${ID}-${VERSION}-${name}${suffix}"
          done

          cd release && shasum -a 256 * > checksums.txt

          ls -la

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TITLE: ${{ steps.built.outputs.title }}
          VERSION: ${{ steps.built.outputs.version }}
          ENGINE: ${{ steps.built.outputs.engine }}
        run: |
          set -euo pipefail

          {
            echo "\`$TITLE\` $VERSION, carrying Stage $ENGINE."
            echo
            echo 'One program per platform, each with the engine inside it. Nothing to install:'
            echo 'download the one for your machine and open it.'
            echo
            echo 'The macOS downloads are zipped because an application is a folder. Everything'
            echo 'else is the program itself.'
          } > notes.md

          gh release create "$TAG" \
            --title "$TITLE $VERSION" \
            --notes-file notes.md \
            release/*
