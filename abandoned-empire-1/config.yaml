id: abandoned-empire-1
start: west-of-house

metadata:
  title: Abandoned Empire I
  version: 0.1.4
  copyright: |-
    Abandoned Empire I: a port of Zork I, by Infocom
    Copyright (c) 1981, 1982, 1983 Infocom, Inc. All rights reserved.

store:
  description: >-
    The Great Underground Empire, ported to Stage from Infocom's own ZIL source. A white house,
    a trap door, and three hundred and fifty points of treasure between you and the rank of
    Master Adventurer.
  assets:
    tile: assets/icon.png
    banner: assets/cover.png
  genres: [Adventure, Fantasy, Puzzle]

gui: gui-dist/

export:
  bundle-id: com.sgail.abandoned-empire-1
  platforms:
    macos: [arm64, x86_64]
    linux: [x86_64, arm64]
    windows: [x86_64]
  icons:
    macos: assets/icon.icns
    windows: assets/icon.ico
    linux: assets/icon.png

trace:
  conditions: true
  triggers: true

player:
  carries: allowance

  measures:
    - id: allowance
      max: 100
      start: 100
      min: 50

    - id: health
      max: 4
      start: 4
      thresholds:
        - from: 0
          triggers:
            - type: response
              data:
                text: >-
                  It appears that that last blow was too much for you. I'm afraid you are dead.
            - type: set-flag
              data:
                flag: player-died
                value: true
        - from: 1
          triggers:
            - type: response
              data:
                text: You are on the verge of losing consciousness.
        - from: 2
          triggers:
            - type: response
              data:
                text: You are bleeding, and it is beginning to tell.
        - from: 4

    - id: deaths
      max: 2
      start: 0

    - id: moves
      max: 9999
      start: 0

    - id: river-timer
      max: 4
      start: 4
      thresholds:
        - from: 0

    - id: score
      max: 350
      start: 0
      thresholds:
        - from: 0
        - from: 26
        - from: 51
        - from: 101
        - from: 201
        - from: 301
        - from: 331
        - from: 350
          triggers:
            - type: response
              data:
                text: >-
                  An almost inaudible voice whispers in your ear, "Look to your treasures for
                  the final secret."
            - type: set-flag
              data:
                flag: won-flag
                value: true
