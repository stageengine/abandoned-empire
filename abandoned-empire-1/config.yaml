id: abandoned-empire-1
start: west-of-house

metadata:
  title: Abandoned Empire I
  version: 0.1.7
  copyright: |-
    Abandoned Empire I: a port of Zork I, by Infocom
    Copyright (c) 1981, 1982, 1983 Infocom, Inc. All rights reserved.

store:
  description: >-
    The Great Underground Empire, ported to Stage from Infocom's own ZIL source. A white house,
    a trap door, and three hundred and fifty points of treasure between you and the rank of
    Master Adventurer.
  assets:
    tile: assets/icon.png
    banner: assets/cover.png
  genres: [Adventure, Fantasy, Puzzle]

export:
  bundle-id: com.sgail.abandoned-empire-1
  platforms:
    macos: [arm64, x86_64]
    linux: [x86_64, arm64]
    windows: [x86_64]

trace:
  conditions: true
  triggers: true

player:
  carries: allowance

  measures:
    - id: allowance
      max: 100
      start: 100
      min: 50

    - id: health
      max: 4
      start: 4
      thresholds:
        - from: 0
          triggers:
            - type: response
              data:
                text: >-
                  It appears that that last blow was too much for you. I'm afraid you are dead.
            - type: set-flag
              data:
                flag: player-died
                value: true
        - from: 1
          triggers:
            - type: response
              data:
                text: You are on the verge of losing consciousness.
        - from: 2
          triggers:
            - type: response
              data:
                text: You are bleeding, and it is beginning to tell.
        - from: 4

    - id: deaths
      max: 2
      start: 0

    - id: moves
      max: 9999
      start: 0

    - id: river-timer
      max: 4
      start: 4
      thresholds:
        - from: 0

    - id: score
      max: 350
      start: 0
      thresholds:
        - from: 0
        - from: 26
        - from: 51
        - from: 101
        - from: 201
        - from: 301
        - from: 331
        - from: 350
          triggers:
            - type: response
              data:
                text: >-
                  An almost inaudible voice whispers in your ear, "Look to your treasures for
                  the final secret."
            - type: set-flag
              data:
                flag: won-flag
                value: true

    - id: treasures
      max: 19
      start: 0
      thresholds:
        - from: 0
        - from: 19
          triggers:
            - type: achievement
              data: { id: every-treasure }

achievements:
  - id: treasure-bag-of-coins
    title: Leather Bag of Coins
    description: Put the leather bag of coins in the trophy case.
    icon: assets/icon.png

  - id: treasure-bar
    title: Platinum Bar
    description: Put the platinum bar in the trophy case.
    icon: assets/icon.png

  - id: treasure-bauble
    title: Brass Bauble
    description: Put the brass bauble in the trophy case.
    icon: assets/icon.png

  - id: treasure-bracelet
    title: Sapphire Bracelet
    description: Put the sapphire-encrusted bracelet in the trophy case.
    icon: assets/icon.png

  - id: treasure-canary
    title: Clockwork Canary
    description: Put the clockwork canary in the trophy case, working or broken.
    icon: assets/icon.png

  - id: treasure-chalice
    title: Chalice
    description: Put the chalice in the trophy case.
    icon: assets/icon.png

  - id: treasure-coffin
    title: Gold Coffin
    description: Put the gold coffin in the trophy case.
    icon: assets/icon.png

  - id: treasure-diamond
    title: Huge Diamond
    description: Put the huge diamond in the trophy case.
    icon: assets/icon.png

  - id: treasure-egg
    title: Jewel-Encrusted Egg
    description: Put the jewel-encrusted egg in the trophy case, whole or broken.
    icon: assets/icon.png

  - id: treasure-emerald
    title: Large Emerald
    description: Put the large emerald in the trophy case.
    icon: assets/icon.png

  - id: treasure-jade
    title: Jade Figurine
    description: Put the jade figurine in the trophy case.
    icon: assets/icon.png

  - id: treasure-painting
    title: Painting
    description: Put the painting in the trophy case.
    icon: assets/icon.png

  - id: treasure-pot-of-gold
    title: Pot of Gold
    description: Put the pot of gold in the trophy case.
    icon: assets/icon.png

  - id: treasure-scarab
    title: Jeweled Scarab
    description: Put the jeweled scarab in the trophy case.
    icon: assets/icon.png

  - id: treasure-sceptre
    title: Sceptre
    description: Put the sceptre in the trophy case.
    icon: assets/icon.png

  - id: treasure-skull
    title: Crystal Skull
    description: Put the crystal skull in the trophy case.
    icon: assets/icon.png

  - id: treasure-torch
    title: Torch
    description: Put the torch in the trophy case.
    icon: assets/icon.png

  - id: treasure-trident
    title: Crystal Trident
    description: Put the crystal trident in the trophy case.
    icon: assets/icon.png

  - id: treasure-trunk
    title: Trunk of Jewels
    description: Put the trunk of jewels in the trophy case.
    icon: assets/icon.png

  - id: every-treasure
    title: Every Treasure
    description: Put all nineteen treasures in the trophy case.
    icon: assets/icon.png

  - id: master-adventurer
    title: Master Adventurer
    description: Enter the stone barrow with all 350 points.
    icon: assets/icon.png

  - id: troll-slayer
    title: Troll Slayer
    description: Defeat the troll.
    icon: assets/icon.png

  - id: caught-the-thief
    title: Thief Taker
    description: Defeat the thief.
    icon: assets/icon.png

  - id: odysseus
    title: Odysseus
