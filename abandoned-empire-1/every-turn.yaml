  # The sword's own warning, said without being asked - which is most of what
  # it is for. `sword.object.yaml`'s `look` answers the same question if
  # asked, reading the same `glow` measure these rules set; its own
  # thresholds say the words the moment it actually changes, matching ZIL's
  # own change-only announcement.
  #
  # ZIL's `INFESTED?` is not troll/thief/cyclops specifically - it is any
  # object with `ACTORBIT` set and `INVISIBLE` clear, which in this game
  # means five: those three plus the bat and the ghosts. `object-in` reads
  # true villain state (fled, dead, not yet spawned) the same way
  # `character-here` already does for "in this room", so neither list needs
  # its own separate fled/dead handling.
