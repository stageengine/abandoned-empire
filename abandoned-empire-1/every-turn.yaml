  # And what he is for, now written once. `tagged` asks whether anything
  # tagged `treasure` is in the player's hands, and `move-tagged` takes
  # every treasure that answers in a single firing - what sixteen rules
  # against `has-item`/`remove-from-inventory` used to approximate one
  # object at a time, and got wrong besides: `remove-from-inventory` sent
  # what it took to the room the theft happened in, not to the thief, so a
  # stolen treasure never actually travelled with him. See `arch/0026` in
  # the engine.
  #
  # Only where he is standing, and only sometimes, so a player who meets him keeps
  # most of what they are carrying most of the time: one roll of nine, `thief-robbery`,
  # of which one index robs and the other eight only look. Zork's own words for it:
  # he is gone before you notice.

  # ZIL robs the room he is standing in before it ever touches the player's
  # own hands (`<ROB ,HERE ,THIEF 100>`, falling back to `<ROB ,WINNER
  # ,THIEF>` only when the room held nothing). One rule rather than two -
  # the build refuses two rules claiming the same `chance` index, even when
  # they are made mutually exclusive by their own `requires` - so both pools
  # are swept in the one firing instead: room first in the trigger order,
  # inventory besides only on the rare turn a treasure sits in both at once,
  # which real play essentially never lines up.
  - requires:
      - type: character-here
        data:
          character: thief
      - type: any-of
        data:
          conditions:
            - type: tagged
              data: { tag: treasure, location: here }
            - type: tagged
              data: { tag: treasure, location: inventory }
      - type: chance
        data: { name: thief-robbery, of: 9, index: 1 }
    triggers:
      - type: response
        data:
          text: >-
            The thief just left, still carrying his large bag. You may not have
            noticed that he made off with something of value first.
      - type: move-tagged
        data: { tag: treasure, from: here, to: held:thief }
      - type: move-tagged
        data: { tag: treasure, from: inventory, to: held:thief }
      - type: move-object
        data:
          object: thief
          to: treasure-room

  - requires:
      - type: character-here
        data:
          character: thief
      - type: any-of
        data:
          conditions:
            - type: tagged
              data: { tag: treasure, location: here }
            - type: tagged
              data: { tag: treasure, location: inventory }
      - type: chance
        data: { name: thief-robbery, of: 9, index: [2..9] }
    triggers:
      - type: response
        data: { text: The thief is taking an unhealthy interest in your possessions. }

  # The egg, opened undamaged, but only by his death. See `arch/0013`: ZIL's
  # `DEPOSIT-BOOTY` moves every treasure the thief was holding to the room he
  # dies in and, for the egg alone among them, also sets its open bit -
  # `<FSET ,EGG ,OPENBIT>`. `move-tagged` above already does the moving; this
  # is the one-line exception `move-tagged` cannot itself express, since it
  # sweeps every match the same way and does not ask which object each one is.
  #
  # `thief-just-died` is a one-turn pulse the death threshold raises and this
  # pass always lowers again, the same shape `was-dark` already uses above -
  # read once, acted on if it applies, gone by the next turn regardless, so an
  # unrelated closed egg lying on some later floor can never be mistaken for
  # this one.
  - requires:
      - type: flag
        data: { flag: thief-just-died }
      - type: object-here
        data: { object: egg }
    triggers:
      - type: set-flag
        data: { flag: egg-open, value: true }

  - requires:
      - type: flag
        data: { flag: thief-just-died }
    triggers:
      - type: set-flag
        data: { flag: thief-just-died, value: false }

  # His own counter-swing, wherever he currently is: he wanders, so this cannot
  # live in one room's own `every-turn.yaml` the way the troll's does. Silent
  # until `attack` sets `thief-fighting` - he is a thief before he is a fighter,
  # and does not start a fight just for being in the room with you. Same 5:2:2:2
