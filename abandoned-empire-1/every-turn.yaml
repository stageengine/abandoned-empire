          by: 15

  # The thief walks the dungeon. One roll a turn, `thief-walk`, over the rooms
  # ZIL lets him into - everything below ground except the maze and the rooms
  # it flags sacred - and one rule per room, each claiming one index of the
  # thirty-three, so exactly one of them fires and that is where he goes.
  #
  # Silent once he is dead, too. ZIL drives every thief behaviour off one queued
  # interrupt and disables it in full on death (`<DISABLE <INT I-THIEF>>`,
  # ROBBER-FUNCTION's F-DEAD branch) rather than checking aliveness in each one.
  # `remove-object` already parks a dead thief in `bin`, which is a fact this can
  # read directly - no flag of its own, since one already exists to ask.
  #
  # He is silent about it. Zork announces him arriving and leaving where the player
  # can see; the room says he is there when it describes itself, which is the half
  # that reads without a rule per room.
  #
  # Silent about standing still, too. `I-THIEF` only reaches this wander at all
  # once it already knows `<NOT <EQUAL? .RM ,HERE>>` - he does not roll to leave
  # a room he shares with the player, which is what makes an ambush he was just
  # placed into (`cyclops-room/config.yaml`'s `up`) stand there rather than
  # scatter to a random room on the very turn he arrives.
  - requires:
      - type: character-here
        negate: true
        data: { character: thief }
      - type: object-in
        negate: true
        data: { object: thief, location: bin }
      - type: chance
        data: { name: thief-walk, of: 33, index: 1 }
    triggers:
      - type: move-object
        data: { object: thief, to: cellar }

  - requires:
      - type: character-here
        negate: true
        data: { character: thief }
      - type: object-in
        negate: true
        data: { object: thief, location: bin }
      - type: chance
        data: { name: thief-walk, of: 33, index: 2 }
    triggers:
      - type: move-object
        data: { object: thief, to: east-of-chasm }

  - requires:
      - type: character-here
        negate: true
        data: { character: thief }
      - type: object-in
        negate: true
        data: { object: thief, location: bin }
      - type: chance
        data: { name: thief-walk, of: 33, index: 3 }
    triggers:
      - type: move-object
        data: { object: thief, to: gallery }

  - requires:
