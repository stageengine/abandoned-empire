        data:
          object: diamond
      - type: flag
        negate: true
        data:
          flag: found-diamond
    triggers:
      - type: set-flag
        data:
          flag: found-diamond
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 10

  - requires:
      - type: has-item
        data:
          object: egg
      - type: flag
        negate: true
        data:
          flag: found-egg
    triggers:
      - type: set-flag
        data:
          flag: found-egg
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 5

  - requires:
      - type: has-item
        data:
          object: emerald
      - type: flag
        negate: true
        data:
          flag: found-emerald
    triggers:
      - type: set-flag
        data:
          flag: found-emerald
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 5

  - requires:
      - type: has-item
        data:
          object: jade
      - type: flag
        negate: true
        data:
          flag: found-jade
    triggers:
      - type: set-flag
        data:
          flag: found-jade
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 5

  - requires:
