  # The Frigid River's current. `river-timer` counts down while the player is
  # aboard and on the river; the room they are in when it reaches zero decides
  # where it carries them, which is what `RIVER-NEXT`/`RIVER-SPEEDS` did in ZIL
  # with a table instead of five rules. River Five has no next room in that
  # table either - past it is the waterfall.
  - requires:
      - type: flag
        data:
          flag: aboard
      - type: scene
        data:
          tag: river
    triggers:
      - type: adjust-measure
        data:
          subject: player
          measure: river-timer
          by: -1

  - requires:
      - type: scene
        data:
          id: river-1
      - type: flag
        data:
          flag: aboard
      - type: measure
        data:
          subject: player
          measure: river-timer
          max: 0
    triggers:
      - type: response
        data:
          text: The flow of the river carries you downstream.
      - type: change-scene
        data:
          scene: river-2
      - type: adjust-measure
        data:
          subject: player
          measure: river-timer
          to: 4

  - requires:
      - type: scene
        data:
          id: river-2
      - type: flag
        data:
          flag: aboard
      - type: measure
        data:
          subject: player
