  # Resurrection. ZIL's `JIGS-UP` reads this off `DEATHS` at the moment of death;
  # here the health threshold only raises `player-died`, and these two rules read
  # the running count to decide which of Zork's two answers this death gets.
  # Simplified in one way: every resurrection uses the ordinary Forest branch
  # rather than ZIL's alternate ghost-in-Hades one for a death after the Temple
  # has been visited.
  # Ahead of the rule below and reading the same, still-unset `player-died`,
  # because that rule clears it - ZIL's own special case, and one of two things
  # returned rather than scattered with everything else a player was carrying.
  - requires:
      - type: flag
        data:
          flag: player-died
      - type: measure
        data:
          subject: player
          measure: deaths
          max: 1
      - type: has-item
        data:
          object: lamp
    triggers:
      - type: move-object
        data:
          object: lamp
          to: living-room

  # ZIL's other special case: `RANDOMIZE-OBJECTS` names the coffin by itself,
  # the same way it names the lamp, ahead of the generic sweep below.
  - requires:
      - type: flag
        data:
          flag: player-died
      - type: measure
        data:
          subject: player
          measure: deaths
          max: 1
      - type: has-item
        data:
          object: coffin
    triggers:
      - type: move-object
        data:
          object: coffin
          to: egypt-room

  # Everything else a player was carrying, scattered together - and split the
  # way `RANDOMIZE-OBJECTS` (1actions.zil:4101-4123) actually splits it, which
  # an earlier pass of this fix had backwards. ZIL's `ELSE` branch - anything
  # that is *not* a treasure (`P?TVALUE` zero, which it forces the sword's own
  # to be first) - drops straight into one of the eleven named `ABOVE-GROUND`
  # rooms, picked uniformly; a real treasure instead rolls once per treasure
  # against *every* room in the game with `RLANDBIT` set and `ONBIT` clear
  # (50% a try, cycling until one hits) - the ordinary, mostly-dark dungeon,
  # explicitly excluding the lit house-and-outdoors set `ABOVE-GROUND` names.
  # This engine's `move-tagged` acts on everything a tag currently marks in
  # one trigger rather than one roll per item, so everything a tag marks
  # answers the one roll below together rather than each finding its own
  # room - the `belongings` tag (every portable non-treasure except the lamp,
  # already special-cased above) gets `ABOVE-GROUND`'s own eleven exactly;
  # the `treasure` tag gets a second, differently-named roll of eleven
  # against a representative sample of ordinary dungeon rooms instead, since
  # asking a random condition about literally every room in the game is not
  # a question this engine's `chance` can put. Not the same room either one
  # would fetch on its own die, but the same shape - dropped outside the
  # player's own hands, and nowhere they left it.
