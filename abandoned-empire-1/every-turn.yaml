# What the world does while the player is doing something else.
#
# Two of the three things here are bookkeeping for something the engine does not
# have a word for yet, and both work the same way: a flag is cleared at the top
# of the pass and set again by whatever ought to set it. Every rule is tested
# against the world as the turn ended and only then fires, in the order written,
# so a rule cannot see what a rule above it did and the clearing cannot undo the
# setting.

every-turn:
  # One more move, every turn, whatever the player did with it. First in the pass
  # so that a rule below reading the count reads this turn's.
  - triggers:
      - type: adjust-measure
        data:
          subject: player
          measure: moves
          by: 1

  # Zork brings the allowance back on its own once a fight is over: `1actions.zil`
  # adds 10 back each turn until it reaches `LOAD-MAX` again. `laden` already
  # reads the measure as it stands, so recovery was the one piece missing - a
  # wound left the player permanently under-strength otherwise.
  - requires:
      - type: measure
        data: { subject: player, measure: allowance, max: 99 }
    triggers:
      - type: adjust-measure
        data:
          subject: player
          measure: allowance
          by: 10

  # Is anything lighting the way? One question now that `any-of` exists, asked
  # once a turn into a flag so that every dark room can ask one thing rather
  # than the whole list. It is an or of ands - a lamp is not a light unless it
  # is lit - which is why the alternatives are `all-of` blocks.
  #
  # An action that lights or douses something sets `light` itself as well, since
  # this pass runs after the turn and a player who lights the lamp should not be
  # told it is pitch black in the same breath.
  - triggers:
      - type: set-flag
        data:
          flag: light
          value: false

  - requires:
      - type: any-of
        data:
          conditions:
            # `object-here`, not `has-item`, on all three of these too: ZIL's
            # `LIT?` reads whatever is in the current room for `ONBIT`, not
            # whatever the player's hands hold - a lit lamp left behind still
            # lights the room it was dropped in. Confirmed directly against
            # the compiled game: drop a lit lamp, walk away, walk back, and
            # the room you left it in was never dark. The mine's own basket
            # puzzle depends on the very next condition having this already,
            # and the crawlway either side of it depends on this one having
            # it too - `drop all` there leaves a lit lamp exactly where a
            # player will need it again once they are back within reach.
            - type: all-of
              data:
                conditions:
                  - type: object-here
                    data:
                      object: lamp
                  - type: flag
                    data:
                      flag: lamp-on

            - type: all-of
              data:
                conditions:
                  - type: object-here
                    data:
                      object: candles
                  - type: flag
                    data:
                      flag: candles-on

            - type: all-of
              data:
                conditions:
                  - type: object-here
                    data:
                      object: match
                  - type: flag
                    data:
                      flag: match-on

            # ZIL's torch carries `ONBIT` fixed
            # forever on, so it lights whatever room it is sitting in exactly as
            # readily as one the player is holding - the mine's basket puzzle
            # depends on this, lowering the torch down the shaft ahead of a
            # player who has to cross a passage too narrow to carry anything
            # through, and finding it still burning at the bottom.
            - type: object-here
              data:
                object: torch

            # Not an object at all, unlike the four above it: sunlight through
            # the open grating, which is what lit the Grating Room in Zork too.
            - type: all-of
              data:
                conditions:
                  - type: scene
                    data:
                      id: grating-room
                  - type: flag
                    data:
                      flag: grate-open
    triggers:
      - type: set-flag
        data:
          flag: light
          value: true

  # The lamp burning down. Its own thresholds do the talking, and the last of
  # them puts the light out.
  - requires:
      - type: flag
        data:
          flag: lamp-on
      - type: flag
        negate: true
        data:
          flag: lamp-burned-out
    triggers:
      - type: adjust-measure
        data:
          subject: lamp
          measure: life
          by: -1

  # Whether the last turn was spent in the dark, which is what tells a grue it
  # has had time to find you. Cleared here and set again below if the room the
  # player is standing in is still a dark one.
  - triggers:
      - type: set-flag
        data:
          flag: was-dark
          value: false

  # The grue. One rule for all seventy-seven dark rooms, because a room says
  # what kind of room it is and a condition can ask. This used to be the same
  # thirty lines in seventy-seven folders, written by a tool.
  #
  # `player-died` rather than `end-game` directly: ZIL's own `JIGS-UP` is one
  # routine called for every death in the game, grue included, and gives every
  # one of them the same two resurrections before the third is final. Calling
  # `end-game` here instead would make this one death always final on the
  # first turn, when it is the single most common way to die in the game.
  #
  # `player-died` negated too: resurrection reads it a pass later than this
  # rule writes it, the same one-turn lag every every-turn rule reads every
  # other's writes from, and the room is still dark on that later turn - so
  # without this, the grue devours the player a second time while the first
  # death is still waiting to be resolved.
  - requires:
      - type: scene
        data:
          tag: dark
      - type: flag
        negate: true
        data:
          flag: light
      - type: flag
        data:
          flag: was-dark
      - type: flag
        negate: true
        data:
          flag: player-died
      - type: chance
        data:
          of: 100
          index: [1..80]
          name: every-turn-145
    triggers:
      - type: response
        data:
          text: Oh, no! A lurking grue slithered into the room and devoured you!
      - type: set-flag
        data:
          flag: player-died
          value: true

  - requires:
      - type: scene
        data:
          tag: dark
      - type: flag
        negate: true
        data:
          flag: light
    triggers:
      - type: set-flag
        data:
          flag: was-dark
          value: true

  # Flood Control Dam #3. The gates decide which way the reservoir walks, and
  # the dam's own thresholds set `low-tide` when it reaches either end. Eight
  # turns each way, which is what ZIL queues.
  - requires:
      - type: flag
        data:
          flag: gates-open
      - type: measure
        data:
          subject: dam
          measure: water
          min: 1
    triggers:
      - type: adjust-measure
        data:
          subject: dam
          measure: water
          by: -1

  - requires:
      - type: flag
        negate: true
        data:
          flag: gates-open
      - type: measure
        data:
          subject: dam
          measure: water
          max: 7
    triggers:
      - type: adjust-measure
        data:
          subject: dam
          measure: water
          by: 1

  # The leak the blue button opens, rising a notch a turn until it is stopped.
  - requires:
      - type: flag
        data:
          flag: leak-open
    triggers:
      - type: adjust-measure
        data:
          subject: leak
          measure: flood
          by: 1

  # The Loud Room, once the gates are open and the reservoir hasn't finished
  # draining: `LOUD-ROOM-FCN`'s `M-END` forcibly ejects a player who stays
  # there, to one of the room's own three exits at random (`LOUD-RUNS`). Not
  # gated on `loud-flag`: ZIL's own check is only `GATES-OPEN` and `NOT
  # LOW-TIDE`, with no exemption for having already solved the echo puzzle -
  # this is the reservoir physically rising into the room, not the acoustics
  # the puzzle answers, so solving `echo` does not make it safe to linger.
  - requires:
      - type: scene
        data:
          id: loud-room
      - type: flag
        data:
          flag: gates-open
      - type: flag
        negate: true
        data:
          flag: low-tide
      - type: chance
        data: { name: loud-room-flood, of: 3, index: 1 }
    triggers:
      - type: response
        data:
          text: >-
            It is unbearably loud here, with an ear-splitting roar seeming to come from all around
            you. There is a pounding in your head which won't stop. With a tremendous effort, you
            scramble out of the room.
      - type: change-scene
        data: { scene: damp-cave }

  - requires:
      - type: scene
        data:
          id: loud-room
      - type: flag
        data:
          flag: gates-open
      - type: flag
        negate: true
        data:
          flag: low-tide
      - type: chance
        data: { name: loud-room-flood, of: 3, index: 2 }
    triggers:
      - type: response
        data:
          text: >-
            It is unbearably loud here, with an ear-splitting roar seeming to come from all around
            you. There is a pounding in your head which won't stop. With a tremendous effort, you
            scramble out of the room.
      - type: change-scene
        data: { scene: round-room }

  - requires:
      - type: scene
        data:
          id: loud-room
      - type: flag
        data:
          flag: gates-open
      - type: flag
        negate: true
        data:
          flag: low-tide
      - type: chance
        data: { name: loud-room-flood, of: 3, index: 3 }
    triggers:
      - type: response
        data:
          text: >-
            It is unbearably loud here, with an ear-splitting roar seeming to come from all around
            you. There is a pounding in your head which won't stop. With a tremendous effort, you
            scramble out of the room.
      - type: change-scene
        data: { scene: deep-canyon }

  # The Gas Room. ZIL's `BOOM-ROOM` checks at the end of every turn spent
  # there whether the player is holding a lit candle, torch, or match -
  # `HELD?`, not `object-here`, so it is specifically what is in their hands
  # that ignites the gas, not merely a light source left lying nearby. One
  # message rather than ZIL's two: the "how sad... light a match" wording is
  # only for the exact turn the flame was lit, and telling that turn apart
  # from one spent just standing there already burning is not worth a shadow
  # flag for a line that ends the same way either time.
  - requires:
      - type: scene
        data:
          id: gas-room
      - type: any-of
        data:
          conditions:
            - type: all-of
              data:
                conditions:
                  - type: has-item
                    data: { object: candles }
                  - type: flag
                    data: { flag: candles-on }
            - type: has-item
              data: { object: torch }
            - type: all-of
              data:
                conditions:
                  - type: has-item
                    data: { object: match }
                  - type: flag
                    data: { flag: match-on }
      - type: flag
        negate: true
        data:
          flag: player-died
    triggers:
      - type: response
        data:
          text: >-
            Oh dear. It appears that the smell coming from this room was coal gas. I would have
            thought twice about carrying flaming objects in here.
      - type: response
        data:
          text: "** BOOOOOOOOOOOM **"
      - type: set-flag
        data:
          flag: player-died
          value: true

  # The candles burning down, and the match with them. Both say their own piece
  # through their thresholds.
  - requires:
      - type: flag
        data:
          flag: candles-on
      - type: flag
        negate: true
        data:
          flag: candles-gone
    triggers:
      - type: adjust-measure
        data:
          subject: candles
          measure: life
          by: -1

  - requires:
      - type: flag
        data:
          flag: match-on
    triggers:
      - type: adjust-measure
        data:
          subject: match
          measure: flame
          by: -1

  # The bell cooling, twenty turns after it was rung.
  - requires:
      - type: flag
        data:
          flag: bell-hot
    triggers:
      - type: adjust-measure
        data:
          subject: bell
          measure: heat
          by: -1

  # Somewhere out in the trees. Zork queues this the moment you first set foot in
  # a forest room and turns it off again the moment you leave; a tag asked once a
  # turn comes to the same thing and needs no queue.
  - requires:
      - type: scene
        data:
          tag: forest
      - type: chance
        data:
          of: 100
          index: [1..15]
          name: every-turn-265
    triggers:
      - type: response
        data:
          text: You hear in the distance the chirping of a song bird.

  # What a treasure is worth for being found, which Zork scores the moment it is
  # first held and never again. Zork's own VALUE for each, rather than a table
  # copied out of the report, which had three of them missing and the rest right.
  #
  # One rule each, and the repetition is the engine's own gap rather than a choice:
  # `has-item` names a fixed object and `adjust-measure` a fixed amount, so "score
  # whatever they are holding by whatever it is worth" cannot be written once.
  #
  # Here rather than on each treasure's `get`, because a treasure can be come by
  # without being taken - the canary comes out of the egg - and a rule asking what
  # is in the player's hands catches every route.

  - requires:
      - type: has-item
        data:
          object: bag-of-coins
      - type: flag
        negate: true
        data:
          flag: found-bag-of-coins
    triggers:
      - type: set-flag
        data:
          flag: found-bag-of-coins
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 10

  - requires:
      - type: has-item
        data:
          object: bar
      - type: flag
        negate: true
        data:
          flag: found-bar
    triggers:
      - type: set-flag
        data:
          flag: found-bar
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 10

  - requires:
      - type: has-item
        data:
          object: bauble
      - type: flag
        negate: true
        data:
          flag: found-bauble
    triggers:
      - type: set-flag
        data:
          flag: found-bauble
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 1

  - requires:
      - type: has-item
        data:
          object: bracelet
      - type: flag
        negate: true
        data:
          flag: found-bracelet
    triggers:
      - type: set-flag
        data:
          flag: found-bracelet
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 5

  - requires:
      - type: has-item
        data:
          object: canary
      - type: flag
        negate: true
        data:
          flag: found-canary
    triggers:
      - type: set-flag
        data:
          flag: found-canary
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 6

  - requires:
      - type: has-item
        data:
          object: chalice
      - type: flag
        negate: true
        data:
          flag: found-chalice
    triggers:
      - type: set-flag
        data:
          flag: found-chalice
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 10

  - requires:
      - type: has-item
        data:
          object: coffin
      - type: flag
        negate: true
        data:
          flag: found-coffin
    triggers:
      - type: set-flag
        data:
          flag: found-coffin
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 10

  - requires:
