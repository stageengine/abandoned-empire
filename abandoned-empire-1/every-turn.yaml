  # A fifth room-reached bonus, and the one the four above were named for
  # without being: ZIL's `NO-OBJS` checks this on every room entry, not only
  # this one, but the `AND` inside it only ever holds at the Drafty Room -
  # thirteen points, once, the moment the player gets here lit and carrying
  # nothing heavier than four (`LIGHT-SHAFT`, zeroed the instant it pays out).
  # No line is printed for it in ZIL either; the only way a player learns it
  # happened is `score` reading higher than the treasures alone explain. The
  # `east` exit out of here already asks the nearest true version of the same
  # question - `carrying: max: 4` in place of ZIL's true per-item check - and
  # this asks it again rather than reuse that exit's own passing as a proxy,
  # since arriving lit and light enough is the whole of ZIL's condition and
  # this may be read on the very turn the player walks in, before they have
  # tried to leave at all.
  - requires:
      - type: scene
        data:
          id: lower-shaft
      - type: flag
        data:
          flag: light
      - type: carrying
        data:
          max: 4
      - type: flag
        negate: true
        data:
          flag: reached-lower-shaft-lit
    triggers:
      - type: set-flag
        data:
          flag: reached-lower-shaft-lit
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 13

  # The bat, carried out. `BATS-ROOM` checks this on every `M-ENTER` (not
  # gated on light, unlike almost everything else in this file) and flies the
  # player to one of eight rooms the instant they arrive without garlic
