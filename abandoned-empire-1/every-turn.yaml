  # guardians (troll, cyclops, ghosts, bat), each with a short, genuinely
  # fixed list of neighbors read straight off their own room's exits. The
  # thief is the one ZIL villain this omits: he is the only one that
  # actually wanders, so "faintly warn of the thief" would need an
  # adjacency check against every room in the game rather than a handful of
