          subject: player
          measure: score
          by: 15

  # The thief walks the dungeon. One roll a turn over the rooms ZIL lets him into -
  # everything below ground except the maze and the rooms it flags sacred - which is
  # a weighted list of moves rather than 33 rules, because `chance` picks one
  # answer and the answer is where he goes.
  #
  # Silent once he is dead, too. ZIL drives every thief behaviour off one queued
  # interrupt and disables it in full on death (`<DISABLE <INT I-THIEF>>`,
  # ROBBER-FUNCTION's F-DEAD branch) rather than checking aliveness in each one.
  # `remove-object` already parks a dead thief in `bin`, which is a fact this can
  # read directly - no flag of its own, since one already exists to ask.
  #
  # He is silent about it. Zork announces him arriving and leaving where the player
  # can see; the room says he is there when it describes itself, which is the half
  # that reads without a rule per room.
  - requires:
      - type: object-in
        negate: true
        data: { object: thief, location: bin }
    triggers:
      # A `response` is what a roll with several answers hangs on, and its own text
      # is replaced by whichever answer comes up - every turn, here, since every
      # answer is a move. The line below is therefore never read; it is what the
      # rule would say if the list were ever empty.
      - type: response
        data: { text: You hear a scurrying noise in the distance. }
        chance:
          outcomes:
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: cellar }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: east-of-chasm }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: gallery }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: studio }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: troll-room }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: dome-room }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: egypt-room }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: engravings-cave }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: north-temple }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: south-temple }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: torch-room }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: entrance-to-hades }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: land-of-living-dead }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: atlantis-room }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: cold-passage }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: mirror-room-1 }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: mirror-room-2 }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: narrow-passage }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: small-cave }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: tiny-cave }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: twisting-passage }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: winding-passage }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: reservoir }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: reservoir-north }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: reservoir-south }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: stream-view }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: chasm-room }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: damp-cave }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: deep-canyon }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: ew-passage }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: loud-room }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: ns-passage }
            - weight: 1
              triggers:
                - type: move-object
                  data: { object: thief, to: round-room }

  # And what he is for, now written once. `tagged` asks whether anything
  # tagged `treasure` is in the player's hands, and `move-tagged` takes
  # every treasure that answers in a single firing - what sixteen rules
  # against `has-item`/`remove-from-inventory` used to approximate one
  # object at a time, and got wrong besides: `remove-from-inventory` sent
  # what it took to the room the theft happened in, not to the thief, so a
  # stolen treasure never actually travelled with him. See `arch/0026` in
  # the engine.
  #
  # Only where he is standing, and only sometimes, so a player who meets him keeps
  # most of what they are carrying most of the time. Zork's own words for it: he is
  # gone before you notice.

  - requires:
      - type: character-here
        data:
          character: thief
      - type: tagged
        data: { tag: treasure, location: inventory }
    triggers:
      - type: response
        data: { text: The thief eyes your possessions greedily. }
        chance:
          outcomes:
            - weight: 1
              triggers:
                - type: response
                  data:
                    text: >-
                      The thief just left, still carrying his large bag. You may not have
                      noticed that he robbed you blind first.
                - type: move-tagged
                  data: { tag: treasure, from: inventory, to: held:thief }
                - type: move-object
                  data:
                    object: thief
                    to: treasure-room
            - weight: 8
              triggers:
                - type: response
                  data: { text: The thief is taking an unhealthy interest in your possessions. }

  # His own counter-swing, wherever he currently is: he wanders, so this cannot
  # live in one room's own `every-turn.yaml` the way the troll's does. Silent
  # until `attack` sets `thief-fighting` - he is a thief before he is a fighter,
  # and does not start a fight just for being in the room with you. Same 5:2:2:2
  # weighting as the troll's, which is ZIL's own `DEF3A` table read the same way.
  #
  # The roll is one trigger, saying one of four things. Its own line is never
  # said - an answer runs in place of it - and repeats the miss, the commonest
  # of the four, the same way the miss's own wrapper below repeats its first.
  - requires:
      - type: character-here
        data:
          character: thief
      - type: flag
        data:
          flag: thief-fighting
    triggers:
      - type: response
        data:
          text: The thief stabs nonchalantly with his stiletto and misses.
        chance:
          outcomes:
            - weight: 5
              triggers:
                - type: response
                  chance:
                    outcomes:
                      - weight: 1
                        triggers:
                          - type: response
                            data:
                              text: The thief stabs nonchalantly with his stiletto and misses.
                      - weight: 1
                        triggers:
                          - type: response
                            data:
                              text: You dodge as the thief comes in low.
                      - weight: 1
                        triggers:
                          - type: response
                            data:
                              text: >-
                                You parry a lightning thrust, and the thief salutes you with a grim
                                nod.
                      - weight: 1
                        triggers:
                          - type: response
                            data:
                              text: The thief tries to sneak past your guard, but you twist away.
                  data:
                    text: The thief stabs nonchalantly with his stiletto and misses.

            - weight: 2
              triggers:
                - type: response
                  data:
                    text: The thief attacks, and you fall back desperately.

            - weight: 2
              triggers:
                - type: response
                  data:
                    text: A quick thrust pinks your left arm, and blood starts to trickle down.
                - type: adjust-measure
                  data:
                    subject: player
                    measure: health
                    by: -1
                - type: adjust-measure
                  data:
                    subject: player
                    measure: allowance
                    by: -10

            - weight: 2
              triggers:
                - type: response
                  data:
                    text: The thief strikes like a snake! The resulting wound is serious.
                - type: adjust-measure
                  data:
                    subject: player
                    measure: health
                    by: -1
                - type: adjust-measure
                  data:
                    subject: player
                    measure: allowance
                    by: -20

  # The encounter ends when either of you leaves, not only when he dies -
  # otherwise a fight broken off by walking away would resume the moment he
  # next wanders back into whatever room the player is standing in.
  - requires:
      - type: character-here
        negate: true
        data:
          character: thief
      - type: flag
        data:
          flag: thief-fighting
    triggers:
      - type: set-flag
        data:
          flag: thief-fighting
          value: false

  # The sword's own warning, said without being asked - which is most of what it
  # is for. `sword.object.yaml`'s `look` already answers the question if asked;
  # this is the same question, asked and answered on the turn it changes. ZIL
  # also glows faintly for a villain one room over; that wants a map of which
  # room is next to which, which the engine does not have, so only the same-room
  # bright warning is said here.
  - requires:
      - type: has-item
        data:
          object: sword
      - type: any-of
        data:
          conditions:
            - type: character-here
              data: { character: troll }
            - type: character-here
              data: { character: thief }
            - type: character-here
              data: { character: cyclops }
      - type: flag
        negate: true
        data:
          flag: sword-glowing
    triggers:
      - type: response
        data:
          text: Your sword has begun to glow very brightly.
      - type: set-flag
        data:
          flag: sword-glowing
          value: true

  - requires:
      - type: has-item
        data:
          object: sword
      - type: flag
        data:
          flag: sword-glowing
      - type: any-of
        negate: true
        data:
          conditions:
            - type: character-here
              data: { character: troll }
            - type: character-here
              data: { character: thief }
            - type: character-here
              data: { character: cyclops }
    triggers:
      - type: response
        data:
          text: Your sword is no longer glowing.
      - type: set-flag
        data:
          flag: sword-glowing
          value: false

  # Resurrection. ZIL's `JIGS-UP` reads this off `DEATHS` at the moment of death;
  # here the health threshold only raises `player-died`, and these two rules read
  # the running count to decide which of Zork's two answers this death gets.
  # Simplified in one way apiece: every resurrection uses the ordinary Forest
  # branch rather than ZIL's alternate ghost-in-Hades one for a death after the
  # Temple has been visited, and only the lamp gets ZIL's special-cased return -
  # scattering every other currently-held thing needs a rule per thing, the same
  # cost the trophy case already pays, and is left for a later pass.
  # Ahead of the rule below and reading the same, still-unset `player-died`,
  # because that rule clears it - ZIL's own special case, and the only thing
  # returned rather than simply kept: see the note below about what a player
  # was carrying otherwise.
  - requires:
      - type: flag
        data:
          flag: player-died
      - type: measure
        data:
          subject: player
          measure: deaths
          max: 1
      - type: has-item
        data:
          object: lamp
    triggers:
      - type: move-object
        data:
          object: lamp
          to: living-room

  - requires:
      - type: flag
        data:
          flag: player-died
      - type: measure
        data:
          subject: player
          measure: deaths
          max: 1
    triggers:
      - type: response
        data:
          text: >-
            Now, let's take a look here... Well, you probably deserve another chance. I can't
            quite fix you up completely, but you can't have everything.
      - type: change-scene
        data:
          scene: forest-1
      - type: adjust-measure
        data:
          subject: player
          measure: health
          to: 4
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: -10
      - type: adjust-measure
        data:
          subject: player
          measure: deaths
          by: 1
      - type: set-flag
        data:
          flag: player-died
          value: false

  - requires:
      - type: flag
        data:
          flag: player-died
      - type: measure
        data:
          subject: player
          measure: deaths
          min: 2
    triggers:
      - type: response
        data:
          text: >-
            You clearly are a suicidal maniac. We don't allow psychotics in the cave, since they
            may harm other adventurers. Your remains will be installed in the Land of the Living
            Dead, where your fellow adventurers may gloat over them.
      - type: end-game
        data:
          journal: died once too often

  # Zork scores four rooms for being reached at all, which is the last sixty-five of
  # the three hundred and fifty and the part the port had none of. `visited` asks
  # the question directly, so this is one rule each and the flag is what makes it
  # happen once.

  - requires:
      - type: visited
        data:
          scene: kitchen
      - type: flag
        negate: true
        data:
          flag: reached-kitchen
    triggers:
      - type: set-flag
        data:
          flag: reached-kitchen
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 10

  - requires:
      - type: visited
        data:
          scene: cellar
      - type: flag
        negate: true
        data:
          flag: reached-cellar
    triggers:
      - type: set-flag
        data:
          flag: reached-cellar
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 25

  - requires:
      - type: visited
        data:
          scene: treasure-room
      - type: flag
        negate: true
        data:
          flag: reached-treasure-room
    triggers:
      - type: set-flag
        data:
          flag: reached-treasure-room
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 25

  - requires:
      - type: visited
        data:
          scene: ew-passage
      - type: flag
        negate: true
        data:
          flag: reached-ew-passage
    triggers:
      - type: set-flag
        data:
          flag: reached-ew-passage
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 5

