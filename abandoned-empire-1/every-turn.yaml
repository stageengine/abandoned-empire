    triggers:
      - type: move-object
        data: { object: thief, to: troll-room }

  - requires:
      - type: character-here
        negate: true
        data: { character: thief }
      - type: object-in
        negate: true
        data: { object: thief, location: bin }
      - type: chance
        data: { name: thief-walk, of: 33, index: 6 }
    triggers:
      - type: move-object
        data: { object: thief, to: dome-room }

  - requires:
      - type: character-here
        negate: true
        data: { character: thief }
      - type: object-in
        negate: true
        data: { object: thief, location: bin }
      - type: chance
        data: { name: thief-walk, of: 33, index: 7 }
    triggers:
      - type: move-object
        data: { object: thief, to: egypt-room }

  - requires:
      - type: character-here
        negate: true
        data: { character: thief }
      - type: object-in
        negate: true
        data: { object: thief, location: bin }
      - type: chance
        data: { name: thief-walk, of: 33, index: 8 }
    triggers:
      - type: move-object
        data: { object: thief, to: engravings-cave }

  - requires:
      - type: character-here
        negate: true
        data: { character: thief }
      - type: object-in
        negate: true
        data: { object: thief, location: bin }
      - type: chance
        data: { name: thief-walk, of: 33, index: 9 }
    triggers:
      - type: move-object
        data: { object: thief, to: north-temple }

  - requires:
      - type: character-here
        negate: true
        data: { character: thief }
      - type: object-in
        negate: true
        data: { object: thief, location: bin }
      - type: chance
        data: { name: thief-walk, of: 33, index: 10 }
    triggers:
      - type: move-object
        data: { object: thief, to: south-temple }

  - requires:
      - type: character-here
        negate: true
        data: { character: thief }
      - type: object-in
        negate: true
        data: { object: thief, location: bin }
      - type: chance
        data: { name: thief-walk, of: 33, index: 11 }
    triggers:
      - type: move-object
        data: { object: thief, to: torch-room }

  - requires:
      - type: character-here
        negate: true
        data: { character: thief }
      - type: object-in
        negate: true
