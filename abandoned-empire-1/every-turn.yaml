  # The Frigid River's current. `river-timer` counts down while the player is
  # aboard and on the river; the room they are in when it reaches zero decides
  # where it carries them, which is what `RIVER-NEXT`/`RIVER-SPEEDS` did in ZIL
  # with a table instead of five rules. River Five has no next room in that
  # table either - past it is the waterfall.
  #
  # Each transition below reads `max: 1`, not `max: 0`: every rule in a pass
  # sees the same snapshot from before any of them fired (this file's own
  # habit, and the reason a patrol written as one rule per leg does not
  # silently walk its whole circuit in a single turn), so the plain decrement
  # above and a transition checking the *already-decremented* value can never
  # both fire on the turn the count actually reaches zero - the transition
  # would not see zero until the turn after, one tick later than ZIL's own
  # `I-RIVER`, which re-queues itself for exactly the speed a room names, not
  # that plus one. Reading the count as it stood before this tick's decrement
  # - due to hit zero *by* this tick - is what makes the two turns line up.
  - requires:
      - type: flag
        data:
          flag: aboard
      - type: scene
        data:
          tag: river
    triggers:
      - type: adjust-measure
        data:
          subject: player
          measure: river-timer
          by: -1

  - requires:
      - type: scene
        data:
          id: river-1
      - type: flag
        data:
          flag: aboard
      - type: measure
        data:
