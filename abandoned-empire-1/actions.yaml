# What Zork answers to a verb typed on its own, wherever you are standing.
#
# ZIL keeps these as routines that take no object: `V-WAIT`, `V-PRAY`, `V-YELL`
# and a dozen one-line jokes. A room may answer one of them instead, and is
# asked first - South Temple's `pray` is the only one in Zork I that does.

actions:
  # Zork runs its clock three more times inside this one command, and breaks off
  # early if anything interesting fires. Stage has no trigger that moves the
  # clock, so this is one turn with Zork's own words on it: the world still does
  # what a turn passing does, and does it once.
  - id: score
    requires:
      - type: measure
        data: { subject: player, measure: score, min: 350 }
    triggers:
      - type: response
        data:
          text: >-
            Your score is <player:score> (total of 350 points), in <player:moves> moves. This
            gives you the rank of Master Adventurer.
  - id: score
    requires:
      - type: measure
        data: { subject: player, measure: score, min: 331 }
    triggers:
      - type: response
        data:
          text: >-
            Your score is <player:score> (total of 350 points), in <player:moves> moves. This
            gives you the rank of Wizard.
  - id: score
    requires:
      - type: measure
        data: { subject: player, measure: score, min: 301 }
    triggers:
      - type: response
        data:
          text: >-
            Your score is <player:score> (total of 350 points), in <player:moves> moves. This
            gives you the rank of Master.
  - id: score
    requires:
      - type: measure
        data: { subject: player, measure: score, min: 201 }
    triggers:
      - type: response
        data:
          text: >-
            Your score is <player:score> (total of 350 points), in <player:moves> moves. This
            gives you the rank of Adventurer.
  - id: score
    requires:
      - type: measure
        data: { subject: player, measure: score, min: 101 }
    triggers:
      - type: response
        data:
          text: >-
            Your score is <player:score> (total of 350 points), in <player:moves> moves. This
            gives you the rank of Junior Adventurer.
  - id: score
    requires:
      - type: measure
        data: { subject: player, measure: score, min: 51 }
    triggers:
      - type: response
        data:
          text: >-
            Your score is <player:score> (total of 350 points), in <player:moves> moves. This
            gives you the rank of Novice Adventurer.
  - id: score
    requires:
      - type: measure
        data: { subject: player, measure: score, min: 26 }
    triggers:
      - type: response
        data:
          text: >-
            Your score is <player:score> (total of 350 points), in <player:moves> moves. This
            gives you the rank of Amateur Adventurer.
  - id: score
    triggers:
      - type: response
        data:
          text: >-
            Your score is <player:score> (total of 350 points), in <player:moves> moves. This
            gives you the rank of Beginner.


  - id: diagnose
    triggers:
      - type: response
        data:
          text: >-
            You have <player:health> of four wounds' worth of life in you, and can carry
            <player:allowance>.

  - id: wait
    triggers:
      - type: response
        data:
          text: Time passes...
      # ZIL's `V-WAIT` runs the clock three times for this one typed command,
      # not once - confirmed against the compiled game: a lit lamp measurably
      # burns faster through a run of waits than a naive one-tick `wait` would
      # drain it. `1actions.zil`/`gverbs.zil`'s `V-WAIT` is the source of this.
      - type: turn
        data:
          count: 3

  # `V-VERBOSE` also sets `SUPER-BRIEF` false and `VERBOSE` true - both moot
  # here, since the port only ever writes the long description, the behavior
  # those flags ask for. Recognising the word is what was missing, not a mode
  # to switch: `brief`/`superbrief` would need the engine to withhold a room's
  # long description on a later visit, which nothing here does yet.
  - id: verbose
    triggers:
      - type: response
        data:
          text: Maximum verbosity.

  - id: pray
    triggers:
      - type: response
        data:
          text: If you pray enough, your prayers may be answered.

  # `RIVER-LAUNCH` sends a launch from other landings straight into a later river
  # room, at that room's own `RIVER-SPEEDS` rather than River One's four turns -
  # four landings on the Frigid River side of the table, each its own block so
  # the destination and the timer it starts at differ per site the way ZIL's
  # table entry did. Reservoir and Stream View entries in the same ZIL global
  # belong to the separate reservoir crossing, not this boat. A bare verb
  # rather than the boat's own, since `launch` takes no object in ZIL and a
  # transitive verb here left a bare `launch` asking what to launch instead
  # of answering it, exactly as `wait`/`pray` above it would if they were not
  # bare too.
  - id: launch
    requires:
      - type: flag
        data: { flag: aboard }
      - type: scene
        data: { id: dam-base }
    triggers:
      - type: response
        data: { text: The boat is moving in the current. }
      - type: change-scene
        data: { scene: river-1 }
      - type: adjust-measure
        data:
          subject: player
          measure: river-timer
          to: 4

  - id: launch
    requires:
      - type: flag
        data: { flag: aboard }
      - type: scene
        data: { id: white-cliffs-north }
    triggers:
      - type: response
        data: { text: The boat is moving in the current. }
      - type: change-scene
        data: { scene: river-3 }
      - type: adjust-measure
        data:
          subject: player
          measure: river-timer
          to: 3

  - id: launch
    requires:
      - type: flag
        data: { flag: aboard }
      - type: scene
        data: { id: white-cliffs-south }
    triggers:
      - type: response
        data: { text: The boat is moving in the current. }
      - type: change-scene
        data: { scene: river-4 }
      - type: adjust-measure
        data:
          subject: player
          measure: river-timer
          to: 2

  - id: launch
    requires:
      - type: flag
        data: { flag: aboard }
      - type: scene
        data: { id: sandy-beach }
    triggers:
      - type: response
        data: { text: The boat is moving in the current. }
      - type: change-scene
        data: { scene: river-4 }
      - type: adjust-measure
        data:
          subject: player
          measure: river-timer
          to: 2

  - id: launch
    requires:
      - type: flag
        data: { flag: aboard }
        failure:
          triggers:
            - type: response
              data: { text: You're not in the boat! }
    triggers:
      - type: response
        data: { text: You can't launch it here. }

  # Every room the current runs through is water with nothing to stand on, so
  # climbing out mid-river refuses rather than succeeding - written above the
  # plain disembark for the same reason boarding's puncture is. Bare for the
  # same reason `launch` above it is: ZIL's `V-DISEMBARK` names no object either.
  #
  # A refusal, not a death: this used to fire the puncture's own drowning line
  # and kill the player, but ZIL's `V-DISEMBARK` only ever answers a non-land
  # room with "You realize that getting out here would be fatal." and an
  # `RFATAL` - a macro that ends the turn's dispatch, not the player's life.
  # The only way to actually die out here is the puncture itself (see
  # `inflated-boat.object.yaml`) or the current carrying the boat over the
  # falls (`every-turn.yaml`).
  - id: disembark
    requires:
      - type: flag
        data: { flag: aboard }
      - type: any-of
        data:
          conditions:
            - type: scene
              data: { tag: river }
            - type: scene
              data: { id: reservoir }
            - type: scene
              data: { id: in-stream }
    triggers:
      - type: response
        data:
          text: You realize that getting out here would be fatal.

  - id: disembark
    requires:
      - type: flag
        data: { flag: aboard }
        failure:
          triggers:
            - type: response
              data: { text: You're not in the boat! }
    triggers:
      - type: response
        data: { text: You are no longer in the magic boat. }
      - type: set-flag
        data: { flag: aboard, value: false }

  # The Cyclops Room answers this one for itself while the cyclops is there to
  # hear it; everywhere else, and once he is gone, it is just a name.
  - id: odysseus
    triggers:
      - type: response
        data:
          text: Wasn't he a sailor?

  # Zork's own joke at a different game's expense - XYZZY and PLUGH teleport in
  # Adventure, and are just a word here too.
  - id: xyzzy
    triggers:
      - type: response
        data:
          text: A hollow voice says "Fool."

  # ZIL picks one of four lines with no memory between calls: one roll of four
  # a turn, and four answers to the verb each claiming one index of it. The
  # first whose requirements hold is the one that speaks.
  - id: hello
    requires:
      - type: chance
        data: { name: hello, of: 4, index: 1 }
    triggers:
      - type: response
        data:
          text: Hello.

  - id: hello
    requires:
      - type: chance
        data: { name: hello, of: 4, index: 2 }
    triggers:
      - type: response
        data:
          text: Good day.

  - id: hello
    requires:
      - type: chance
        data: { name: hello, of: 4, index: 3 }
    triggers:
      - type: response
        data:
          text: Nice weather we've been having lately.

  - id: hello
    requires:
      - type: chance
        data: { name: hello, of: 4, index: 4 }
    triggers:
      - type: response
        data:
          text: Goodbye.

  - id: yell
    triggers:
      - type: response
        data:
          text: Aaaarrrrgggghhhh!

  - id: zork
    triggers:
      - type: response
        data:
          text: At your service!

  - id: frobozz
    triggers:
      - type: response
        data:
          text: The FROBOZZ Corporation created, owns, and operates this dungeon.

  - id: win
    triggers:
      - type: response
        data:
          text: Naturally!

  - id: mumble
    triggers:
      - type: response
        data:
          text: You'll have to speak up if you expect me to hear you!

  - id: chomp
    triggers:
      - type: response
        data:
          text: Preposterous!

  - id: repent
    triggers:
      - type: response
        data:
          text: It could very well be too late!

  - id: wish
    triggers:
      - type: response
        data:
          text: With luck, your wish will come true.
