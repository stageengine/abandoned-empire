id: leaves
name: pile of leaves

synonyms: [leaves, leaf, pile]
portable: true
size: weight
measures:
  - id: weight
    max: 25
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: On the ground is a pile of leaves.
start: grating-clearing

# Everything that disturbs the leaves reveals the grating, which is `grate-revealed`
# throughout: the grate's own `requires` reads it, so does the clearing's
# description, and so does the way down. ZIL keeps the same flag and calls it the
# same thing.
actions:
  - id: count
    triggers:
      - type: response
        data:
          text: There are 69,105 leaves here.

  # Burning them in your hands is one of Zork's quieter deaths. Written above the
  # ordinary burn, because the first requirement that holds decides which action
  # this is and being on fire is the particular case.
  - id: burn
    requires:
      - type: has-item
        data:
          object: leaves
    triggers:
      - type: response
        data:
          text: The leaves burn, and so do you.
      # `player-died` rather than `end-game`: every death in ZIL goes through
      # one routine, `JIGS-UP`, which gives every one of them the same two
      # resurrections before the third is final - this one included.
      - type: set-flag
        data:
          flag: player-died
          value: true

  - id: burn
    triggers:
      - type: response
        data:
          text: The leaves burn.
      - type: set-flag
        data:
          flag: grate-revealed
          value: true
      - type: remove-object
        data:
          object: leaves

  - id: cut
    triggers:
      - type: response
        data:
          text: You rustle the leaves around, making quite a mess.
      - type: set-flag
        data:
          flag: grate-revealed
          value: true

  # Moving them and taking them both reveal it, and each says so its own way.
  # Once it is revealed neither says anything further, which is what ZIL's
  # `LEAVES-APPEAR` guards with the same flag.
  - id: move
    requires:
      - type: flag
        negate: true
        data:
          flag: grate-revealed
    triggers:
      - type: response
        data:
          text: 'Done.'
      - type: response
        data:
          text: In disturbing the pile of leaves, a grating is revealed.
      - type: set-flag
        data:
          flag: grate-revealed
          value: true

  - id: move
    triggers:
      - type: response
        data:
          text: 'Done.'

  - id: get
    requires:
      - type: flag
        negate: true
        data:
          flag: grate-revealed
    triggers:
      - type: response
        data:
          text: In disturbing the pile of leaves, a grating is revealed.
      - type: set-flag
        data:
          flag: grate-revealed
          value: true
      - type: add-to-inventory
        data:
          object: leaves
          announce: true

  # Looking under them shows the grating and then hides it again, which is the one
  # way of finding it that leaves you no better off.
  - id: look
    preposition: under
    requires:
      - type: flag
        negate: true
        data:
          flag: grate-revealed
    triggers:
      - type: response
        data:
          text: >-
            Underneath the pile of leaves is a grating. As you release the leaves, the grating
            is once again concealed from view.

  # Once it has been found there is nothing under them, and Zork's own words for
  # nothing-under-there are these.
  - id: look
    preposition: under
    triggers:
      - type: response
        data:
          text: There is nothing but dust there.
