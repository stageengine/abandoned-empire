id: broken-egg
name: broken jewel-encrusted egg

synonyms:
  - egg
  - treasure
  - broken egg
  - broken treasure
  - birds egg
  - birds treasure
  - encrusted egg
  - encrusted treasure
  - jewel egg
  - jewel treasure
portable: true
size: weight
measures:
  - id: weight
    max: 5
contains: true
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a somewhat ruined egg here.
start: offstage

actions:
  - id: open
    triggers:
      - type: response
        data:
          text: >-
            Opening the broken egg reveals a broken clockwork canary.

  - id: close
    triggers:
      - type: response
        data:
          text: >-
            Closed.
