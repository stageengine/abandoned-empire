id: advertisement
name: leaflet

synonyms:
  - advertisement
  - booklet
  - mail
  - small advertisement
  - small leaflet
  - small booklet
  - small mail
portable: true
size: weight
measures:
  - id: weight
    max: 2
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: A small leaflet is on the ground.
start: in:mailbox

actions:
  - id: look
    triggers:
      - type: response
        data:
          text: |-
            "WELCOME TO ZORK!

            ZORK is a game of adventure, danger, and low cunning. In it you will explore some of the most amazing territory ever seen by mortals. No computer should be without one!"
