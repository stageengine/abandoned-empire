id: mirror-2
name: mirror

synonyms: [reflection, enormous]
start: mirror-room-2

actions:
  - id: get
    triggers:
      - type: response
        data: { text: The mirror is many times your size. Give up. }

  # ZIL answers `MUNG`/`THROW`/`ATTACK` alike with the same break, `mung`
  # already one of `break`'s own synonyms - `attack`/`throw` are separate
  # verbs here, so each needs its own copy of the same one-shot gate the
  # trap door already uses: the first go breaks it, and only it says so.
  # `mirror-mung` is shared with `mirror-1.object.yaml`: ZIL keeps one flag
  # for the one mirror these two objects are the two sides of.
  - id: break
    requires:
      - type: flag
        negate: true
        data: { flag: mirror-mung }
        failure:
          triggers:
            - type: response
              data:
                text: "Haven't you done enough damage already?"
    triggers:
      - type: response
        data:
          text: >-
            You have broken the mirror. I hope you have a seven years' supply of good luck
            handy.
      - type: set-flag
        data: { flag: mirror-mung, value: true }

  - id: attack
    requires:
      - type: flag
        negate: true
        data: { flag: mirror-mung }
        failure:
          triggers:
            - type: response
              data:
                text: "Haven't you done enough damage already?"
    triggers:
      - type: response
        data:
          text: >-
            You have broken the mirror. I hope you have a seven years' supply of good luck
            handy.
      - type: set-flag
        data: { flag: mirror-mung, value: true }

  - id: throw
    requires:
      - type: flag
        negate: true
        data: { flag: mirror-mung }
        failure:
          triggers:
            - type: response
              data:
                text: "Haven't you done enough damage already?"
    triggers:
      - type: response
        data:
          text: >-
            You have broken the mirror. I hope you have a seven years' supply of good luck
            handy.
      - type: set-flag
        data: { flag: mirror-mung, value: true }

  - id: look
    requires:
      - type: flag
        data: { flag: mirror-mung }
    triggers:
      - type: response
        data: { text: The mirror is broken into many pieces. }

  - id: look
    triggers:
      - type: response
        data: { text: There is an ugly person staring back at you. }

  # ZIL only reads this as the reciprocal of a bare hand: rubbed with
  # something held instead, the mirror answers with a tingle and nothing
  # moves - no `indirect` named, so this one block catches whatever the
  # something was. ZIL says which ("transmitted through the <D ,PRSI>"); this
  # engine has no placeholder for the tool a sentence named, only for a
  # measure, so it says the same thing without naming it back.
  - id: touch
    preposition: with
    triggers:
      - type: response
        data:
          text: You feel a faint tingling transmitted through it.

  # The whole of the mirror puzzle: touching one puts you in the other room, and
  # ZIL swaps the contents of the two so that it reads as one mirror rather than two.
  # The rooms are the same size and hold the same nothing, so the move is the half
  # that matters. Broken glass reflects nothing to fall into - the same one-shot
  # shape as the mirror's own gate above, its own failure silent since ZIL simply
  # answers a broken mirror's `RUB` as no verb it knows at all.
  - id: touch
    requires:
      - type: flag
        negate: true
        data: { flag: mirror-mung }
    triggers:
      - type: response
        data:
          text: There is a rumble from deep within the earth and the room shakes.
      - type: change-scene
        data: { scene: mirror-room-1 }
