id: trident
name: crystal trident

synonyms:
  - trident
  - fork
  - treasure
  - poseidon trident
  - poseidon fork
  - poseidon treasure
  - own trident
  - own fork
  - own treasure
  - crystal fork
  - crystal treasure
portable: true
size: 20
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: trident }
    triggers:
      - type: response
        data:
          text: On the shore lies Poseidon's own crystal trident.
  - triggers:
      - type: response
        data:
          text: There is a crystal trident here.
start: atlantis-room
