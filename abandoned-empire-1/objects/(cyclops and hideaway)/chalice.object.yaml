id: chalice

synonyms:
  - cup
  - silver
  - treasure
  - silver chalice
  - silver cup
  - silver silver
  - silver treasure
  - engravings chalice
  - engravings cup
  - engravings silver
  - engravings treasure
portable: true
size: weight
measures:
  - id: weight
    max: 10
tags: [treasure]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a silver chalice, intricately engraved, here.
start: treasure-room

actions:
  - id: put
    preposition: in
    triggers:
      - type: response
        data:
          text: "You can't. It's not a very good chalice, is it?"
