id: inflated-boat
name: magic boat

synonyms:
  - boat
  - raft
  - inflat boat
  - inflat raft
  - magic raft
  - plastic boat
  - plastic raft
  - seaworthy boat
  - seaworthy raft
portable: true
size: weight
measures:
  - id: weight
    max: 20
contains: true
tags: [belongings]
conditions:
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a magic boat here.
start: offstage

actions:
  - id: inflate
    triggers:
      - type: response
        data: { text: Inflating it further would probably burst it. }

  - id: get
    triggers:
      - type: response
        data:
          text: The boat is too heavy to carry about unless it is deflated.
  - id: open
    triggers:
      - type: response
        data:
          text: >-
            Opening the boat reveals a tan label.

  - id: close
    triggers:
      - type: response
        data:
          text: >-
            Closed.

  - id: deflate
    triggers:
      - type: response
        data: { text: The boat deflates. }
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: inflatable-boat, to: here }
      - type: set-flag
        data: { flag: deflate, value: true }

  - id: board
    conditions:
      - type: any-of
        data:
          conditions:
            - type: has-item
              data: { object: sceptre }
            - type: has-item
              data: { object: knife }
            - type: has-item
              data: { object: sword }
            - type: has-item
              data: { object: rusty-knife }
            - type: has-item
              data: { object: axe }
            - type: has-item
              data: { object: stiletto }
    triggers:
      - type: response
        data:
          text: >-
            Oops! Something sharp seems to have slipped and punctured the boat. The boat
            deflates to the sounds of hissing, sputtering, and cursing.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }

  - id: board
    triggers:
      - type: response
        data: { text: You are now in the magic boat. }
      - type: set-flag
        data: { flag: aboard, value: true }

  - id: put
    preposition: in
    indirect: sceptre
    conditions:
      - type: flag
        data: { flag: aboard }
      - type: any-of
        data:
          conditions:
            - type: scene
              data: { id: reservoir }
            - type: scene
              data: { id: in-stream }
    triggers:
      - type: response
        data:
          text: >-
            It seems that the sceptre didn't agree with the boat, as evidenced by the loud hissing noise
            issuing therefrom. With a pathetic sputter, the boat deflates, leaving you without.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }
      - type: response
        data:
          text: >-
            Another pathetic sputter, this time from you, heralds your drowning.
      - type: set-flag
        data: { flag: player-died, value: true }

  - id: put
    preposition: in
    indirect: sceptre
    conditions:
      - type: flag
        data: { flag: aboard }
      - type: scene
        data: { tag: river }
    triggers:
      - type: response
        data:
          text: >-
            It seems that the sceptre didn't agree with the boat, as evidenced by the loud hissing noise
            issuing therefrom. With a pathetic sputter, the boat deflates, leaving you without.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }
      - type: response
        data:
          text: >-
            In other words, fighting the fierce currents of the Frigid River. You manage to hold your own
            for a bit, but then you are carried over a waterfall and into some nasty rocks. Ouch!
      - type: set-flag
        data: { flag: player-died, value: true }

  - id: put
    preposition: in
    indirect: sceptre
    conditions:
      - type: flag
        data: { flag: aboard }
    triggers:
