id: sceptre

synonyms:
  - scepter
  - treasure
  - sharp sceptre
  - sharp scepter
  - sharp treasure
  - egyptian sceptre
  - egyptian scepter
  - egyptian treasure
  - ancient sceptre
  - ancient scepter
  - ancient treasure
  - enameled sceptre
  - enameled scepter
  - enameled treasure
portable: true
size: 3
tags: [treasure]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: sceptre }
    triggers:
      - type: response
        data:
          text: >-
            A sceptre, possibly that of ancient Egypt itself, is in the coffin. The sceptre is ornamented with
            colored enamel, and tapers to a sharp point.
  - triggers:
      - type: response
        data:
          text: An ornamented sceptre, tapering to a sharp point, is here.
start: in:coffin

actions:
  # Zork opens the rainbow from either end of it. The port has the one end.
  - id: wave
    triggers:
      - type: response
        data:
          text: >-
            Suddenly, the rainbow appears to become solid and, I venture, walkable (I think the
            giveaway was the stairs and bannister).
      - type: set-flag
        data: { flag: rainbow-flag, value: true }

  - id: raise
    triggers:
      - type: response
        data:
          text: >-
            Suddenly, the rainbow appears to become solid and, I venture, walkable (I think the
            giveaway was the stairs and bannister).
      - type: set-flag
        data: { flag: rainbow-flag, value: true }
