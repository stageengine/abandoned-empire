id: sceptre

synonyms:
  - scepter
  - treasure
  - sharp sceptre
  - sharp scepter
  - sharp treasure
  - egyptian sceptre
  - egyptian scepter
  - egyptian treasure
  - ancient sceptre
  - ancient scepter
  - ancient treasure
  - enameled sceptre
  - enameled scepter
  - enameled treasure
portable: true
size: weight
measures:
  - id: weight
    max: 3
tags: [treasure]
requires:
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: sceptre }
    triggers:
      - type: response
        data:
          text: >-
            A sceptre, possibly that of ancient Egypt itself, is in the coffin. The sceptre is ornamented with
            colored enamel, and tapers to a sharp point.
  - triggers:
      - type: response
        data:
          text: An ornamented sceptre, tapering to a sharp point, is here.
start: in:coffin

actions:
  - id: drop
    requires:
      - type: flag
        data: { flag: aboard }
      - type: any-of
        data:
          conditions:
            - type: scene
              data: { id: reservoir }
            - type: scene
              data: { id: in-stream }
    triggers:
      - type: response
        data:
          text: >-
            It seems that the sceptre didn't agree with the boat, as evidenced by the loud hissing noise
            issuing therefrom. With a pathetic sputter, the boat deflates, leaving you without.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }
      - type: response
        data:
          text: >-
            Another pathetic sputter, this time from you, heralds your drowning.
      - type: set-flag
        data: { flag: player-died, value: true }

  - id: drop
    requires:
      - type: flag
        data: { flag: aboard }
      - type: scene
        data: { tag: river }
    triggers:
      - type: response
        data:
          text: >-
            It seems that the sceptre didn't agree with the boat, as evidenced by the loud hissing noise
            issuing therefrom. With a pathetic sputter, the boat deflates, leaving you without.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }
      - type: response
        data:
          text: >-
            In other words, fighting the fierce currents of the Frigid River. You manage to hold your own
            for a bit, but then you are carried over a waterfall and into some nasty rocks. Ouch!
      - type: set-flag
        data: { flag: player-died, value: true }

  - id: drop
    requires:
      - type: flag
        data: { flag: aboard }
    triggers:
      - type: response
        data:
          text: >-
            It seems that the sceptre didn't agree with the boat, as evidenced by the loud hissing noise
            issuing therefrom. With a pathetic sputter, the boat deflates, leaving you without.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }
      - type: set-flag
        data: { flag: aboard, value: false }

  - id: wave
    requires:
      - type: scene
        data: { id: end-of-rainbow }
      - type: flag
        negate: true
        data: { flag: rainbow-flag }
    triggers:
      - type: response
        data:
          text: >-
            Suddenly, the rainbow appears to become solid and, I venture, walkable (I think the
            giveaway was the stairs and bannister).
      - type: response
        data:
          text: A shimmering pot of gold appears at the end of the rainbow.
      - type: set-flag
        data: { flag: rainbow-flag, value: true }

  - id: raise
    requires:
      - type: scene
        data: { id: end-of-rainbow }
      - type: flag
        negate: true
        data: { flag: rainbow-flag }
    triggers:
      - type: response
        data:
          text: >-
            Suddenly, the rainbow appears to become solid and, I venture, walkable (I think the
            giveaway was the stairs and bannister).
      - type: response
        data:
          text: A shimmering pot of gold appears at the end of the rainbow.
      - type: set-flag
        data: { flag: rainbow-flag, value: true }

  - id: wave
    requires:
      - type: scene
        data: { id: aragain-falls }
      - type: flag
        negate: true
        data: { flag: rainbow-flag }
    triggers:
      - type: response
        data:
          text: >-
            Suddenly, the rainbow appears to become solid and, I venture, walkable (I think the
            giveaway was the stairs and bannister).
      - type: set-flag
        data: { flag: rainbow-flag, value: true }

  - id: raise
    requires:
      - type: scene
        data: { id: aragain-falls }
      - type: flag
        negate: true
        data: { flag: rainbow-flag }
    triggers:
      - type: response
        data:
          text: >-
            Suddenly, the rainbow appears to become solid and, I venture, walkable (I think the
            giveaway was the stairs and bannister).
      - type: set-flag
        data: { flag: rainbow-flag, value: true }

  - id: wave
    requires:
      - type: any-of
        data:
          conditions:
            - type: scene
              data: { id: end-of-rainbow }
            - type: scene
              data: { id: aragain-falls }
      - type: flag
        data: { flag: rainbow-flag }
    triggers:
      - type: response
        data:
          text: The rainbow seems to have become somewhat run-of-the-mill.
      - type: set-flag
        data: { flag: rainbow-flag, value: false }

  - id: raise
    requires:
      - type: any-of
        data:
          conditions:
            - type: scene
              data: { id: end-of-rainbow }
            - type: scene
              data: { id: aragain-falls }
      - type: flag
        data: { flag: rainbow-flag }
    triggers:
      - type: response
        data:
          text: The rainbow seems to have become somewhat run-of-the-mill.
      - type: set-flag
        data: { flag: rainbow-flag, value: false }

  - id: wave
    requires:
      - type: scene
        data: { id: on-rainbow }
    triggers:
      - type: response
        data:
          text: >-
            The structural integrity of the rainbow is severely compromised, leaving you hanging
            in midair, supported only by water vapor. Bye.
      - type: set-flag
        data: { flag: rainbow-flag, value: false }
      - type: set-flag
        data: { flag: player-died, value: true }

  - id: raise
    requires:
      - type: scene
        data: { id: on-rainbow }
    triggers:
      - type: response
        data:
          text: >-
            The structural integrity of the rainbow is severely compromised, leaving you hanging
            in midair, supported only by water vapor. Bye.
      - type: set-flag
        data: { flag: rainbow-flag, value: false }
      - type: set-flag
        data: { flag: player-died, value: true }

  - id: wave
    triggers:
      - type: response
        data:
          text: A dazzling display of color briefly emanates from the sceptre.

  - id: raise
    triggers:
      - type: response
        data:
          text: A dazzling display of color briefly emanates from the sceptre.
