id: prayer

synonyms:
  - inscription
  - ancient prayer
  - ancient inscription
  - old prayer
  - old inscription
start: north-temple

actions:
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            The prayer is inscribed in an ancient script, rarely used today. It seems to be a
            philippic against small insects, absent-mindedness, and the picking up and dropping
            of small objects. The final verse consigns trespassers to the land of the dead. All
            evidence indicates that the beliefs of the ancient Zorkers were obscure.
