id: bracelet
name: sapphire-encrusted bracelet

synonyms:
  - bracelet
  - jewel
  - sapphire
  - treasure
  - sapphire bracelet
  - sapphire jewel
  - sapphire sapphire
  - sapphire treasure
portable: true
size: weight
measures:
  - id: weight
    max: 10
tags: [treasure]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a sapphire-encrusted bracelet here.
start: gas-room
