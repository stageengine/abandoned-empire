id: machine

synonyms: [pdp10, dryer, lid]
start: machine-room

# So `put coal in machine` has somewhere to put it: the engine's own `put`
# refuses into anything not declared a container, and this one had never said
# so - `turn switch with screwdriver` is what reads whatever ended up inside.
contains: true

actions:
  - id: get
    triggers:
      - type: response
        data: { text: It is far too large to carry. }

  - id: open
    triggers:
      - type: response
        data: { text: The lid opens. }
      - type: set-flag
        data: { flag: machine-open, value: true }

  - id: close
    triggers:
      - type: response
        data: { text: The lid closes. }
      - type: set-flag
        data: { flag: machine-open, value: false }

  - id: turn
    triggers:
      - type: response
        data:
          text: It's not clear how to turn it on with your bare hands.
