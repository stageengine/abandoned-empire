id: inflated-boat
name: magic boat

synonyms:
  - boat
  - raft
  - inflat boat
  - inflat raft
  - magic raft
  - plastic boat
  - plastic raft
  - seaworthy boat
  - seaworthy raft
portable: true
size: weight
measures:
  - id: weight
    max: 20
contains: true
tags: [belongings]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a magic boat here.
start: offstage

actions:
  - id: inflate
    triggers:
      - type: response
        data: { text: Inflating it further would probably burst it. }

  - id: get
    triggers:
      - type: response
        data:
          text: The boat is too heavy to carry about unless it is deflated.
  - id: open
    triggers:
      - type: response
        data:
          text: >-
            Opening the boat reveals a tan label.

  - id: close
    triggers:
      - type: response
        data:
          text: >-
            Closed.

  # The narrow paths at the White Cliffs read `deflate` rather than the boat's own
  # state, exactly as ZIL's global does - so re-inflating below clears it again.
  - id: deflate
    triggers:
      - type: response
        data: { text: The boat deflates. }
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: inflatable-boat, to: here }
      - type: set-flag
        data: { flag: deflate, value: true }

  # ZIL punctures the boat the moment anything sharp comes aboard in your hands -
  # written above the plain boarding because the first requirement that holds
  # decides which of the two this is.
  - id: board
    requires:
      - type: any-of
        data:
          conditions:
            - type: has-item
              data: { object: sceptre }
            - type: has-item
              data: { object: knife }
            - type: has-item
              data: { object: sword }
            - type: has-item
              data: { object: rusty-knife }
            - type: has-item
              data: { object: axe }
            - type: has-item
              data: { object: stiletto }
    triggers:
      - type: response
        data:
          text: >-
            Oops! Something sharp seems to have slipped and punctured the boat. The boat
            deflates to the sounds of hissing, sputtering, and cursing.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }

  - id: board
    triggers:
      - type: response
        data: { text: You are now in the magic boat. }
      - type: set-flag
        data: { flag: aboard, value: true }

  # ZIL punctures the boat the same way while already aboard: dropping a
  # weapon, putting one in the boat, or attacking/mung-ing the boat with one.
  # `RBOAT-FUNCTION`'s own M-BEG intercepts all three before any of their
  # ordinary handling runs, so none of them actually move or damage anything
  # except the boat itself - the weapon named stays exactly where it was.
  # Mid-river (`scene: { tag: river }`, ZIL's `NONLANDBIT`) this is fatal, the
  # same "carried over a waterfall" death the current's own timer ends in;
  # elsewhere (docked on land) it just costs the boat. `drop` lives on each
  # weapon's own file instead of here, since a bare `drop` names no second
  # object for this file's own `indirect` to answer.
  - id: put
    preposition: in
    indirect: sceptre
    requires:
      - type: flag
        data: { flag: aboard }
      - type: scene
        data: { tag: river }
    triggers:
      - type: response
        data:
          text: >-
            It seems that the sceptre didn't agree with the boat, as evidenced by the loud hissing noise
            issuing therefrom. With a pathetic sputter, the boat deflates, leaving you without.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }
      - type: response
        data:
          text: >-
            In other words, fighting the fierce currents of the Frigid River. You manage to hold your own
            for a bit, but then you are carried over a waterfall and into some nasty rocks. Ouch!
      - type: set-flag
        data: { flag: player-died, value: true }

  - id: put
    preposition: in
    indirect: sceptre
    requires:
      - type: flag
        data: { flag: aboard }
    triggers:
      - type: response
        data:
          text: >-
            It seems that the sceptre didn't agree with the boat, as evidenced by the loud hissing noise
            issuing therefrom. With a pathetic sputter, the boat deflates, leaving you without.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }
      - type: set-flag
        data: { flag: aboard, value: false }

