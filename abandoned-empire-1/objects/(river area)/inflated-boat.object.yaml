  # written above the plain disembark for the same reason boarding's puncture is.
  # `launch` and `disembark` moved to `actions.yaml`: neither takes an object
  # in ZIL, so both have to be bare verbs to be typed the way the walkthrough
  # types them, and a bare verb's actions live in the game's own list, not on
  # the thing it happens to act on. See them there for the comments this used
  # to carry.
