id: inflated-boat
name: magic boat

synonyms:
  - boat
  - raft
  - inflat boat
  - inflat raft
  - magic raft
  - plastic boat
  - plastic raft
  - seaworthy boat
  - seaworthy raft
portable: true
size: weight
measures:
  - id: weight
    max: 20
contains: true
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a magic boat here.
start: offstage

actions:
  - id: inflate
    triggers:
      - type: response
        data: { text: Inflating it further would probably burst it. }

  - id: get
    triggers:
      - type: response
        data:
          text: The boat is too heavy to carry about unless it is deflated.
  - id: open
    triggers:
      - type: response
        data:
          text: >-
            Opening the boat reveals a tan label.

  - id: close
    triggers:
      - type: response
        data:
          text: >-
            Closed.

  # The narrow paths at the White Cliffs read `deflate` rather than the boat's own
  # state, exactly as ZIL's global does - so re-inflating below clears it again.
  - id: deflate
    triggers:
      - type: response
        data: { text: The boat deflates. }
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: inflatable-boat, to: here }
      - type: set-flag
        data: { flag: deflate, value: true }

  # ZIL punctures the boat the moment anything sharp comes aboard in your hands -
  # written above the plain boarding because the first requirement that holds
  # decides which of the two this is.
  - id: board
    requires:
      - type: any-of
        data:
          conditions:
            - type: has-item
              data: { object: sceptre }
            - type: has-item
              data: { object: knife }
            - type: has-item
              data: { object: sword }
            - type: has-item
              data: { object: rusty-knife }
            - type: has-item
              data: { object: axe }
            - type: has-item
              data: { object: stiletto }
    triggers:
      - type: response
        data:
          text: >-
            Oops! Something sharp seems to have slipped and punctured the boat. The boat
            deflates to the sounds of hissing, sputtering, and cursing.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }

  - id: board
    triggers:
      - type: response
        data: { text: You are now in the magic boat. }
      - type: set-flag
        data: { flag: aboard, value: true }

  # Every room the current runs through is water with nothing to stand on, so
  # climbing out mid-river is the same fate as launching from nowhere is not -
  # written above the plain disembark for the same reason boarding's puncture is.
  # `launch` and `disembark` moved to `actions.yaml`: neither takes an object
  # in ZIL, so both have to be bare verbs to be typed the way the walkthrough
  # types them, and a bare verb's actions live in the game's own list, not on
  # the thing it happens to act on. See them there for the comments this used
  # to carry.
