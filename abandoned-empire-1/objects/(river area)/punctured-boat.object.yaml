id: punctured-boat
name: punctured boat

synonyms:
  - boat
  - pile
  - plastic
  - plastic boat
  - plastic pile
  - plastic plastic
  - puncture boat
  - puncture pile
  - puncture plastic
  - large boat
  - large pile
  - large plastic
portable: true
size: weight
measures:
  - id: weight
    max: 20
tags: [belongings]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a punctured boat here.
start: offstage

actions:
  - id: inflate
    triggers:
      - type: response
        data: { text: No chance. Some moron punctured it. }

  - id: board
    triggers:
      - type: response
        data: { text: No chance. Some moron punctured it. }
