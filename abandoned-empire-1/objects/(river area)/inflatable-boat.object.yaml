id: inflatable-boat
name: pile of plastic

synonyms:
  - boat
  - pile
  - plastic
  - valve
  - plastic boat
  - plastic pile
  - plastic plastic
  - plastic valve
  - inflat boat
  - inflat pile
  - inflat plastic
  - inflat valve
portable: true
size: weight
measures:
  - id: weight
    max: 20
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a folded pile of plastic here which has a small valve attached.
start: dam-base

actions:
  - id: inflate
    preposition: with
    indirect: pump
    requires:
      - type: has-item
        data: { object: pump }
    triggers:
      - type: response
        data: { text: The boat inflates and appears seaworthy. }
      - type: move-object
        data: { object: inflatable-boat, to: offstage }
      - type: move-object
        data: { object: inflated-boat, to: here }
      - type: set-flag
        data: { flag: deflate, value: false }

  - id: inflate
    triggers:
      - type: response
        data:
          text: With what? Your lungs?
