id: buoy
name: red buoy

synonyms: [buoy]
portable: true
size: 10
contains: true
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: buoy }
    triggers:
      - type: response
        data:
          text: There is a red buoy here (probably a warning).
  - triggers:
      - type: response
        data:
          text: There is a red buoy here.
start: river-4

actions:
  - id: open
    triggers:
      - type: response
        data:
          text: Opening the buoy reveals a large emerald.
      - type: move-object
        data: { object: emerald, to: here }
