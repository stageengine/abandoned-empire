id: pot-of-gold
name: pot of gold

synonyms: [pot, gold, treasure, gold pot, gold gold, gold treasure]
portable: true
size: 15
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: pot-of-gold }
    triggers:
      - type: response
        data:
          text: At the end of the rainbow is a pot of gold.
  - triggers:
      - type: response
        data:
          text: There is a pot of gold here.
start: end-of-rainbow
