id: rope

synonyms: [hemp, coil, large rope, large hemp, large coil]
portable: true
size: weight
measures:
  - id: weight
    max: 10
tags: [belongings]
conditions:
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - conditions:
      - type: handled
        negate: true
        data: { object: rope }
    triggers:
      - type: response
        data:
          text: A large coil of rope is lying in the corner.
  - triggers:
      - type: response
        data:
          text: There is a rope here.
start: attic

actions:
  - id: tie
    conditions:
      - type: object-here
        data:
          object: railing
      - type: flag
        negate: true
        data:
          flag: dome-flag
        failure:
          triggers:
            - type: response
              data:
                text: The rope is already tied to it.
    triggers:
      - type: response
        data:
          text: The rope drops over the side and comes within ten feet of the floor.
      - type: set-flag
        data:
          flag: dome-flag
          value: true
      - type: move-object
        data:
          object: rope
          to: here

  - id: tie
    triggers:
      - type: response
        data:
          text: You can't tie the rope to that.

  - id: untie
    conditions:
      - type: flag
        data:
          flag: dome-flag
        failure:
          triggers:
            - type: response
              data:
                text: It is not tied to anything.
    triggers:
      - type: response
        data:
          text: The rope is now untied.
      - type: set-flag
        data:
          flag: dome-flag
          value: false

  - id: get
    conditions:
      - type: flag
        data:
          flag: dome-flag
    triggers:
      - type: response
        data:
          text: The rope is tied to the railing.

  - id: drop
    conditions:
      - type: scene
        data:
          id: dome-room
      - type: flag
        negate: true
        data:
          flag: dome-flag
    triggers:
      - type: response
        data:
          text: The rope drops gently to the floor below.
      - type: move-object
        data:
          object: rope
          to: torch-room

  - id: look
    conditions:
      - type: flag
        data:
          flag: dome-flag
    triggers:
      - type: response
        data:
          text: A hank of rope, tied to the railing and hanging down over the side.

  - id: look
    triggers:
      - type: response
        data:
          text: A large coil of rope.
