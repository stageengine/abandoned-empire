id: brown-button
name: brown button

synonyms: [brown switch]
start: maintenance-room

actions:
  - id: move
    triggers:
      - type: response
        data:
          text: Click.
      - type: set-flag
        data:
          flag: gate-flag
          value: false


  - id: look
    triggers:
      - type: response
        data:
          text: A brown button, set into the wall beside three others.

  - id: get
    triggers:
      - type: response
        data:
          text: The button is set into the wall.
