id: screwdriver

synonyms:
  - tool
  - tools
  - driver
  - screw screwdriver
  - screw tool
  - screw tools
  - screw driver
portable: true
size: 5
tags: [basket-cargo]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a screwdriver here.
start: maintenance-room
