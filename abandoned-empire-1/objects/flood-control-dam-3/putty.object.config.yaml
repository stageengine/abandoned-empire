id: putty
name: viscous material

synonyms: [material, gunk, viscous gunk, all-purpose gunk]
portable: true
size: weight
measures:
  - id: weight
    max: 6
tags: [belongings]
conditions:
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a viscous material here.
start: in:tube

actions:
  - id: oil
    triggers:
      - type: response
        data:
          text: The all-purpose gunk isn't a lubricant.

  - id: look
    triggers:
      - type: response
        data:
          text: A wad of grey, viscous, all-purpose gunk, of no obvious use until it has one.
