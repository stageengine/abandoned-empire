id: tube

synonyms: [tooth, paste, tube of toothpaste]
portable: true
size: weight
measures:
  - id: weight
    max: 5
contains: true
tags: [belongings]
conditions:
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is an object which looks like a tube of toothpaste here.
start: maintenance-room

actions:
  - id: squeeze
    once:
      failure:
        triggers:
          - type: response
            data:
              text: The tube is apparently empty.
    triggers:
      - type: response
        data:
          text: The viscous material oozes into your hand.
      - type: add-to-inventory
        data:
          object: putty

  - id: put
    preposition: in
    triggers:
      - type: response
        data:
          text: The tube refuses to accept anything.

  - id: look
    triggers:
      - type: response
        data:
          text: |-
            ---> Frobozz Magic Gunk Company <---
            All-Purpose Gunk
  - id: open
    triggers:
      - type: response
        data:
          text: >-
            Opening the tube reveals a viscous material.

  - id: close
    triggers:
      - type: response
        data:
          text: >-
            Closed.
