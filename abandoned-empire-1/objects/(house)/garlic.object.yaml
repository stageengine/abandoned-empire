id: garlic
name: clove of garlic

synonyms: [garlic, clove]
portable: true
size: weight
measures:
  - id: weight
    max: 4
tags: [belongings]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a clove of garlic here.
start: in:sandwich-bag

actions:
  - id: eat
    triggers:
      - type: response
        data:
          text: >-
            What the heck! You won't make friends this way, but nobody around here is too
            friendly anyhow. Gulp!
      - type: remove-object
        data: { object: garlic }
