id: sword

synonyms:
  - orcrist
  - glamdring
  - blade
  - elvish sword
  - elvish orcrist
  - elvish glamdring
  - elvish blade
  - old sword
  - old orcrist
  - old glamdring
  - old blade
  - antique sword
  - antique orcrist
  - antique glamdring
  - antique blade
portable: true
size: weight
measures:
  - id: weight
    max: 30
  # ZIL's `I-SWORD` computes this same 0/1/2 each turn and only speaks when it
  # actually changes - a threshold fires exactly on that change, so
  # `every-turn.yaml`'s own glow rules just set the number the current room
  # earns and this says what crossing into it means. See those rules for the
  # five ZIL calls it (`INFESTED?`: any non-fled, non-dead villain) and the
  # one-hop neighbor list each of the four fixed ones earns a room.
  - id: glow
    max: 2
    start: 0
    thresholds:
      - from: 0
        triggers:
          - type: response
            data:
              text: Your sword is no longer glowing.
      - from: 1
        triggers:
          - type: response
            data:
              text: Your sword is glowing with a faint blue glow.
      - from: 2
        triggers:
          - type: response
            data:
              text: Your sword has begun to glow very brightly.
tags: [belongings]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: sword }
    triggers:
      - type: response
        data:
          text: Above the trophy case hangs an elvish sword of great antiquity.
  - triggers:
      - type: response
        data:
          text: There is a sword here.
start: living-room

actions:
  # ZIL punctures the boat the instant a weapon like this one is dropped while
  # aboard - RBOAT-FUNCTION's own M-BEG answers `DROP` before this object's
  # ordinary drop ever runs, so the weapon stays in hand rather than actually
  # landing anywhere. Written above the plain drop for the same reason the
  # boat's own boarding-puncture is. See `inflated-boat.object.yaml` for the
  # matching `put ... in` and `attack ... with` shapes of the same fix.
  - id: drop
    requires:
      - type: flag
        data: { flag: aboard }
      - type: any-of
        data:
          conditions:
            - type: scene
              data: { id: reservoir }
            - type: scene
              data: { id: in-stream }
    triggers:
      - type: response
        data:
          text: >-
            It seems that the sword didn't agree with the boat, as evidenced by the loud hissing noise
            issuing therefrom. With a pathetic sputter, the boat deflates, leaving you without.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }
      - type: response
        data:
          text: >-
            Another pathetic sputter, this time from you, heralds your drowning.
      - type: set-flag
        data: { flag: player-died, value: true }

  - id: drop
    requires:
      - type: flag
        data: { flag: aboard }
      - type: scene
        data: { tag: river }
    triggers:
      - type: response
        data:
          text: >-
            It seems that the sword didn't agree with the boat, as evidenced by the loud hissing noise
            issuing therefrom. With a pathetic sputter, the boat deflates, leaving you without.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }
      - type: response
        data:
          text: >-
            In other words, fighting the fierce currents of the Frigid River. You manage to hold your own
            for a bit, but then you are carried over a waterfall and into some nasty rocks. Ouch!
      - type: set-flag
        data: { flag: player-died, value: true }

  - id: drop
    requires:
      - type: flag
        data: { flag: aboard }
    triggers:
      - type: response
        data:
          text: >-
            It seems that the sword didn't agree with the boat, as evidenced by the loud hissing noise
            issuing therefrom. With a pathetic sputter, the boat deflates, leaving you without.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }
      - type: set-flag
        data: { flag: aboard, value: false }

  # `SWORD-FCN`'s own EXAMINE branch says one of these two lines or nothing
  # at all - there is no third, "not glowing" case in ZIL, since "no longer
  # glowing" is exclusively `I-SWORD`'s own transition announcement
  # (`every-turn.yaml`), never something `examine` says on its own. The
  # block this replaces said it on every non-glowing look, including the
  # very first, before the sword had ever glowed at all.
  # `SWORD-FCN`'s own EXAMINE branch reads the same stored glow value
  # `I-SWORD` computes, rather than re-deriving it - the `glow` measure is
  # that value here too, so examining just reads it back.
  - id: look
    requires:
      - type: measure
        data: { subject: sword, measure: glow, min: 2 }
    triggers:
      - type: response
        data: { text: Your sword is glowing very brightly. }

  - id: look
    requires:
      - type: measure
        data: { subject: sword, measure: glow, min: 1, max: 1 }
    triggers:
      - type: response
        data: { text: Your sword is glowing with a faint blue glow. }

  # Restores the engine's own generic examine text: an authored `look` block
  # answers for itself once it exists at all, rather than falling through to
  # that default on its own when the block above does not match, so the
  # plain case needs saying explicitly here.
  - id: look
    triggers:
      - type: response
        data: { text: There's nothing special about the sword. }
