id: water
name: quantity of water

synonyms: [water, quantity, liquid, h2o]
portable: true
size: weight
measures:
  - id: weight
    max: 4
tags: [belongings]
requires:
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a quantity of water here.
start: in:bottle

actions:
  - id: drink
    triggers:
      - type: response
        data:
          text: "Thank you very much. I was rather thirsty (from all this talking, probably)."
      - type: remove-object
        data: { object: water }

  - id: get
    triggers:
      - type: response
        data:
          text: The water slips through your fingers.
