id: trophy-case
name: trophy case

synonyms: [case, trophy case]
contains: true
start: living-room

actions:
  - id: get
    triggers:
      - type: response
        data:
          text: The trophy case is securely fastened to the wall.


  - id: put
    preposition: in
    indirect: bag-of-coins
    triggers:
      - type: response
        data:
          text: Done.
      - type: move-object
        data:
          object: bag-of-coins
          to: offstage
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 5

