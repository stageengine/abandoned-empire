  - id: open
    requires:
      - type: flag
        data: { flag: won-flag }
    triggers:
      - type: response
        data:
          text: >-
            Opening the trophy case reveals an ancient map.

  - id: open
    triggers:
      - type: response
        data:
          text: Opened.

  - id: close
    triggers:
      - type: response
        data:
          text: >-
            Closed.
