id: map
name: ancient map

synonyms:
  - parchment
  - map
  - antique parchment
  - antique map
  - old parchment
  - old map
  - ancient parchment
portable: true
size: weight
measures:
  - id: weight
    max: 2
tags: [belongings]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }

  # ZIL's own map starts invisible and is cleared only once the score reaches
  # 350 (SCORE-UPD's WON-FLAG branch, gverbs.zil) - a secret rather than
  # furniture the case has held all along.
  - type: flag
    data: { flag: won-flag }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: map }
    triggers:
      - type: response
        data:
          text: In the trophy case is an ancient parchment which appears to be a map.
  - triggers:
      - type: response
        data:
          text: There is an ancient map here.
start: in:trophy-case

actions:
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            The map shows a forest with three clearings. The largest clearing contains a house.
            Three paths leave the large clearing. One of these paths, leading southwest, is
            marked "To Stone Barrow".
