id: broken-lamp
name: broken lantern

synonyms: [lamp, lantern, broken lamp, broken lantern, smashed lamp, smashed lantern]
portable: true
size: weight
measures:
  - id: weight
    max: 5
tags: [belongings]
requires:
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a broken lantern here.
start: offstage
