id: sandwich-bag
name: brown sack

synonyms:
  - bag
  - sack
  - brown bag
  - elongated bag
  - elongated sack
  - smelly bag
  - smelly sack
portable: true
size: 9
contains: true
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: sandwich-bag }
    triggers:
      - type: response
        data:
          text: On the table is an elongated brown sack, smelling of hot peppers.
  - triggers:
      - type: response
        data:
          text: There is a brown sack here.
# In the kitchen rather than inside the table. The line below already says it is
# sitting on the table, and a room lists what is standing in it rather than what is
# inside a container standing in it - so filed here, the prose reads as Zork's and
# the thing is where the player can see it.
start: kitchen

actions:
  - id: smell
    triggers:
      - type: response
        data: { text: It smells of hot peppers. }
  - id: open
    triggers:
      - type: response
        data:
          text: >-
            Opening the brown sack reveals a lunch and a clove of garlic.

  - id: close
    triggers:
      - type: response
        data:
          text: >-
            Closed.
