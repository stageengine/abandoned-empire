id: sandwich-bag
name: brown sack

synonyms:
  - bag
  - sack
  - brown bag
  - elongated bag
  - elongated sack
  - smelly bag
  - smelly sack
portable: true
size: weight
measures:
  - id: weight
    max: 9
contains: true
tags: [belongings]
requires:
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: sandwich-bag }
    triggers:
      - type: response
        data:
          text: On the table is an elongated brown sack, smelling of hot peppers.
  - triggers:
      - type: response
        data:
          text: There is a brown sack here.
start: kitchen

actions:
  - id: smell
    triggers:
      - type: response
        data: { text: It smells of hot peppers. }
  - id: open
    triggers:
      - type: response
        data:
          text: >-
            Opening the brown sack reveals a lunch and a clove of garlic.

  - id: close
    triggers:
      - type: response
        data:
          text: >-
            Closed.
