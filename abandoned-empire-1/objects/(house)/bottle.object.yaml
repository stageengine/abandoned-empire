id: bottle
name: glass bottle

synonyms: [bottle, container, clear bottle, clear container, glass container]
portable: true
size: weight
measures:
  - id: weight
    max: 5
contains: true
tags: [belongings]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: bottle }
      - type: object-in
        data: { object: water, location: in:bottle }
    triggers:
      - type: response
        data:
          text: >-
            A bottle is sitting on the table. The glass bottle contains: A quantity of water
  - requires:
      - type: handled
        negate: true
        data: { object: bottle }
    triggers:
      - type: response
        data:
          text: A bottle is sitting on the table.
  - triggers:
      - type: response
        data:
          text: There is a glass bottle here.
# In the kitchen rather than inside the table. The line below already says it is
# sitting on the table, and a room lists what is standing in it rather than what is
# inside a container standing in it - so filed here, the prose reads as Zork's and
# the thing is where the player can see it.
start: kitchen

actions:
  - id: throw
    triggers:
      - type: response
        data: { text: The bottle hits the far wall and shatters. }
      - type: remove-object
        data: { object: bottle }

  - id: shake
    triggers:
      - type: response
        data: { text: The water spills to the floor and evaporates. }
  - id: open
    triggers:
      - type: response
        data:
          text: >-
            Opening the glass bottle reveals a quantity of water.

  - id: close
    triggers:
      - type: response
        data:
          text: >-
            Closed.
