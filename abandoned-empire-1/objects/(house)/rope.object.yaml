id: rope

synonyms: [hemp, coil, large rope, large hemp, large coil]
portable: true
size: weight
measures:
  - id: weight
    max: 10
tags: [belongings]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: rope }
    triggers:
      - type: response
        data:
          text: A large coil of rope is lying in the corner.
  - triggers:
      - type: response
        data:
          text: There is a rope here.
start: attic

actions:
  # `to` is a filler preposition - it has to be, because `at` is a synonym of it
  # and `look at the fire` would otherwise need declaring on every description in
  # the game - and a filler throws away the second object before the action is
  # chosen. So `tie the rope to the railing` arrives as a bare `tie the rope`,
  # and the railing has to be found by asking whether it is in the room.
  - id: tie
    requires:
      - type: object-here
        data:
          object: railing
      - type: flag
        negate: true
        data:
          flag: dome-flag
        failure:
          triggers:
            - type: response
              data:
                text: The rope is already tied to it.
    triggers:
      - type: response
        data:
          text: The rope drops over the side and comes within ten feet of the floor.
      - type: set-flag
        data:
          flag: dome-flag
          value: true
      - type: move-object
        data:
          object: rope
          to: here

  - id: tie
    triggers:
      - type: response
        data:
          text: You can't tie the rope to that.

  - id: untie
    requires:
      - type: flag
        data:
          flag: dome-flag
        failure:
          triggers:
            - type: response
              data:
                text: It is not tied to anything.
    triggers:
      - type: response
        data:
          text: The rope is now untied.
      - type: set-flag
        data:
          flag: dome-flag
          value: false

  # Take it back while it is still tied and ZIL refuses outright, rather than
  # quietly detaching it the way a plain `get` would.
  - id: get
    requires:
      - type: flag
        data:
          flag: dome-flag
    triggers:
      - type: response
        data:
          text: The rope is tied to the railing.

  # Dropped untied in the Dome Room, ZIL's own `ROPE-FUNCTION` sends it
  # through the hole to the Torch Room floor below rather than leaving it
  # where it fell - the one way to lose the rope for good, since nothing ever
  # climbs back up to fetch it. Faithfully reproduced rather than softened:
  # `arch` favors matching a real risk over inventing a safety net ZIL itself
  # does not have.
  - id: drop
    requires:
      - type: scene
        data:
          id: dome-room
      - type: flag
        negate: true
        data:
          flag: dome-flag
    triggers:
      - type: response
        data:
          text: The rope drops gently to the floor below.
      - type: move-object
        data:
          object: rope
          to: torch-room

  - id: look
    requires:
      - type: flag
        data:
          flag: dome-flag
    triggers:
      - type: response
        data:
          text: A hank of rope, tied to the railing and hanging down over the side.

  - id: look
    triggers:
      - type: response
        data:
          text: A large coil of rope.
