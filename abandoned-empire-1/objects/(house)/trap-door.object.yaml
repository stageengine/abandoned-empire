id: trap-door
name: trap door

synonyms:
  - door
  - trapdoor
  - trap
  - trap door
  - trap-door
  - cover
  - trap trapdoor
  - trap trap-door
  - trap cover
  - dusty door
  - dusty trapdoor
  - dusty trap-door
  - dusty cover
start: living-room

# Under the rug until the rug is moved. ZIL says this with an INVISIBLE flag it
# clears; here it is a condition asked afresh every turn, which comes to the
# same thing and needs nothing written on the rug to remember it.
requires:
  - type: flag
    data:
      flag: rug-moved

actions:
  # ZIL answers "open" or "close" on a door already in that state with
  # `<PICK-ONE ,DUMMY>` - one roll shared by every object that pulls from the
  # same generic table, rather than a line of its own for each. Three blocks
  # per verb, gated on the same roll, are that table here: the last carries no
  # `chance` of its own, since one roll of three has nothing left to be but
  # the third once the first two have missed.
  - id: open
    requires:
      - type: flag
        data:
          flag: trap-door-open
        negate: true
    triggers:
      - type: response
        data:
          text: >-
            The door reluctantly opens to reveal a rickety staircase descending into darkness.
      - type: set-flag
        data:
          flag: trap-door-open
          value: true

  - id: open
    requires:
      - type: chance
        data: { name: dummy-open, of: 3, index: 1 }
    triggers:
      - type: response
        data:
          text: Look around.

  - id: open
    requires:
      - type: chance
        data: { name: dummy-open, of: 3, index: 2 }
    triggers:
      - type: response
        data:
          text: Too late for that.

  - id: open
    triggers:
      - type: response
        data:
          text: Have your eyes checked.

  - id: close
    requires:
      - type: flag
        data:
          flag: trap-door-open
    triggers:
      - type: response
        data:
          text: The door swings shut and closes.
      - type: set-flag
        data:
          flag: trap-door-open
          value: false

  - id: close
    requires:
      - type: chance
        data: { name: dummy-close, of: 3, index: 1 }
    triggers:
      - type: response
        data:
          text: Look around.

  - id: close
    requires:
      - type: chance
        data: { name: dummy-close, of: 3, index: 2 }
    triggers:
      - type: response
        data:
          text: Too late for that.

  - id: close
    triggers:
      - type: response
        data:
          text: Have your eyes checked.

  - id: look
    preposition: under
    requires:
      - type: flag
        data:
          flag: trap-door-open
    triggers:
      - type: response
        data:
          text: You see a rickety staircase descending into darkness.

  - id: look
    preposition: under
    triggers:
      - type: response
        data:
          text: It's closed.
