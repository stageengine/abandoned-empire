id: knife
name: nasty knife

synonyms:
  - knives
  - knife
  - blade
  - nasty knives
  - nasty blade
  - unrusty knives
  - unrusty knife
  - unrusty blade
portable: true
size: 5
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: knife }
    triggers:
      - type: response
        data:
          text: On a table is a nasty-looking knife.
  - triggers:
      - type: response
        data:
          text: There is a nasty knife here.
start: in:attic-table

actions:
  - id: look
    triggers:
      - type: response
        data:
          text: A nasty-looking knife, of the sort a person might regret meeting.
