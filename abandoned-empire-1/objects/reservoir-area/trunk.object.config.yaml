id: trunk
name: trunk of jewels

synonyms: [trunk, chest, jewels, treasure, old trunk, old chest, old jewels]
portable: true
size: weight
measures:
  - id: weight
    max: 35
presence:
  - conditions:
      - type: handled
        negate: true
        data: { object: trunk }
    triggers:
      - type: response
        data:
          text: Lying half buried in the mud is an old trunk, bulging with jewels.
  - triggers:
      - type: response
        data:
          text: There is an old trunk here, bulging with assorted jewels.
start: reservoir

tags: [treasure]
conditions:
  - type: flag
    data:
      flag: low-tide

  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
actions:

  - id: look
    triggers:
      - type: response
        data:
          text: An old trunk, bulging with assorted jewels.
