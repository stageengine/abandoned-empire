id: skull
name: crystal skull

synonyms: [skull, head, treasure, crystal head, crystal treasure]
portable: true
size: weight
measures:
  - id: weight
    max: 5
tags: [belongings]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: skull }
    triggers:
      - type: response
        data:
          text: >-
            Lying in one corner of the room is a beautifully carved crystal skull. It appears to be grinning
            at you rather nastily.
  - triggers:
      - type: response
        data:
          text: There is a crystal skull here.
start: land-of-living-dead

actions:

  - id: look
    triggers:
      - type: response
        data:
          text: >-
            A beautifully carved crystal skull. It appears to be grinning at you rather nastily.
