id: hot-bell
name: red hot brass bell

# Nothing reaches this. Zork swaps the brass bell for it once the bell is red
# hot; the port keeps one bell and a `bell-hot` flag instead, because two things
# answering to "bell" is two things the parser cannot choose between. It is left
# here so that the map of what ZIL had is complete, with no words of its own.
synonyms: [red hot brass bell]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: On the ground is a red hot bell.
start: offstage
