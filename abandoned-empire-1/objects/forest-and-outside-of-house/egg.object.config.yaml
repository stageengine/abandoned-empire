id: egg
name: jewel-encrusted egg

synonyms:
  - egg
  - treasure
  - birds egg
  - birds treasure
  - encrusted egg
  - encrusted treasure
  - jeweled egg
  - jeweled treasure
portable: true
size: weight
measures:
  - id: weight
    max: 5
contains: true
tags: [treasure]
conditions:
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - conditions:
      - type: handled
        negate: true
        data: { object: egg }
    triggers:
      - type: response
        data:
          text: >-
            In the bird's nest is a large egg encrusted with precious jewels, apparently scavenged by a
            childless songbird. The egg is covered with fine gold inlay, and ornamented in lapis lazuli and
            mother-of-pearl. Unlike most eggs, this one is hinged and closed with a delicate looking clasp.
            The egg appears extremely fragile.
  - triggers:
      - type: response
        data:
          text: There is a jewel-encrusted egg here.
start: in:nest

actions:
  - id: open
    triggers:
      - type: response
        data:
          text: You have neither the tools nor the expertise.

  - id: break
    conditions:
      - type: has-item
        data:
          object: egg
    triggers:
      - type: response
        data:
          text: >-
            Your rather indelicate handling of the egg has caused it some damage, although you
            have succeeded in opening it.
      - type: response
        data:
          text: >-
            There is a golden clockwork canary nestled in the egg. It seems to have recently had
            a bad experience. The mountings for its jewel-like eyes are empty, and its silver
            beak is crumpled. Through a cracked crystal window below its left wing you can see
            the remains of intricate machinery. It is not clear what result winding it would
            have, as the mainspring seems sprung.
      - type: set-flag
        data:
          flag: egg-open
          value: true
      - type: remove-object
        data:
          object: egg
      - type: move-object
        data:
          object: broken-egg
          to: inventory

  - id: break
    triggers:
      - type: response
        data:
          text: >-
            Your rather indelicate handling of the egg has caused it some damage, although you
            have succeeded in opening it.
      - type: response
        data:
          text: >-
            There is a golden clockwork canary nestled in the egg. It seems to have recently had
            a bad experience. The mountings for its jewel-like eyes are empty, and its silver
            beak is crumpled. Through a cracked crystal window below its left wing you can see
            the remains of intricate machinery. It is not clear what result winding it would
            have, as the mainspring seems sprung.
      - type: set-flag
        data:
          flag: egg-open
          value: true
      - type: remove-object
        data:
          object: egg
      - type: move-object
        data:
          object: broken-egg
          to: here

  - id: throw
    triggers:
      - type: response
        data:
          text: >-
            Your rather indelicate handling of the egg has caused it some damage, although you
            have succeeded in opening it.
      - type: response
        data:
          text: >-
            There is a golden clockwork canary nestled in the egg. It seems to have recently had
            a bad experience. The mountings for its jewel-like eyes are empty, and its silver
            beak is crumpled. Through a cracked crystal window below its left wing you can see
            the remains of intricate machinery. It is not clear what result winding it would
            have, as the mainspring seems sprung.
      - type: set-flag
        data:
          flag: egg-open
          value: true
      - type: remove-object
        data:
          object: egg
      - type: move-object
        data:
          object: broken-egg
          to: here

  - id: drop
    conditions:
      - type: scene
        data:
          id: up-a-tree
    triggers:
      - type: response
        data:
          text: The egg falls to the ground and springs open, seriously damaged.
      - type: response
        data:
          text: >-
            There is a golden clockwork canary nestled in the egg. It seems to have recently had
            a bad experience. The mountings for its jewel-like eyes are empty, and its silver
            beak is crumpled. Through a cracked crystal window below its left wing you can see
            the remains of intricate machinery. It is not clear what result winding it would
            have, as the mainspring seems sprung.
      - type: set-flag
        data:
          flag: egg-open
          value: true
      - type: remove-object
        data:
          object: egg
      - type: move-object
        data:
          object: broken-egg
          to: path
