id: painting

synonyms: [painting, art, canvas, treasure, beauti painting, beauti art, beauti canvas]
portable: true
size: weight
measures:
  - id: weight
    max: 15
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: painting }
    triggers:
      - type: response
        data:
          text: >-
            Fortunately, there is still one chance for you to be a vandal, for on the far wall is a painting
            of unparalleled beauty.
  - triggers:
      - type: response
        data:
          text: A painting by a neglected genius is here.
start: gallery

actions:
  # Zork scores a treasure twice: once for getting it out of wherever it was,
  # and again for putting it in the case. The first of those has to be written
  # as an action of its own, because the engine's own taking cannot be hooked -
  # so `once` does the scoring and its failure does the plain taking ever after.

  - id: break
    once:
      failure:
        triggers:
          - type: response
            data:
              text: There is a worthless piece of canvas here.
    triggers:
      - type: response
        data:
          text: >-
            Congratulations! Unlike the other vandals, who merely stole the artist's masterpieces,
            you have destroyed one.
      - type: set-flag
        data:
          flag: painting-ruined
          value: true

  - id: look
    requires:
      - type: flag
        data:
          flag: painting-ruined
    triggers:
      - type: response
        data:
          text: There is a worthless piece of canvas here.

  - id: look
    triggers:
      - type: response
        data:
          text: A painting by a neglected genius.
