id: owners-manual
name: ZORK owner's manual

synonyms:
  - manual
  - piece
  - paper
  - zork manual
  - zork piece
  - zork paper
  - owners manual
  - owners piece
  - owners paper
  - small manual
  - small piece
  - small paper
portable: true
size: weight
measures:
  - id: weight
    max: 5
tags: [belongings]
requires:
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: owners-manual }
    triggers:
      - type: response
        data:
          text: Loosely attached to a wall is a small piece of paper.
  - triggers:
      - type: response
        data:
          text: There is a ZORK owner's manual here.
start: studio

actions:
  - id: look
    triggers:
      - type: response
        data:
          text: |-
            Congratulations!

            You are the privileged owner of ZORK I: The Great Underground Empire, a self-contained and self-maintaining universe. If used and maintained in accordance with normal operating practices for small universes, ZORK will provide many months of trouble-free operation.
