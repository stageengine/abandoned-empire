id: axe
name: bloody axe

synonyms: [axe, ax, bloody ax]
portable: true
size: weight
measures:
  - id: weight
    max: 25
tags: [belongings]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a bloody axe here.

actions:
  # ZIL punctures the boat the instant a weapon like this one is dropped while
  # aboard - RBOAT-FUNCTION's own M-BEG answers `DROP` before this object's
  # ordinary drop ever runs, so the weapon stays in hand rather than actually
  # landing anywhere. Written above the plain drop for the same reason the
  # boat's own boarding-puncture is. See `inflated-boat.object.yaml` for the
  # matching `put ... in` and `attack ... with` shapes of the same fix.
  - id: drop
    requires:
      - type: flag
        data: { flag: aboard }
      - type: any-of
        data:
          conditions:
            - type: scene
              data: { id: reservoir }
            - type: scene
              data: { id: in-stream }
    triggers:
      - type: response
        data:
          text: >-
            It seems that the bloody axe didn't agree with the boat, as evidenced by the loud hissing
            noise issuing therefrom. With a pathetic sputter, the boat deflates, leaving you without.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }
      - type: response
        data:
          text: >-
            Another pathetic sputter, this time from you, heralds your drowning.
      - type: set-flag
        data: { flag: player-died, value: true }

  - id: drop
    requires:
      - type: flag
        data: { flag: aboard }
      - type: scene
        data: { tag: river }
    triggers:
      - type: response
        data:
          text: >-
            It seems that the bloody axe didn't agree with the boat, as evidenced by the loud hissing
            noise issuing therefrom. With a pathetic sputter, the boat deflates, leaving you without.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }
      - type: response
        data:
          text: >-
            In other words, fighting the fierce currents of the Frigid River. You manage to hold your own
            for a bit, but then you are carried over a waterfall and into some nasty rocks. Ouch!
      - type: set-flag
        data: { flag: player-died, value: true }

  - id: drop
    requires:
      - type: flag
        data: { flag: aboard }
    triggers:
      - type: response
        data:
          text: >-
            It seems that the bloody axe didn't agree with the boat, as evidenced by the loud hissing
            noise issuing therefrom. With a pathetic sputter, the boat deflates, leaving you without.
      - type: move-object
        data: { object: inflated-boat, to: offstage }
      - type: move-object
        data: { object: punctured-boat, to: here }
      - type: set-flag
        data: { flag: aboard, value: false }

  - id: get
    requires:
      - type: flag
        negate: true
        data: { flag: troll-flag }
    triggers:
      - type: response
        data:
          text: The troll's grip on it is not one you would care to loosen.
