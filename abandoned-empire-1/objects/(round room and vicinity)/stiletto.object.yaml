id: stiletto

synonyms: [vicious stiletto]
portable: true
size: weight
measures:
  - id: weight
    max: 10
tags: [belongings]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a stiletto here.

actions:
  - id: get
    triggers:
      - type: response
        data:
          text: The thief has his hand on it, and would rather you did not.
