id: burned-out-lantern
name: burned-out lantern

synonyms:
  - lantern
  - lamp
  - rusty lantern
  - rusty lamp
  - burned lantern
  - burned lamp
  - dead lantern
  - dead lamp
  - useless lantern
  - useless lamp
portable: true
size: weight
measures:
  - id: weight
    max: 20
tags: [belongings]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: burned-out-lantern }
    triggers:
      - type: response
        data:
          text: The deceased adventurer's useless lantern is here.
  - triggers:
      - type: response
        data:
          text: There is a burned-out lantern here.
start: maze-5
