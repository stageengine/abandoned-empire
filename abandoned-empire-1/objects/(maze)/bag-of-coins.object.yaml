id: bag-of-coins
name: leather bag of coins

synonyms:
  - bag
  - coins
  - treasure
  - old bag
  - old coins
  - old treasure
  - leather bag
  - leather coins
  - leather treasure
portable: true
size: weight
measures:
  - id: weight
    max: 15
tags: [treasure]
requires:
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: An old leather bag, bulging with coins, is here.
start: maze-5

actions:
  - id: open
    triggers:
      - type: response
        data: { text: You have your hands full of coins. }
