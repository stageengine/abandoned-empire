id: rusty-knife
name: rusty knife

synonyms: [knives, knife, rusty knives]
portable: true
size: weight
measures:
  - id: weight
    max: 20
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: rusty-knife }
    triggers:
      - type: response
        data:
          text: Beside the skeleton is a rusty knife.
  - triggers:
      - type: response
        data:
          text: There is a rusty knife here.
start: maze-5

actions:
  - id: get
    triggers:
      - type: response
        data:
          text: >-
            As you touch the rusty knife, your sword gives a single pulse of blinding blue
            light.
