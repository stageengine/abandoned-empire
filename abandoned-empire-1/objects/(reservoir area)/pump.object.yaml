id: pump
name: hand-held air pump

synonyms:
  - pump
  - air-pump
  - tool
  - tools
  - small pump
  - small air-pump
  - small tool
  - small tools
  - hand-held pump
  - hand-held air-pump
  - hand-held tool
  - hand-held tools
portable: true
size: weight
measures:
  - id: weight
    max: 5
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a hand-held air pump here.
start: reservoir-north
