id: north-of-house

name: North of House

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are facing the north side of a white house. There is no door here, and all the
            windows are boarded up. To the north a narrow path winds through the trees.

objects:
  - id: north-of-house.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: north-of-house.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: north-of-house.boarded-window
    name: boarded window
    synonyms: [window]
    actions:
      - id: open
        triggers:
          - type: response
            data:
              text: >-
                The windows are boarded and can't be opened.
      - id: break
        triggers:
          - type: response
            data:
              text: >-
                You can't break the windows open.
  - id: north-of-house.board
    name: board
    synonyms: [boards]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The boards are securely fastened.
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                The boards are securely fastened.
  - id: north-of-house.white-house
    name: white house
    synonyms: [house, beauti house, coloni house]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                The house is a beautiful colonial house which is painted white. It is clear that the
                owners must have been extremely wealthy.
      - id: burn
        triggers:
          - type: response
            data:
              text: >-
                You must be joking.
  - id: north-of-house.forest
    name: forest
    synonyms: [trees, pines, hemlocks]

    actions:
      - id: listen
        triggers:
          - type: response
            data:
              text: >-
                The pines and the hemlocks seem to be murmuring.
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                You cannot see the forest for the trees.
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: path
  - id: south
    triggers:
      - type: response
        data:
          text: The windows are all boarded.
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: east-of-house
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: west-of-house
  - id: southeast
    triggers:
      - type: change-scene
        data:
          scene: east-of-house
  - id: southwest
    triggers:
      - type: change-scene
        data:
          scene: west-of-house
