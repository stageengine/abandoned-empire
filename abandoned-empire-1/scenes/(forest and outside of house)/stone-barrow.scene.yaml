id: stone-barrow

name: Stone Barrow

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are standing in front of a massive barrow of stone. In the east face is a huge
            stone door which is open. You cannot see into the dark of the tomb.

objects:
  - barrow-door
  - barrow
  - id: stone-barrow.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: stone-barrow.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
navigation:
  - id: west
    synonyms: [barrow, tomb, door]
    triggers:
      - type: response
        data:
          text: >-
            As you enter the barrow, the door closes inexorably behind you. Around you it is
            dark, but ahead is an enormous cavern, brightly lit. Through its center runs a wide
            stream. Spanning the stream is a small wooden footbridge, and beyond a path leads
            into a dark tunnel.
      - type: response
        data:
          text: >-
            Above the bridge, floating in the air, is a large sign. It reads: All ye who stand
            before this bridge have completed a great and perilous adventure which has tested
            your wit and courage. You have mastered the first part of the ZORK trilogy. Those
            who pass over this bridge must be prepared to undertake an even greater adventure
            that will severely test your skill and bravery!
      - type: response
        data:
          text: >-
            The ZORK trilogy continues with "ZORK II: The Wizard of Frobozz" and is completed in
            "ZORK III: The Dungeon Master."
      - type: response
        data:
          text: >-
            Your score is <player:score> (total of 350 points), in <player:moves> moves. This
            gives you the rank of Master Adventurer.
      - type: achievement
        data: { id: master-adventurer }
      - type: end-game
        data:
          journal: walked into the barrow, having mastered the Great Underground Empire

  - id: northeast
    triggers:
      - type: change-scene
        data:
          scene: west-of-house
