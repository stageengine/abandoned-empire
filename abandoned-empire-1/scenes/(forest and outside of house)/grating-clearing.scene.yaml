id: grating-clearing

name: Clearing

presence:
  - requires:
      - type: flag
        data:
          flag: grate-open
    triggers:
      - type: response
        data:
          text: >-
            You are in a clearing, with a forest surrounding you on all sides. A path leads
            south.
      - type: response
        data:
          text: There is an open grating, descending into darkness.

  - requires:
      - type: flag
        data:
          flag: grate-revealed
    triggers:
      - type: response
        data:
          text: >-
            You are in a clearing, with a forest surrounding you on all sides. A path leads
            south.
      - type: response
        data:
          text: There is a grating securely fastened into the ground.

  - triggers:
      - type: response
        data:
          text: >-
            You are in a clearing, with a forest surrounding you on all sides. A path leads
            south.

objects:
  - id: grating-clearing.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: grating-clearing.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - leaves
  - id: grating-clearing.white-house
    name: white house
    synonyms: [house, beauti house, coloni house]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                The house is a beautiful colonial house which is painted white. It is clear that the
                owners must have been extremely wealthy.
      - id: burn
        triggers:
          - type: response
            data:
              text: >-
                You must be joking.
  - id: grating-clearing.grate
    name: grating
    synonyms: [grate]
    requires:
      - type: flag
        data:
          flag: grate-revealed
    actions:
      - id: open
        requires:
          - type: flag
            data:
              flag: grate-unlocked
            failure:
              triggers:
                - type: response
                  data:
                    text: The grating is locked.
          - type: flag
            negate: true
            data:
              flag: grate-open
            failure:
              triggers:
                - type: response
                  data:
                    text: It is already open.
        triggers:
          - type: response
            data:
              text: The grating opens.
          - type: set-flag
            data:
              flag: grate-open
              value: true

      - id: close
        requires:
          - type: flag
            data:
              flag: grate-open
            failure:
              triggers:
                - type: response
                  data:
                    text: It is already closed.
        triggers:
          - type: response
            data:
              text: The grating is closed.
          - type: set-flag
            data:
              flag: grate-open
              value: false

      - id: unlock
        triggers:
          - type: response
            data:
              text: You can't reach the lock from here.

      - id: lock
        triggers:
          - type: response
            data:
              text: You can't lock it from this side.

      - id: put
        preposition: in
        indirect: axe
        triggers:
          - type: response
            data:
              text: It won't fit through the grating.

      - id: put
        preposition: in
        indirect: timbers
        triggers:
          - type: response
            data:
              text: It won't fit through the grating.

      - id: put
        preposition: in
        indirect: coffin
        triggers:
          - type: response
            data:
              text: It won't fit through the grating.

      - id: put
        preposition: in
        indirect: leaves
        triggers:
          - type: response
            data:
              text: It won't fit through the grating.

      - id: put
        preposition: in
        indirect: sword
        triggers:
          - type: response
            data:
              text: It won't fit through the grating.

      - id: put
        preposition: in
        indirect: trunk
        triggers:
          - type: response
            data:
              text: It won't fit through the grating.

      - id: put
        preposition: on
        indirect: axe
        triggers:
          - type: response
            data:
              text: It won't fit through the grating.

      - id: put
        preposition: on
        indirect: timbers
        triggers:
          - type: response
            data:
              text: It won't fit through the grating.

      - id: put
        preposition: on
        indirect: coffin
        triggers:
          - type: response
            data:
              text: It won't fit through the grating.

      - id: put
        preposition: on
        indirect: leaves
        triggers:
          - type: response
            data:
              text: It won't fit through the grating.

      - id: put
        preposition: on
        indirect: sword
        triggers:
          - type: response
            data:
              text: It won't fit through the grating.

      - id: put
        preposition: on
        indirect: trunk
        triggers:
          - type: response
            data:
              text: It won't fit through the grating.

navigation:
  - id: north
    triggers:
      - type: response
        data:
          text: The forest becomes impenetrable to the north.
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: path
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: forest-2
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: forest-1
  - id: down
    requires:
      - type: flag
        data:
          flag: grate-open
        failure:
          triggers:
            - type: response
              data:
                text: The grating is closed!
      - type: flag
        data:
          flag: grate-revealed
        failure:
          triggers:
            - type: response
              data:
                text: You can't go that way.
    triggers:
      - type: change-scene
        data:
          scene: grating-room
