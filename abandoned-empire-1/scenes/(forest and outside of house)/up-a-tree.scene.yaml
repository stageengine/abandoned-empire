id: up-a-tree

tags: [forest]

name: Up a Tree

# The nest says what is in it, so the room says only the room. This used to carry
# a copy of the egg's own words, because a thing's line could not be gated and the
# room's could - which put a sentence about the egg above the nest it was inside.
#
# The lamp and the rope are each their own `also` block rather than one block
# naming both, because either can be on the path without the other - the engine
# renders whichever hold, in this order, alongside the fixed line above. `PRINT-
# CONTENTS` in ZIL reads whatever is on the path generically, which nothing here
# does yet; these two are the named case, not every case.
presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are about 10 feet above the ground nestled among some large branches. The
            nearest branch above you is above your reach.
  - also: true
    requires:
      - type: object-in
        data: { object: lamp, location: path }
    triggers:
      - type: response
        data:
          text: On the ground below you can see a brass lantern.
  - also: true
    requires:
      - type: object-in
        data: { object: rope, location: path }
    triggers:
      - type: response
        data:
          text: Some rope is lying on the ground below.

objects:
  - id: up-a-tree.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: up-a-tree.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - nest
  - egg
  - broken-egg
  - canary
  - broken-canary
  - id: up-a-tree.tree
    name: tree
    synonyms: [branch, large tree, large branch, storm tree, storm branch]
    actions:
      - id: climb
        triggers:
          - type: response
            data:
              text: >-
                There is no tree here suitable for climbing.
  - id: up-a-tree.forest
    name: forest
    synonyms: [trees, pines, hemlocks]
    actions:
      - id: listen
        triggers:
          - type: response
            data:
              text: >-
                The pines and the hemlocks seem to be murmuring.
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                You cannot see the forest for the trees.
  - id: up-a-tree.songbird
    name: songbird
    synonyms: [bird, song bird, song songbird]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The songbird is not here but is probably nearby.
      - id: listen
        triggers:
          - type: response
            data:
              text: >-
                You can't hear the songbird now.
      - id: follow
        triggers:
          - type: response
            data:
              text: >-
                It can't be followed.
  - id: up-a-tree.white-house
    name: white house
    synonyms: [house, beauti house, coloni house]

    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                The house is a beautiful colonial house which is painted white. It is clear that the
                owners must have been extremely wealthy.
      - id: burn
        triggers:
          - type: response
            data:
              text: >-
                You must be joking.
navigation:
  - id: up
    synonyms: [tree]
    triggers:
      - type: response
        data:
          text: You cannot climb any higher.
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: path
