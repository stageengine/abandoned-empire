id: river-3
tags: [dark, river]

name: Frigid River

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            The river descends here into a valley. There is a narrow beach on the west shore
            below the cliffs. In the distance a faint rumbling can be heard.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: river-3.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: river-3.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: river-3.global-water
    name: water
    synonyms: [quantity]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The water slips through your fingers.
      - id: drink
        triggers:
          - type: response
            data:
              text: >-
                Thank you very much. I was rather thirsty.
  - id: river-3.river
    name: river
    synonyms: [frigid river]

    actions:
      - id: swim
        triggers:
          - type: response
            data:
              text: >-
                A look before leaping reveals that the river is wide and dangerous, with swift currents
                and large, half-submerged rocks.
      - id: cross
        triggers:
          - type: response
            data:
              text: >-
                You should get in the boat then launch it.
navigation:
  - id: west
    triggers:
      - type: set-flag
        data:
          flag: aboard
          value: false
      - type: change-scene
        data:
          scene: white-cliffs-north
  - id: up
    triggers:
      - type: response
        data:
          text: You cannot go upstream due to strong currents.
  - id: land
    triggers:
      - type: set-flag
        data:
          flag: aboard
          value: false
      - type: change-scene
        data:
          scene: white-cliffs-north
