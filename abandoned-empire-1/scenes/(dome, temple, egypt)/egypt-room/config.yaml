id: egypt-room
tags: [dark]

meta:
  title: Egyptian Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a room which looks like an Egyptian tomb. There is an ascending staircase to
            the west.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - sceptre
  - coffin
  - id: egypt-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: egypt-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
navigation:
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: north-temple
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: north-temple
