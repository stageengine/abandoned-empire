id: torch-room
tags: [dark]

name: Torch Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a large room with a prominent doorway leading to a down staircase. Above you
            is a large dome. Up around the edge of the dome (20 feet up) is a wooden railing. In
            the center of the room sits a white marble pedestal.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: torch-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: torch-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - pedestal
  - torch
  - id: torch-room.dome
    name: dome
    synonyms: [dome]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: "A dome, and no way of reaching it."
navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: north-temple
  - id: up
    triggers:
      - type: response
        data:
          text: You cannot reach the rope.
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: north-temple
