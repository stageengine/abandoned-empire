id: north-temple

meta:
  title: Temple

presence:
  - triggers:
      - type: response
        data:
          text: >-
            This is the north end of a large temple. On the east wall is an ancient inscription,
            probably a prayer in a long-forgotten language. Below the prayer is a staircase
            leading down. The west wall is solid granite. The exit to the north end of the room
            is through huge marble pillars.

objects:
  - bell
  - prayer
  - id: north-temple.granite-wall
    name: granite wall
    synonyms: [granite, granite wall]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: "The west wall is solid granite here."
      - id: get
        triggers:
          - type: response
            data:
              text: "It's solid granite."
      - id: raise
        triggers:
          - type: response
            data:
              text: "It's solid granite."
  - id: north-temple.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: north-temple.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: torch-room
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: south-temple
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: egypt-room
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: torch-room
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: egypt-room