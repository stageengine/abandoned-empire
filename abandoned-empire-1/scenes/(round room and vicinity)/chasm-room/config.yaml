id: chasm-room
tags: [dark]

name: Chasm

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            A chasm runs southwest to northeast and the path follows it. You are on the south
            side of the chasm, where a crack opens into a passage.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: chasm-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: chasm-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: chasm-room.chasm
    name: chasm
    synonyms: [chasm]
    actions:
      - id: jump
        triggers:
          - type: response
            data:
              text: "You look before leaping, and realize that you would never survive."
      - id: cross
        triggers:
          - type: response
            data:
              text: "It's too far to jump, and there's no bridge."
  - id: chasm-room.crack
    name: crack
    synonyms: [narrow crack]

    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                You can't fit through the crack.
navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: ns-passage
  - id: northeast
    triggers:
      - type: change-scene
        data:
          scene: reservoir-south
  - id: southwest
    triggers:
      - type: change-scene
        data:
          scene: ew-passage
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: ew-passage
  - id: down
    triggers:
      - type: response
        data:
          text: Are you out of your mind?
