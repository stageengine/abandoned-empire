id: on-rainbow

name: On the Rainbow

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are on top of a rainbow (I bet you never thought you would walk on a rainbow),
            with a magnificent view of the Falls. The rainbow travels east-west here.

objects:
  - id: on-rainbow.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: on-rainbow.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: on-rainbow.rainbow
    name: rainbow

    actions:
      - id: cross
        triggers:
          - type: response
            data:
              text: >-
                From here?!?
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                A rainbow, and no way to reach it from here.
navigation:
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: aragain-falls
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: end-of-rainbow
