id: dam-base

name: Dam Base

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are at the base of Flood Control Dam #3, which looms above you and to the north.
            The river Frigid is flowing by here. Along the river are the White Cliffs which seem
            to form giant walls stretching from north to south along the shores of the river as
            it winds its way downstream.

objects:
  - id: dam-base.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: dam-base.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - inflated-boat
  - punctured-boat
  - inflatable-boat
  - boat-label
  - id: dam-base.global-water
    name: water
    synonyms: [quantity]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The water slips through your fingers.
      - id: drink
        triggers:
          - type: response
            data:
              text: >-
                Thank you very much. I was rather thirsty.
  - id: dam-base.river
    name: river
    synonyms: [frigid river]

    actions:
      - id: swim
        triggers:
          - type: response
            data:
              text: >-
                A look before leaping reveals that the river is wide and dangerous, with swift currents
                and large, half-submerged rocks.
      - id: cross
        triggers:
          - type: response
            data:
              text: >-
                You should get in the boat then launch it.
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: dam-room
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: dam-room
