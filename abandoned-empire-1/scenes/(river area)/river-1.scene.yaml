id: river-1
tags: [river]

meta:
  title: Frigid River

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are on the Frigid River in the vicinity of the Dam. The river flows quietly
            here. There is a landing on the west shore.

objects:
  - id: river-1.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: river-1.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: river-1.global-water
    name: water
    synonyms: [quantity]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The water slips through your fingers.
      - id: drink
        triggers:
          - type: response
            data:
              text: >-
                Thank you very much. I was rather thirsty.
  - id: river-1.river
    name: river
    synonyms: [frigid river]

    actions:
      - id: swim
        triggers:
          - type: response
            data:
              text: >-
                A look before leaping reveals that the river is wide and dangerous, with swift currents
                and large, half-submerged rocks.
      - id: cross
        triggers:
          - type: response
            data:
              text: >-
                You should get in the boat then launch it.
navigation:
  - id: east
    triggers:
      - type: response
        data:
          text: The White Cliffs prevent your landing here.
  - id: west
    triggers:
      - type: set-flag
        data:
          flag: aboard
          value: false
      - type: change-scene
        data:
          scene: dam-base
  - id: up
    triggers:
      - type: response
        data:
          text: You cannot go upstream due to strong currents.
  - id: land
    triggers:
      - type: set-flag
        data:
          flag: aboard
          value: false
      - type: change-scene
        data:
          scene: dam-base
