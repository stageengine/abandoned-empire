id: white-cliffs-north
tags: [dark]

name: White Cliffs Beach

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You are on a narrow strip of beach which runs along the base of the White Cliffs.
            There is a narrow path heading south along the Cliffs and a tight passage leading
            west into the cliffs themselves.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: white-cliffs-north.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: white-cliffs-north.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: white-cliffs-north.global-water
    name: water
    synonyms: [quantity]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The water slips through your fingers.
      - id: drink
        triggers:
          - type: response
            data:
              text: >-
                Thank you very much. I was rather thirsty.
  - id: white-cliffs-north.white-cliff
    name: white cliffs
    synonyms: [cliff, cliffs, white cliff]
    actions:
      - id: climb
        triggers:
          - type: response
            data:
              text: >-
                The cliff is too steep for climbing here.
  - id: white-cliffs-north.river
    name: river
    synonyms: [frigid river]

    actions:
      - id: swim
        triggers:
          - type: response
            data:
              text: >-
                A look before leaping reveals that the river is wide and dangerous, with swift currents
                and large, half-submerged rocks.
      - id: cross
        triggers:
          - type: response
            data:
              text: >-
                You should get in the boat then launch it.
navigation:
  - id: south
    requires:
      - type: flag
        data:
          flag: deflate
        failure:
          triggers:
            - type: response
              data:
                text: The path is too narrow.
    triggers:
      - type: change-scene
        data:
          scene: white-cliffs-south
  - id: west
    requires:
      - type: flag
        data:
          flag: deflate
        failure:
          triggers:
            - type: response
              data:
                text: The path is too narrow.
    triggers:
      - type: change-scene
        data:
          scene: damp-cave
