id: canyon-bottom

name: Canyon Bottom

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are beneath the walls of the river canyon which may be climbable here. The
            lesser part of the runoff of Aragain Falls flows by below. To the north is a narrow
            path.

objects:
  - id: canyon-bottom.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: canyon-bottom.global-water
    name: water
    synonyms: [quantity]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The water slips through your fingers.
      - id: drink
        triggers:
          - type: response
            data:
              text: >-
                Thank you very much. I was rather thirsty.
  - id: canyon-bottom.climbable-cliff
    name: cliff
    synonyms:
      - wall
      - walls
      - ledge
      - rocky wall
      - rocky cliff
      - rocky walls
      - rocky ledge
      - sheer wall
      - sheer cliff
      - sheer walls
      - sheer ledge
    actions:
      - id: climb
        triggers:
          - type: response
            data:
              text: >-
                The cliff is too steep for climbing here.
  - id: canyon-bottom.river
    name: river
    synonyms: [frigid river]

    actions:
      - id: swim
        triggers:
          - type: response
            data:
              text: >-
                A look before leaping reveals that the river is wide and dangerous, with swift currents
                and large, half-submerged rocks.
      - id: cross
        triggers:
          - type: response
            data:
              text: >-
                You should get in the boat then launch it.
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: end-of-rainbow
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: cliff-middle
