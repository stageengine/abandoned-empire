id: river-4
tags: [dark, river]

meta:
  title: Frigid River

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            The river is running faster here and the sound ahead appears to be that of rushing
            water. On the east shore is a sandy beach. A small area of beach can also be seen
            below the cliffs on the west shore.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: river-4.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: river-4.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - emerald
  - buoy
  - id: river-4.global-water
    name: water
    synonyms: [quantity]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The water slips through your fingers.
      - id: drink
        triggers:
          - type: response
            data:
              text: >-
                Thank you very much. I was rather thirsty.
  - id: river-4.river
    name: river
    synonyms: [frigid river]

    actions:
      - id: swim
        triggers:
          - type: response
            data:
              text: >-
                A look before leaping reveals that the river is wide and dangerous, with swift currents
                and large, half-submerged rocks.
      - id: cross
        triggers:
          - type: response
            data:
              text: >-
                You should get in the boat then launch it.
navigation:
  - id: east
    triggers:
      - type: set-flag
        data:
          flag: aboard
          value: false
      - type: change-scene
        data:
          scene: sandy-beach
  - id: west
    triggers:
      - type: set-flag
        data:
          flag: aboard
          value: false
      - type: change-scene
        data:
          scene: white-cliffs-south
  - id: up
    triggers:
      - type: response
        data:
          text: You cannot go upstream due to strong currents.
  - id: land
    triggers:
      - type: response
        data:
          text: You can land either to the east or the west.
