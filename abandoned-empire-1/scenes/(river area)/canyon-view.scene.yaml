id: canyon-view

name: Canyon View

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are at the top of the Great Canyon on its west wall. From here there is a
            marvelous view of the canyon and parts of the Frigid River upstream. Across the
            canyon, the walls of the White Cliffs join the mighty ramparts of the Flathead
            Mountains to the east. Following the Canyon upstream to the north, Aragain Falls may
            be seen, complete with rainbow. The mighty Frigid River flows out from a great dark
            cavern. To the west and south can be seen an immense forest, stretching for miles
            around. A path leads northwest. It is possible to climb down into the canyon from
            here.

objects:
  - id: canyon-view.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: canyon-view.climbable-cliff
    name: cliff
    synonyms:
      - wall
      - walls
      - ledge
      - rocky wall
      - rocky cliff
      - rocky walls
      - rocky ledge
      - sheer wall
      - sheer cliff
      - sheer walls
      - sheer ledge
    actions:
      - id: climb
        triggers:
          - type: response
            data:
              text: >-
                The cliff is too steep for climbing here.
  - id: canyon-view.river
    name: river
    synonyms: [frigid river]
    actions:
      - id: swim
        triggers:
          - type: response
            data:
              text: >-
                A look before leaping reveals that the river is wide and dangerous, with swift currents
                and large, half-submerged rocks.
      - id: cross
        triggers:
          - type: response
            data:
              text: >-
                You should get in the boat then launch it.
  - id: canyon-view.rainbow
    name: rainbow

    actions:
      - id: cross
        triggers:
          - type: response
            data:
              text: >-
                From here?!?
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                A rainbow, and no way to reach it from here.
      - id: look
        preposition: under
        triggers:
          - type: response
            data:
              text: The Frigid River flows under the rainbow.
navigation:
  - id: south
    triggers:
      - type: response
        data:
          text: Storm-tossed trees block your way.
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: cliff-middle
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: forest-3
  - id: northwest
    triggers:
      - type: change-scene
        data:
          scene: clearing
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: cliff-middle

actions:
  - id: jump
    triggers:
      - type: response
        data:
          text: "Nice view, lousy place to jump."
      # `player-died` rather than `end-game`: every death in ZIL goes through
      # one routine, `JIGS-UP`, which gives every one of them the same two
      # resurrections before the third is final - this jump included.
      - type: set-flag
        data:
          flag: player-died
          value: true

