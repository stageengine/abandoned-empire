id: shore

name: Shore

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are on the east shore of the river. The water here seems somewhat treacherous. A
            path travels from north to south here, the south end quickly turning around a sharp
            corner.

objects:
  - id: shore.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: shore.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: shore.global-water
    name: water
    synonyms: [quantity]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The water slips through your fingers.
      - id: drink
        triggers:
          - type: response
            data:
              text: >-
                Thank you very much. I was rather thirsty.
  - id: shore.river
    name: river
    synonyms: [frigid river]

    actions:
      - id: swim
        triggers:
          - type: response
            data:
              text: >-
                A look before leaping reveals that the river is wide and dangerous, with swift currents
                and large, half-submerged rocks.
      - id: cross
        triggers:
          - type: response
            data:
              text: >-
                You should get in the boat then launch it.
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: sandy-beach
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: aragain-falls
