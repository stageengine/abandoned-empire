# What this room does, and only this room.

every-turn:

  # Drowning, once the water has closed over the room. ZIL only kills you if you
  # are standing in it, which is the whole reason this rule lives here rather
  # than on the measure's own threshold.
  #
  # `player-died` negated too: resurrection reads it a pass later than this
  # writes it, and the room is still flooded on that later turn - so without
  # this, the water drowns the player a second time while the first is still
  # waiting to be resolved.
  - requires:
      - type: flag
        data:
          flag: maintenance-flooded
      - type: flag
        negate: true
        data:
          flag: player-died
    triggers:
      - type: response
        data:
          text: I'm afraid you have done drowned yourself.
      # `player-died` rather than `end-game`: every death in ZIL goes through
      # one routine, `JIGS-UP`, which gives every one of them the same two
      # resurrections before the third is final - drowning included.
      - type: set-flag
        data:
          flag: player-died
          value: true

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 1
          max: 2
    triggers:
      - type: response
        data:
          text: The water level here is now up to your ankles.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 3
          max: 4
    triggers:
      - type: response
        data:
          text: The water level here is now up to your shin.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 5
          max: 6
    triggers:
      - type: response
        data:
          text: The water level here is now up to your knees.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 7
          max: 8
    triggers:
      - type: response
        data:
          text: The water level here is now up to your hips.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 9
          max: 10
    triggers:
      - type: response
        data:
          text: The water level here is now up to your waist.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 11
          max: 12
    triggers:
      - type: response
        data:
          text: The water level here is now up to your chest.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 13
          max: 14
    triggers:
      - type: response
        data:
          text: The water level here is now up to your neck.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 15
          max: 16
    triggers:
      - type: response
        data:
          text: The water level here is now over your head.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 17
          max: 18
    triggers:
      - type: response
        data:
          text: The water level here is now high in your lungs.
