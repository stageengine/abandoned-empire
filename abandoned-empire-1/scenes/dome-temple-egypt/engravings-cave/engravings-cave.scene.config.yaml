id: engravings-cave
tags: [dark]

name: Engravings Cave

presence:
  - conditions:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You have entered a low cave with passages leading northwest and east.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - engravings
  - id: engravings-cave.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: engravings-cave.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
navigation:
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: dome-room
  - id: northwest
    triggers:
      - type: change-scene
        data:
          scene: round-room
