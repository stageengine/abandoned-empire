id: mirror-room-1
tags: [dark]

name: Mirror Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You are in a large square room with tall ceilings. On the south wall is an enormous
            mirror which fills the entire wall. There are exits on the other three sides of the
            room.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - mirror-1
  - id: mirror-room-1.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: mirror-room-1.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: cold-passage
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: small-cave
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: twisting-passage
