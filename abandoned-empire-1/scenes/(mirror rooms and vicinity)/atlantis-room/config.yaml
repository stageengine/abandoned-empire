id: atlantis-room
tags: [dark]

name: Atlantis Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is an ancient room, long under water. There is an exit to the south and a
            staircase leading up.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - trident
  - id: atlantis-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: atlantis-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: reservoir-north
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: small-cave
