id: mirror-room-2

name: Mirror Room

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are in a large square room with tall ceilings. On the south wall is an enormous
            mirror which fills the entire wall. There are exits on the other three sides of the
            room.

  # ZIL's own `MIRROR-ROOM` routine answers for both rooms, and appends this
  # line to either one's own description once the mirror is broken - `also`,
  # so it speaks beside whichever of the two blocks above answered rather
  # than competing with them for the room's one description.
  - also: true
    requires:
      - type: flag
        data: { flag: mirror-mung }
    triggers:
      - type: response
        data:
          text: Unfortunately, the mirror has been destroyed by your recklessness.

objects:
  - mirror-2
  - id: mirror-room-2.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: mirror-room-2.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: narrow-passage
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: tiny-cave
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: winding-passage
