# What this room does, and only this room.

every-turn:
  # Standing on the mud when the gates have been closed again.
  #
  # `player-died` negated too: resurrection reads it a pass later than this
  # writes it, and the tide is still in on that later turn - so without this,
  # the water drowns the player a second time while the first is still
  # waiting to be resolved.
  - requires:
      - type: flag
        negate: true
        data:
          flag: low-tide
      - type: flag
        negate: true
        data:
          flag: player-died
    triggers:
      - type: response
        data:
          text: >-
            The water level here has risen over your head, and the currents take you off your
            feet and away.
      # `player-died` rather than `end-game`: every death in ZIL goes through
      # one routine, `JIGS-UP`, which gives every one of them the same two
      # resurrections before the third is final - drowning included.
      - type: set-flag
        data:
          flag: player-died
          value: true

  - requires:
      - type: flag
        negate: true
        data:
          flag: gates-open
      - type: flag
        data:
          flag: low-tide
    triggers:
      - type: response
        data:
          text: >-
            You notice that the water level here is rising rapidly. The currents are also
            becoming stronger. Staying here seems quite perilous!

