id: maze-12
tags: [dark]

name: Maze

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: This is part of a maze of twisty little passages, all alike.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: dead-end-4
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: maze-13
  - id: southwest
    triggers:
      - type: change-scene
        data:
          scene: maze-11
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: maze-9
  - id: down
    triggers:
      - type: response
        data:
          text: >-
            You won't be able to get back up to the tunnel you are going through when it gets to the next room.
      - type: change-scene
        data:
          scene: maze-5

objects:
  - id: maze-12.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: maze-12.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
