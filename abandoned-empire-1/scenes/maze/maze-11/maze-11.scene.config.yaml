id: maze-11
tags: [dark]

name: Maze

presence:
  - conditions:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: This is part of a maze of twisty little passages, all alike.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

navigation:
  - id: northeast
    triggers:
      - type: change-scene
        data:
          scene: grating-room
  - id: northwest
    triggers:
      - type: change-scene
        data:
          scene: maze-13
  - id: southwest
    triggers:
      - type: change-scene
        data:
          scene: maze-12
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: maze-10

objects:
  - id: maze-11.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: maze-11.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
