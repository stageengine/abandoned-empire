id: maze-5
tags: [dark]

name: Maze

presence:
  - conditions:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is part of a maze of twisty little passages, all alike. A skeleton, probably
            the remains of a luckless adventurer, lies here.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - bones
  - burned-out-lantern
  - bag-of-coins
  - rusty-knife
  - keys
  - id: maze-5.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: maze-5.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: maze-3
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: dead-end-2
  - id: southwest
    triggers:
      - type: change-scene
        data:
          scene: maze-6
