id: cyclops-room
tags: [dark]

name: Cyclops Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This room has an exit on the northwest, and a staircase leading up.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

characters: [cyclops]

# `odysseus`'s other answer, "Wasn't he a sailor?", lives in the game's own
# `actions.yaml` and is what a failed `requires` here falls through to - once he
# has fled, or from anywhere else in the game.
actions:
  - id: odysseus
    requires:
      - type: character-here
        data: { character: cyclops }
      - type: flag
        negate: true
        data: { flag: cyclops-flag }
    triggers:
      - type: response
        data:
          text: >-
            The cyclops, hearing the name of his father's deadly nemesis, flees the room by
            knocking down the wall on the east of the room.
      - type: remove-object
        data:
          object: cyclops
      - type: set-flag
        data:
          flag: cyclops-flag
          value: true
      - type: set-flag
        data:
          flag: magic-flag
          value: true

navigation:
  - id: east
    requires:
      - type: flag
        data:
          flag: magic-flag
        failure:
          triggers:
            - type: response
              data:
                text: The east wall is solid rock.
    triggers:
      - type: change-scene
        data:
          scene: strange-passage
  - id: northwest
    triggers:
      - type: change-scene
        data:
          scene: maze-15
  # ZIL hangs the thief's ambush on the treasure room's own `M-ENTER`; the
  # engine puts an entry's effects on the way in instead (the trap door's
  # `down` in `living-room.scene.yaml` is the same habit), and this is the
  # only way in. He is teleported in rather than found already there only the
  # first time - a live thief already standing in the room (wandered there on
  # his own) needs no scream to explain his presence.
  - id: up
    requires:
      - type: flag
        data:
          flag: cyclops-flag
        failure:
          triggers:
            - type: response
              data:
                text: The cyclops doesn't look like he'll let you past.
      - type: all-of
        data:
          conditions:
            - type: object-in
              negate: true
              data: { object: thief, location: bin }
            - type: object-in
              negate: true
              data: { object: thief, location: treasure-room }
        failure:
          triggers:
            - type: change-scene
              data:
                scene: treasure-room
    triggers:
      - type: response
        data:
          text: >-
            You hear a scream of anguish as you violate the robber's hideaway. Using passages
            unknown to you, he rushes to its defense.
      - type: move-object
        data:
          object: thief
          to: treasure-room
      - type: change-scene
        data:
          scene: treasure-room

objects:
  - id: cyclops-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: cyclops-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
