id: west-of-house

name: West of House

presence:
  - conditions:
      - type: flag
        data:
          flag: won-flag
    triggers:
      - type: response
        data:
          text: >-
            You are standing in an open field west of a white house, with a boarded front door. A
            secret path leads southwest into the forest.

  - triggers:
      - type: response
        data:
          text: >-
            You are standing in an open field west of a white house, with a boarded front door.

objects:
  - id: west-of-house.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: west-of-house.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - front-door
  - advertisement
  - mailbox
  - id: west-of-house.white-house
    name: white house
    synonyms: [house, beauti house, coloni house]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                The house is a beautiful colonial house which is painted white. It is clear that the
                owners must have been extremely wealthy.
      - id: burn
        triggers:
          - type: response
            data:
              text: >-
                You must be joking.
  - id: west-of-house.board
    name: board
    synonyms: [boards]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The boards are securely fastened.
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                The boards are securely fastened.
  - id: west-of-house.forest
    name: forest
    synonyms: [trees, pines, hemlocks]

    actions:
      - id: listen
        triggers:
          - type: response
            data:
              text: >-
                The pines and the hemlocks seem to be murmuring.
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                You cannot see the forest for the trees.
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: north-of-house
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: south-of-house
  - id: east
    triggers:
      - type: response
        data:
          text: The door is boarded and you can't remove the boards.
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: forest-1
  - id: northeast
    triggers:
      - type: change-scene
        data:
          scene: north-of-house
  - id: southeast
    triggers:
      - type: change-scene
        data:
          scene: south-of-house
  - id: southwest
    conditions:
      - type: flag
        data:
          flag: won-flag
    triggers:
      - type: change-scene
        data:
          scene: stone-barrow