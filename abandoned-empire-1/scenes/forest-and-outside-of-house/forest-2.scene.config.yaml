id: forest-2

tags: [forest]

name: Forest

presence:
  - triggers:
      - type: response
        data:
          text: This is a dimly lit forest, with large trees all around.

objects:
  - id: forest-2.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: forest-2.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - bauble
  - id: forest-2.tree
    name: tree
    synonyms: [branch, large tree, large branch, storm tree, storm branch]
    actions:
      - id: climb
        triggers:
          - type: response
            data:
              text: >-
                There is no tree here suitable for climbing.
  - id: forest-2.songbird
    name: songbird
    synonyms: [bird, song bird, song songbird]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The songbird is not here but is probably nearby.
      - id: listen
        triggers:
          - type: response
            data:
              text: >-
                You can't hear the songbird now.
      - id: follow
        triggers:
          - type: response
            data:
              text: >-
                It can't be followed.
  - id: forest-2.white-house
    name: white house
    synonyms: [house, beauti house, coloni house]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                The house is a beautiful colonial house which is painted white. It is clear that the
                owners must have been extremely wealthy.
      - id: burn
        triggers:
          - type: response
            data:
              text: >-
                You must be joking.
  - id: forest-2.forest
    name: forest
    synonyms: [trees, pines, hemlocks]

    actions:
      - id: listen
        triggers:
          - type: response
            data:
              text: >-
                The pines and the hemlocks seem to be murmuring.
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                You cannot see the forest for the trees.
navigation:
  - id: north
    triggers:
      - type: response
        data:
          text: The forest becomes impenetrable to the north.
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: clearing
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: mountains
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: path
  - id: up
    synonyms: [tree]
    triggers:
      - type: response
        data:
          text: There is no tree here suitable for climbing.
