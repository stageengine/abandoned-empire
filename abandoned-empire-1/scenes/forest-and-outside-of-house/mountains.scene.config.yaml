id: mountains

name: Forest

presence:
  - triggers:
      - type: response
        data:
          text: The forest thins out, revealing impassable mountains.

objects:
  - id: mountains.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: mountains.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - mountain-range
  - id: mountains.tree
    name: tree
    synonyms: [branch, large tree, large branch, storm tree, storm branch]
    actions:
      - id: climb
        triggers:
          - type: response
            data:
              text: >-
                There is no tree here suitable for climbing.
  - id: mountains.white-house
    name: white house
    synonyms: [house, beauti house, coloni house]

    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                The house is a beautiful colonial house which is painted white. It is clear that the
                owners must have been extremely wealthy.
      - id: burn
        triggers:
          - type: response
            data:
              text: >-
                You must be joking.
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: forest-2
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: forest-2
  - id: east
    triggers:
      - type: response
        data:
          text: The mountains are impassable.
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: forest-2
  - id: up
    triggers:
      - type: response
        data:
          text: The mountains are impassable.
