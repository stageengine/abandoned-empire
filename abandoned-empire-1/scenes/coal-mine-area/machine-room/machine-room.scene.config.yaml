id: machine-room
tags: [dark]

name: Machine Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a large, cold room whose sole exit is to the north. In one corner there is a
            machine which is reminiscent of a clothes dryer. On its face is a switch which is
            labelled "START". The switch does not appear to be manipulable by any human hand
            (unless the fingers are about 1/16 by 1/4 inch). On the front of the machine is a
            large lid, which is
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - diamond
  - machine
  - gunk
  - machine-switch
  - id: machine-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: machine-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: lower-shaft
