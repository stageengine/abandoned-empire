id: gas-room
tags: [dark]

name: Gas Room

presence:
  - conditions:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a small room which smells strongly of coal gas. There is a short climb up
            some stairs and a narrow tunnel leading east.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: gas-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: gas-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - bracelet
  - id: gas-room.gas
    name: gas
    synonyms: [gas, odor, odour, fumes]
    actions:
      - id: smell
        triggers:
          - type: response
            data:
              text: "It smells like coal gas in here."
navigation:
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: mine-1
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: smelly-room
