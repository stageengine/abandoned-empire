id: reservoir
tags: [dark]

name: Reservoir

presence:
  - conditions:
      - type: flag
        data:
          flag: light
      - type: flag
        data:
          flag: low-tide
    triggers:
      - type: response
        data:
          text: >-
            You are on what used to be a large lake, but which is now a large mud pile. There
            are "shores" to the north and south.
  - conditions:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You are on the lake. Beaches can be seen north and south. Upstream a small stream
            enters the lake through a narrow cleft in the rocks. The dam can be seen downstream.
  - triggers:
      - type: response
        data:
          text: >-
            It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: reservoir.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: reservoir.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: reservoir.stream
    name: stream
    synonyms: [stream]
    actions:
      - id: swim
        triggers:
          - type: response
            data:
              text: "You can't swim in the stream."
      - id: cross
        triggers:
          - type: response
            data:
              text: "The other side is a sheer rock cliff."
  - trunk
  - id: reservoir.global-water
    name: water
    synonyms: [quantity]

    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The water slips through your fingers.
      - id: drink
        triggers:
          - type: response
            data:
              text: >-
                Thank you very much. I was rather thirsty.
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: reservoir-north
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: reservoir-south
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: in-stream
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: in-stream
  - id: down
    triggers:
      - type: response
        data:
          text: The dam blocks your way.
