id: in-stream
tags: [dark]

name: Stream

presence:
  - conditions:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You are on the gently flowing stream. The upstream route is too narrow to navigate,
            and the downstream route is invisible due to twisting walls. There is a narrow beach
            to land on.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: in-stream.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: in-stream.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: in-stream.stream
    name: stream
    synonyms: [stream]
    actions:
      - id: swim
        triggers:
          - type: response
            data:
              text: "You can't swim in the stream."
      - id: cross
        triggers:
          - type: response
            data:
              text: "The other side is a sheer rock cliff."
  - id: in-stream.global-water
    name: water
    synonyms: [quantity]

    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The water slips through your fingers.
      - id: drink
        triggers:
          - type: response
            data:
              text: >-
                Thank you very much. I was rather thirsty.
navigation:
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: reservoir
  - id: west
    triggers:
      - type: response
        data:
          text: The channel is too narrow.
  - id: up
    triggers:
      - type: response
        data:
          text: The channel is too narrow.
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: reservoir
  - id: land
    triggers:
      - type: change-scene
        data:
          scene: stream-view
