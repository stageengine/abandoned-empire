id: ew-passage
tags: [dark]

name: East-West Passage

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a narrow east-west passageway. There is a narrow stairway leading down at
            the north end of the room.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: chasm-room
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: round-room
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: troll-room
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: chasm-room

objects:
  - id: ew-passage.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: ew-passage.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
