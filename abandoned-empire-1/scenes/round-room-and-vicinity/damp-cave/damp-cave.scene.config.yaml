id: damp-cave
tags: [dark]

name: Damp Cave

presence:
  - conditions:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This cave has exits to the west and east, and narrows to a crack toward the south.
            The earth is particularly damp here.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: damp-cave.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: damp-cave.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: damp-cave.crack
    name: crack
    synonyms: [narrow crack]

    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                You can't fit through the crack.
navigation:
  - id: south
    triggers:
      - type: response
        data:
          text: It is too narrow for most insects.
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: white-cliffs-north
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: loud-room
