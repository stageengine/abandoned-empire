id: round-room
tags: [dark]

name: Round Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a circular stone room with passages in all directions. Several of them have
            unfortunately been blocked by cave-ins.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - large-bag
  - stiletto
  - id: round-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: round-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
characters: [thief]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: ns-passage
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: narrow-passage
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: loud-room
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: ew-passage
  - id: southeast
    triggers:
      - type: change-scene
        data:
          scene: engravings-cave
