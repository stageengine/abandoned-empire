# The ceremony, which happens at this gate and nowhere else - so it can only be
# written here, in the room's own rules.

every-turn:
  # Lit candles held while the wraiths are still facing you. This is the middle
  # of it, and it opens the three turns in which the prayer will work.
  - requires:
      - type: flag
        data:
          flag: ceremony
      - type: flag
        negate: true
        data:
          flag: blessing
      - type: has-item
        data:
          object: candles
      - type: flag
        data:
          flag: candles-on
    triggers:
      - type: response
        data:
          text: >-
            The flames flicker wildly and appear to dance. The earth beneath your feet trembles,
            and your legs nearly buckle beneath you. The spirits cower at your unearthly power.
      - type: set-flag
        data:
          flag: blessing
          value: true
      - type: adjust-measure
        data:
          subject: ghosts
          measure: awe
          to: 3

  # The two windows closing. Their own thresholds say what happens at the end of
  # each; these only walk them down, and only while the player is still here -
  # which is a kindness ZIL does not do, since its clocks run wherever you go.
  - requires:
      - type: flag
        data:
          flag: blessing
    triggers:
      - type: adjust-measure
        data:
          subject: ghosts
          measure: awe
          by: -1

  - requires:
      - type: flag
        data:
          flag: ceremony
      - type: flag
        negate: true
        data:
          flag: blessing
    triggers:
      - type: adjust-measure
        data:
          subject: ghosts
          measure: patience
          by: -1
