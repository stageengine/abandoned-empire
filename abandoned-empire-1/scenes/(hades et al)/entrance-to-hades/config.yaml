id: entrance-to-hades

meta:
  title: Entrance to Hades

presence:
  # Once the spirits are gone the gate stops saying they are in the way.
  - requires:
      - type: flag
        data:
          flag: lld-flag
    triggers:
      - type: response
        data:
          text: |-
            You are outside a large gateway, on which is inscribed

              Abandon every hope
            all ye who enter here!

            The gate is open; through it you can see a desolation, with a pile of mangled bodies in one
            corner. Thousands of voices, lamenting some hideous fate, can be heard.

  - triggers:
      - type: response
        data:
          text: |-
            You are outside a large gateway, on which is inscribed

              Abandon every hope
            all ye who enter here!

            The gate is open; through it you can see a desolation, with a pile of mangled bodies in one
            corner. Thousands of voices, lamenting some hideous fate, can be heard.
      - type: response
        data:
          text: >-
            The way through the gate is barred by evil spirits, who jeer at your attempts to
            pass.

characters: [ghosts]

objects:
  - id: entrance-to-hades.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: entrance-to-hades.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: entrance-to-hades.gate
    name: gate
    synonyms: [gate, gates]
    actions:
      - id: touch
        triggers:
          - type: response
            data:
              text: "The gate is protected by an invisible force. It makes your teeth ache to touch it."
      - id: open
        triggers:
          - type: response
            data:
              text: "The gate is protected by an invisible force. It makes your teeth ache to touch it."
  - hot-bell
  - id: entrance-to-hades.bodies
    name: pile of bodies
    synonyms:
      - bodies
      - body
      - remains
      - pile
      - mangled bodies
      - mangled body
      - mangled remains
      - mangled pile

    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                A force keeps you from taking the bodies.
navigation:
  - id: south
    requires:
      - type: flag
        data:
          flag: lld-flag
        failure:
          triggers:
            - type: response
              data:
                text: Some invisible force prevents you from passing through the gate.
    triggers:
      - type: change-scene
        data:
          scene: land-of-living-dead
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: tiny-cave