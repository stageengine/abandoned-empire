every:
  - requires:
      - type: flag
        data:
          flag: maintenance-flooded
      - type: flag
        negate: true
        data:
          flag: player-died
    triggers:
      - type: response
        data:
          text: I'm afraid you have done drowned yourself.
      - type: set-flag
        data:
          flag: player-died
          value: true

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 1
          max: 2
    triggers:
      - type: response
        data:
          text: The water level here is now up to your ankles.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 3
          max: 4
    triggers:
      - type: response
        data:
          text: The water level here is now up to your shin.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 5
          max: 6
    triggers:
      - type: response
        data:
          text: The water level here is now up to your knees.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 7
          max: 8
    triggers:
      - type: response
        data:
          text: The water level here is now up to your hips.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 9
          max: 10
    triggers:
      - type: response
        data:
          text: The water level here is now up to your waist.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 11
          max: 12
    triggers:
      - type: response
        data:
          text: The water level here is now up to your chest.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 13
          max: 14
    triggers:
      - type: response
        data:
          text: The water level here is now up to your neck.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 15
          max: 16
    triggers:
      - type: response
        data:
          text: The water level here is now over your head.

  - requires:
      - type: flag
        data:
          flag: leak-open
      - type: measure
        data:
          subject: leak
          measure: flood
          min: 17
          max: 18
    triggers:
      - type: response
        data:
          text: The water level here is now high in your lungs.
