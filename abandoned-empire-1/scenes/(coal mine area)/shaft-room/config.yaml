id: shaft-room
tags: [dark]

name: Shaft Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a large room, in the middle of which is a small shaft descending through the
            floor into darkness below. To the west and the north are exits from this room.
            Constructed over the top of the shaft is a metal framework to which a heavy iron
            chain is attached.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: shaft-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: shaft-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - raised-basket
  - id: shaft-room.chain
    name: chain
    # `basket` too, listed after the real `raised-basket` so declaration
    # order gives that object first claim on the word whenever it is
    # actually present - this only answers for `basket` when neither basket
    # object is here to, which is exactly when the basket has been lowered
    # and there is nothing else in this room the word could mean.
    synonyms: [chain, basket, cage, dumbwaiter]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: "The chain is secure."
      - id: move
        triggers:
          - type: response
            data:
              text: "The chain is secure."
      # "Perhaps you should do that to the basket" used to answer this
      # unconditionally, which was fine advice for `lower` - said to the
      # basket, it is reachable and already does this - and useless for
      # `raise`: once the basket is down, neither basket object is reachable
      # from here to be raised, since `raised-basket` went offstage the
      # moment it was lowered and `lowered-basket` lives at the other end of
      # the shaft. ZIL answers this from a `CHAIN-PSEUDO` object visible from
      # both ends regardless of which state the basket is in; this is that,
      # for the one direction the walkthrough actually calls from up here.
      - id: raise
        requires:
          - type: object-in
            negate: true
            data: { object: raised-basket, location: shaft-room }
            failure:
              triggers:
                - type: response
                  data:
                    text: It's already up here.
        triggers:
          - type: response
            data:
              text: The basket is raised to the top of the shaft.
          - type: move-tagged
            data: { tag: basket-cargo, from: 'in:lowered-basket', to: 'in:raised-basket' }
          - type: move-object
            data: { object: lowered-basket, to: offstage }
          - type: move-object
            data: { object: raised-basket, to: shaft-room }
      - id: lower
        triggers:
          - type: response
            data:
              text: "Perhaps you should do that to the basket."
      - id: look
        triggers:
          - type: response
            data:
              text: "The chain secures a basket within the shaft."
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: smelly-room
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: bat-room
  - id: down
    triggers:
      - type: response
        data:
          text: You wouldn't fit and would die if you could.
