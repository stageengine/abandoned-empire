id: smelly-room
tags: [dark]

name: Smelly Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a small nondescript room. However, from the direction of a small descending
            staircase a foul odor can be detected. To the south is a narrow tunnel.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: shaft-room
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: gas-room

objects:
  - id: smelly-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: smelly-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: smelly-room.gas
    name: gas
    synonyms: [gas, odor, odour, fumes]
    actions:
      - id: smell
        triggers:
          - type: response
            data:
              text: "It smells like coal gas in here."
