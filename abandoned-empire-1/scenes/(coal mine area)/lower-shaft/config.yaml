id: lower-shaft
tags: [dark]

name: Drafty Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a small drafty room in which is the bottom of a long shaft. To the south is
            a passageway and to the east a very narrow passage. In the shaft can be seen a heavy
            iron chain.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: lower-shaft.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: lower-shaft.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - lowered-basket
  - id: lower-shaft.chain
    name: chain
    # `basket` too, listed after the real `lowered-basket` so declaration
    # order gives that object first claim on the word whenever it is
    # actually present - this only answers for `basket` when neither basket
    # object is here to, which is exactly when the basket has been raised
    # and there is nothing else in this room the word could mean.
    synonyms: [chain, basket, cage, dumbwaiter]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: "The chain is secure."
      - id: move
        triggers:
          - type: response
            data:
              text: "The chain is secure."
      - id: raise
        triggers:
          - type: response
            data:
              text: "Perhaps you should do that to the basket."
      # The same gap `shaft-room/config.yaml`'s own `raise` closes, mirrored:
      # once the basket is up, neither basket object is reachable from down
      # here to be lowered again, `raised-basket` living at the other end and
      # `lowered-basket` sitting offstage until it is. Not a crossing the
      # walkthrough happens to need, but the same fact either direction.
      - id: lower
        requires:
          - type: object-in
            negate: true
            data: { object: lowered-basket, location: lower-shaft }
            failure:
              triggers:
                - type: response
                  data:
                    text: It's already down here.
        triggers:
          - type: response
            data:
              text: The basket is lowered to the bottom of the shaft.
          - type: move-tagged
            data: { tag: basket-cargo, from: 'in:raised-basket', to: 'in:lowered-basket' }
          - type: move-object
            data: { object: raised-basket, to: offstage }
          - type: move-object
            data: { object: lowered-basket, to: lower-shaft }
      - id: look
        triggers:
          - type: response
            data:
              text: "The chain secures a basket within the shaft."
navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: machine-room
  - id: east
    requires:
      # ZIL asks whether every single thing you are carrying weighs four or less,
      # which is not a question Stage can put: `carrying` reads the total. This
      # asks that the total is four or less, which is stricter - two small things
      # pass in Zork and are refused here - and it is the nearest true thing.
      # Before there was a limit at all this was a flag nothing ever set, so the
      # passage was shut for good and the Drafty Room could not be reached.
      - type: carrying
        data: { max: 4 }
        failure:
          triggers:
            - type: response
              data:
                text: You cannot fit through this passage with that load.
    triggers:
      - type: change-scene
        data:
          scene: timber-room