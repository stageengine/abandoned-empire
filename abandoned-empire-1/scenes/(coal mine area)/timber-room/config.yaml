id: timber-room
tags: [dark]

name: Timber Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a long and narrow passage, which is cluttered with broken timbers. A wide
            passage comes from the east and turns at the west end of the room into a very narrow
            passageway. From the west comes a strong draft.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - timbers
  - id: timber-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: timber-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
navigation:
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: ladder-bottom
  - id: west
    requires:
      - type: carrying
        data: { of: largest, max: 4 }
        failure:
          triggers:
            - type: response
              data:
                text: You cannot fit through this passage with that load.
    triggers:
      - type: change-scene
        data:
          scene: lower-shaft
