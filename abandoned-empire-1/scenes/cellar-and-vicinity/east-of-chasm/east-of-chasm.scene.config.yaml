id: east-of-chasm
tags: [dark]

name: East of Chasm

presence:
  - conditions:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You are on the east edge of a chasm, the bottom of which cannot be seen. A narrow
            passage goes north, and the path you are on continues to the east.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: cellar
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: gallery
  - id: down
    triggers:
      - type: response
        data:
          text: The chasm probably leads straight to the infernal regions.

objects:
  - id: east-of-chasm.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: east-of-chasm.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: east-of-chasm.chasm
    name: chasm
    synonyms: [chasm]
    actions:
      - id: jump
        triggers:
          - type: response
            data:
              text: "You look before leaping, and realize that you would never survive."
      - id: cross
        triggers:
          - type: response
            data:
              text: "It's too far to jump, and there's no bridge."
