id: troll-room
tags: [dark]

name: The Troll Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a small room with passages to the east and south and a forbidding hole
            leading west. Bloodstains and deep scratches (perhaps made by an axe) mar the walls.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - axe
  - id: troll-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: troll-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
characters: [troll]

navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: cellar
  - id: east
    requires:
      - type: flag
        data:
          flag: troll-flag
        failure:
          triggers:
            - type: response
              data:
                text: The troll fends you off with a menacing gesture.
    triggers:
      - type: change-scene
        data:
          scene: ew-passage
  - id: west
    requires:
      - type: flag
        data:
          flag: troll-flag
        failure:
          triggers:
            - type: response
              data:
                text: The troll fends you off with a menacing gesture.
    triggers:
      - type: change-scene
        data:
          scene: maze-1
