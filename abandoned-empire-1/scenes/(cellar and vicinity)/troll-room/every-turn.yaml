# What this room does, and only this room.

every-turn:

  # The troll, who blocks both ways on and does not wait to be asked.
  #
  # One roll a turn, and now more than two answers to it. ZIL settles each blow
  # against a table indexed on both fighters' strength and drawn from nine times
  # over, and does the weighting by repeating entries inside a sliding window:
  # `DEF3A` is five MISSED, two STAGGER, two LIGHT-WOUND and two SERIOUS-WOUND,
  # and a stronger attacker's window drops misses off the front. Those counts are
  # the weights below.
  #
  # The wording is Zork's own, from `TROLL-MELEE`. Where it offers several lines
  # for one outcome it picks between them without repeating until it has used
  # them all - `shuffle` does that now - so the miss, which is the one the
  # player sees most, is a nested roll of its own with that turned on, and the
  # rest take one line each.
  - requires:
      - type: object-here
        data:
          object: troll
    chance:
      outcomes:
        - weight: 5
          triggers:
            - type: response
              chance:
                shuffle: troll-miss
                outcomes:
                  - weight: 1
                    triggers:
                      - type: response
                        data:
                          text: The troll swings his axe, but it misses.
                  - weight: 1
                    triggers:
                      - type: response
                        data:
                          text: The troll's axe barely misses your ear.
                  - weight: 1
                    triggers:
                      - type: response
                        data:
                          text: The axe sweeps past as you jump aside.
                  - weight: 1
                    triggers:
                      - type: response
                        data:
                          text: The axe crashes against the rock, throwing sparks!
              data:
                text: The troll swings his axe, but it misses.

        # A stagger costs the turn and no blood, which is what it costs in Zork.
        - weight: 2
          triggers:
            - type: response
              data:
                text: You stagger back under a hail of axe strokes.

        - weight: 2
          triggers:
            - type: response
              data:
                text: The troll swings his axe, and it nicks your arm as you dodge.
            - type: adjust-measure
              data:
                subject: player
                measure: health
                by: -1
            - type: adjust-measure
              data:
                subject: player
                measure: allowance
                by: -10

        - weight: 2
          triggers:
            - type: response
              data:
                text: An axe stroke makes a deep wound in your leg.
            - type: adjust-measure
              data:
                subject: player
                measure: health
                by: -1
            - type: adjust-measure
              data:
                subject: player
                measure: allowance
                by: -20
