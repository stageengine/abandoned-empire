id: studio
tags: [dark]

name: Studio

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This appears to have been an artist's studio. The walls and floors are splattered
            with paints of 69 different colors. Strangely enough, nothing of value is hanging
            here. At the south end of the room is an open door (also covered with paint). A dark
            and narrow chimney leads up from a fireplace; although you might be able to get up
            it, it seems unlikely you could get back down.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: studio.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: studio.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: studio.door
    name: door
    synonyms: [door]
    actions:
      - id: open
        triggers:
          - type: response
            data:
              text: "The door won't budge."
      - id: close
        triggers:
          - type: response
            data:
              text: "The door won't budge."
  - id: studio.paint
    name: paint
    synonyms: [paint]
    actions:
      - id: break
        triggers:
          - type: response
            data:
              text: "Some paint chips away, revealing more paint."
  - owners-manual
  - id: studio.chimney
    name: chimney
    synonyms: [dark chimney, narrow chimney]

    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: >-
                The chimney leads downward, and looks climbable.
navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: gallery
  - id: up
    synonyms: [chimney]
    requires:
      - type: carrying
        negate: true
        data:
          of: count
          max: 0
        failure:
          triggers:
            - type: response
              data:
                text: Going up empty-handed is a bad idea.
      - type: has-item
        data:
          object: lamp
        failure:
          triggers:
            - type: response
              data:
                text: You can't get up there with what you're carrying.
      - type: carrying
        data:
          of: count
          max: 2
        failure:
          triggers:
            - type: response
              data:
                text: You can't get up there with what you're carrying.
    triggers:
      - type: response
        data:
          text: >-
            You squeeze up the chimney, which is narrow and black and drops soot down the back of
            your neck, and come out in the fireplace of the kitchen.
      - type: set-flag
        data:
          flag: trap-door-barred
          value: false
      - type: change-scene
        data:
          scene: kitchen
