id: treasure-room
tags: [dark]

name: Treasure Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a large room, whose east wall is solid granite. A number of discarded bags,
            which crumble at your touch, are scattered about on the floor. There is an exit down
            a staircase.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - chalice
  - id: treasure-room.granite-wall
    name: granite wall
    synonyms: [granite, granite wall]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: "The east wall is solid granite here."
      - id: get
        triggers:
          - type: response
            data:
              text: "It's solid granite."
      - id: raise
        triggers:
          - type: response
            data:
              text: "It's solid granite."
  - id: treasure-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: treasure-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
navigation:
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: cyclops-room
