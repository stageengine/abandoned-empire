id: strange-passage
tags: [dark]

name: Strange Passage

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a long passage. To the west is one entrance. On the east there is an old
            wooden door, with a large opening in it (about cyclops sized).
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

navigation:
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: living-room
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: cyclops-room

objects:
  - id: strange-passage.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: strange-passage.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
