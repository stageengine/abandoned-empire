- id: diagnose
  triggers:
    - type: response
      data:
        text: >-
          You have <player:health> of four wounds' worth of life in you, and can carry
          <player:allowance>.

- id: wait
  triggers:
    - type: response
      data:
        text: Time passes...
    - type: turn
      data:
        count: 3

- id: verbose
  triggers:
    - type: response
      data:
        text: Maximum verbosity.

- id: pray
  triggers:
    - type: response
      data:
        text: If you pray enough, your prayers may be answered.

- id: launch
  requires:
    - type: flag
      data: { flag: aboard }
    - type: scene
      data: { id: dam-base }
  triggers:
    - type: response
      data: { text: The boat is moving in the current. }
    - type: change-scene
      data: { scene: river-1 }
    - type: adjust-measure
      data:
        subject: player
        measure: river-timer
        to: 4

- id: launch
  requires:
    - type: flag
      data: { flag: aboard }
    - type: scene
      data: { id: white-cliffs-north }
  triggers:
    - type: response
      data: { text: The boat is moving in the current. }
    - type: change-scene
      data: { scene: river-3 }
    - type: adjust-measure
      data:
        subject: player
        measure: river-timer
        to: 3

- id: launch
  requires:
    - type: flag
      data: { flag: aboard }
    - type: scene
      data: { id: white-cliffs-south }
  triggers:
    - type: response
      data: { text: The boat is moving in the current. }
    - type: change-scene
      data: { scene: river-4 }
    - type: adjust-measure
      data:
        subject: player
        measure: river-timer
        to: 2

- id: launch
  requires:
    - type: flag
      data: { flag: aboard }
    - type: scene
      data: { id: sandy-beach }
  triggers:
    - type: response
      data: { text: The boat is moving in the current. }
    - type: change-scene
      data: { scene: river-4 }
    - type: adjust-measure
      data:
        subject: player
        measure: river-timer
        to: 2

- id: launch
  requires:
    - type: flag
      data: { flag: aboard }
      failure:
        triggers:
          - type: response
            data: { text: You're not in the boat! }
  triggers:
    - type: response
      data: { text: You can't launch it here. }

- id: disembark
  requires:
    - type: flag
      data: { flag: aboard }
    - type: any-of
      data:
        conditions:
          - type: scene
            data: { tag: river }
          - type: scene
            data: { id: reservoir }
          - type: scene
            data: { id: in-stream }
  triggers:
    - type: response
      data:
        text: You realize that getting out here would be fatal.

- id: disembark
  requires:
    - type: flag
      data: { flag: aboard }
      failure:
        triggers:
          - type: response
            data: { text: You're not in the boat! }
  triggers:
    - type: response
      data: { text: You are no longer in the magic boat. }
    - type: set-flag
      data: { flag: aboard, value: false }

- id: odysseus
  triggers:
    - type: response
      data:
        text: Wasn't he a sailor?

- id: xyzzy
  triggers:
    - type: response
      data:
        text: A hollow voice says "Fool."

- id: hello
  requires:
