id: cyclops

synonyms:
  - monster
  - eye
  - hungry cyclops
  - hungry monster
  - hungry eye
  - giant cyclops
  - giant monster
  - giant eye
start: cyclops-room

measures:
  - id: wrath
    max: 10
    start: 0
    thresholds:
      - from: 1
        triggers:
          - type: response
            data:
              text: The cyclops seems somewhat agitated.
      - from: 2
        triggers:
          - type: response
            data:
              text: The cyclops appears to be getting more agitated.
      - from: 3
        triggers:
          - type: response
            data:
              text: The cyclops is moving about the room, looking for something.
      - from: 4
        triggers:
          - type: response
            data:
              text: >-
                The cyclops was looking for salt and pepper. No doubt they are condiments for
                his upcoming snack.
      - from: 5
        triggers:
          - type: response
            data:
              text: The cyclops is moving toward you in an unfriendly manner.
      - from: 6
        triggers:
          - type: response
            data:
              text: 'You have two choices: 1. Leave  2. Become dinner.'
      - from: 7
        triggers:
          - type: response
            data:
              text: >-
                The cyclops, tired of all of your games and trickery, grabs you firmly. As he
                licks his chops, he says "Mmm. Just like Mom used to make 'em." It's nice to be
                appreciated.
          - type: set-flag
            data:
              flag: player-died
              value: true

presence:
  - conditions:
      - type: flag
        data: { flag: cyclops-asleep }
    triggers:
      - type: response
        data:
          text: The cyclops is asleep at the foot of the stairs.
  - triggers:
      - type: response
        data:
          text: A hungry cyclops is standing at the foot of the stairs.

actions:
  - id: look
    conditions:
      - type: flag
        data: { flag: cyclops-asleep }
    triggers:
      - type: response
        data:
          text: The cyclops is sleeping like a baby, albeit a very ugly one.

  - id: look
    triggers:
      - type: response
        data:
          text: A hungry cyclops is standing at the foot of the stairs.

  - id: give
    indirect: lunch
    triggers:
      - type: response
        data:
          text: >-
            The cyclops says "Mmm Mmm. I love hot peppers! But oh, could I use a drink.
            Perhaps I could drink the blood of that thing." From the gleam in his eye, it
            could be surmised that you are "that thing".
      - type: remove-object
        data:
          object: lunch
      - type: set-flag
        data:
          flag: cyclops-thirsty
          value: true
      - type: set-flag
        data:
          flag: cyclops-provoked
          value: true

  - id: give
    indirect: bottle
    conditions:
      - type: flag
        data: { flag: cyclops-thirsty }
    triggers:
      - type: response
        data:
          text: >-
            The cyclops takes the bottle, checks that it's open, and drinks the water. A
            moment later, he lets out a yawn that nearly blows you over, and then falls fast
            asleep (what did you put in that drink, anyway?).
      - type: move-object
        data:
          object: bottle
          to: here
      - type: set-flag
        data:
          flag: cyclops-asleep
          value: true
      - type: set-flag
        data:
          flag: cyclops-flag
          value: true

  - id: give
    indirect: bottle
    triggers:
      - type: response
        data:
          text: The cyclops apparently is not thirsty and refuses your generous offer.

  - id: give
    indirect: garlic
    triggers:
      - type: response
        data:
          text: The cyclops may be hungry, but there is a limit.

  - id: give
    triggers:
      - type: response
        data:
          text: The cyclops is not so stupid as to eat THAT!

  - id: attack
    conditions:
      - type: flag
        data: { flag: cyclops-asleep }
    triggers:
      - type: response
        data:
          text: The cyclops yawns and stares at the thing that woke him up.
      - type: set-flag
        data:
          flag: cyclops-asleep
          value: false
      - type: set-flag
        data:
          flag: cyclops-flag
          value: false
      - type: set-flag
        data:
          flag: cyclops-provoked
          value: true

  - id: attack
    triggers:
      - type: response
        data:
          text: >-
            The cyclops shrugs but otherwise ignores your pitiful attempt.
      - type: set-flag
        data:
          flag: cyclops-provoked
          value: true

  - id: throw
    triggers:
      - type: response
        data:
          text: >-
            The cyclops shrugs but otherwise ignores your pitiful attempt.
      - type: set-flag
        data:
          flag: cyclops-provoked
          value: true

  - id: break
    triggers:
      - type: response
        data:
          text: >-
            "Do you think I'm as stupid as my father was?", he says, dodging.
      - type: set-flag
        data:
          flag: cyclops-provoked
          value: true

  - id: get
    triggers:
      - type: response
        data:
          text: The cyclops doesn't take kindly to being grabbed.

  - id: tie
    triggers:
      - type: response
        data:
          text: You cannot tie the cyclops, though he is fit to be tied.

  - id: listen
    triggers:
      - type: response
        data:
          text: You can hear his stomach rumbling.

  - id: tell
    conditions:
      - type: flag
        data: { flag: cyclops-asleep }
    triggers:
      - type: response
        data:
          text: No use talking to him. He's fast asleep.

  - id: tell
    triggers:
      - type: response
        data:
          text: The cyclops prefers eating to making conversation.

  - id: hello
    triggers:
      - type: response
        data:
          text: The cyclops bows his head to you in greeting.
