  - id: give
    triggers:
      - type: response
        data:
          text: >-
            The thief places the gift in his bag and thanks you politely.

  - id: attack
    preposition: with
    indirect: knife
    conditions:
      - type: has-item
        data:
          object: knife
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the knife.
      - type: measure
        data:
          subject: thief
          measure: strength
          max: 1
      - type: chance
        data:
          of: 100
          index: [1..40]
          name: characters-thief-character-143
        failure:
          triggers:
            - type: journal
            - type: response
              data:
                text: Your knife misses the thief by an inch.
    triggers:
      - type: response
        data:
          text: The fatal blow catches the thief squarely, and he crumples to the floor.
      - type: adjust-measure
        data:
          subject: thief
          measure: strength
          by: -1

  - id: attack
    preposition: with
    indirect: knife
    conditions:
      - type: has-item
        data:
          object: knife
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the knife.
      - type: chance
        data:
          of: 100
          index: [1..40]
          name: characters-thief-character-172
        failure:
          triggers:
            - type: journal
            - type: response
              data:
                text: Your knife misses the thief by an inch.
    triggers:
      - type: response
        data:
          text: A quick thrust pinks the thief's arm, and blood starts to trickle down.
      - type: adjust-measure
        data:
          subject: thief
          measure: strength
          by: -1
      - type: set-flag
        data:
          flag: thief-fighting
          value: true

  - id: throw
    indirect: knife
    conditions:
      - type: flag
        negate: true
        data:
          flag: thief-fighting
    triggers:
      - type: response
        data:
          text: >-
            You missed. The thief makes no attempt to take the knife, though it would be a fine
            addition to the collection in his bag. He does seem angered by your attempt.
      - type: move-object
        data:
          object: knife
          to: here
      - type: set-flag
        data:
          flag: thief-fighting
          value: true

