id: thief

synonyms:
  - robber
  - man
  - person
  - shady thief
  - shady robber
  - shady man
  - shady person
  - suspicious thief
  - suspicious robber
  - suspicious man
  - suspicious person
  - seedy thief
  - seedy robber
  - seedy man
  - seedy person
conditions:
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: >-
            There is a suspicious-looking individual, holding a large bag, leaning against one wall. He is
            armed with a deadly stiletto.
start: round-room

holds: [large-bag, stiletto]

measures:
  - id: strength
    max: 5
    start: 5
    thresholds:
      - from: 0
        triggers:
          - type: response
            data:
              text: >-
                Almost as soon as the thief breathes his last breath, a cloud of sinister black
                fog envelops him, and when the fog lifts, the carcass has disappeared.
          - type: remove-object
            data:
              object: thief
          - type: achievement
            data: { id: caught-the-thief }
          - type: move-object
            data:
              object: large-bag
              to: here
          - type: move-object
            data:
              object: stiletto
              to: here
          - type: move-tagged
            data:
              tag: treasure
              from: held:thief
              to: here
          - type: set-flag
            data:
              flag: thief-fighting
              value: false
          - type: set-flag
            data:
              flag: thief-just-died
              value: true
      - from: 1

actions:
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            The thief is a slippery character with beady eyes that flit back and forth. He
            carries, along with an unmistakable arrogance, a large bag over his shoulder and a
            vicious stiletto, whose blade is aimed menacingly in your direction. I'd watch out
            if I were you.

  - id: tell
    triggers:
      - type: response
        data:
          text: The thief is a strong, silent type.

  - id: listen
    triggers:
      - type: response
        data:
          text: The thief says nothing, as you have not been formally introduced.

  - id: get
    triggers:
      - type: response
        data:
          text: Once you got him, what would you do with him?

  - id: give
    indirect: egg
    triggers:
      - type: response
        data:
          text: >-
            The thief is taken aback by your unexpected generosity, but accepts the
            jewel-encrusted egg and stops to admire its beauty.
      - type: move-object
        data:
          object: egg
          to: held:thief

  - id: give
    indirect: bag-of-coins
    triggers:
      - type: response
        data:
          text: >-
            The thief is taken aback by your unexpected generosity, but accepts the
            leather bag of coins and stops to admire its beauty.
      - type: move-object
        data:
