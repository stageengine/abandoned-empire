  - id: give
    indirect: trunk
    triggers:
      - type: response
        data:
          text: >-
            The thief is taken aback by your unexpected generosity, but accepts the
            trunk of jewels and stops to admire its beauty.
      - type: move-object
        data:
          object: trunk
          to: held:thief

  # Zork lets a treasure buy you a moment's grace, and takes the rest of the fight
  # off a strength that grows with your score. Neither is written: what is written
  # is that he takes it, which is the half a player can see.
  - id: give
    triggers:
      - type: response
        data:
          text: >-
            The thief places the gift in his bag and thanks you politely.

  # ZIL's own villain table names the knife as his one weakness (a sword or bare
  # hands answer through the block below instead) - written above the other
  # because the first requirement that holds decides which action this is, and a
  # nearly-beaten thief is the particular case.
  - id: attack
    preposition: with
    indirect: knife
    requires:
      - type: has-item
        data:
          object: knife
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the knife.
      - type: measure
        data:
          subject: thief
          measure: strength
          max: 1
      - type: chance
        data:
          of: 100
          index: [1..40]
          name: characters-thief-character-143
        failure:
          triggers:
            - type: journal
            - type: response
              data:
                text: Your knife misses the thief by an inch.
    triggers:
      - type: response
        data:
          text: The fatal blow catches the thief squarely, and he crumples to the floor.
      - type: adjust-measure
        data:
          subject: thief
          measure: strength
          by: -1

  - id: attack
    preposition: with
    indirect: knife
    requires:
      - type: has-item
        data:
          object: knife
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the knife.
      - type: chance
        data:
          of: 100
          index: [1..40]
          name: characters-thief-character-172
        failure:
          triggers:
            - type: journal
            - type: response
              data:
                text: Your knife misses the thief by an inch.
    triggers:
      - type: response
        data:
          text: A quick thrust pinks the thief's arm, and blood starts to trickle down.
      - type: adjust-measure
        data:
          subject: thief
          measure: strength
          by: -1
      - type: set-flag
        data:
          flag: thief-fighting
          value: true

  # Throwing rather than swinging the knife at a thief not yet fighting -
  # ZIL's `ROBBER-FUNCTION` answers this one separately from `V-ATTACK`, and
  # a tenth of the time frightens him into fleeing with everything he is
  # holding spilling to the floor. That branch needs a state this port's
  # thief does not have - alive and fighting or dead, nothing between - so
  # only the nine-in-ten "missed and angered him" outcome is reproduced here,
  # the same scope the audit that found this gap already accepted for the
  # thief's missing unconscious state.
  - id: throw
    indirect: knife
    requires:
      - type: flag
        negate: true
        data:
          flag: thief-fighting
    triggers:
      - type: response
        data:
          text: >-
            You missed. The thief makes no attempt to take the knife, though it would be a fine
            addition to the collection in his bag. He does seem angered by your attempt.
      - type: move-object
        data:
          object: knife
          to: here
      - type: set-flag
        data:
          flag: thief-fighting
          value: true

  # ZIL's `FIND-WEAPON` answers to any of five blades, not the knife alone -
  # `V-ATTACK` only asks `WEAPONBIT`, and `VILLAIN-STRENGTH` only singles the
  # knife out for a further -1 to the thief's own effective strength
  # (`V-BEST-ADV`), lower being easier to land a killing blow against.
  # Without the knife this port's `attack` only had the bare-hands block
  # below to fall to - no `preposition` field there to match `with` anything,
  # so a real fight never started. Fixed the same three more times over, at a
  # flat percentage fifteen points under the knife's own - the same
  # approximation `troll.character.yaml` makes for its own off-weapon fights,
  # and for the same reason: this port's one-roll-per-swing model has no
  # nine-outcome table to be fifteen points apart from in the first place.
  - id: attack
    preposition: with
    indirect: sword
    requires:
      - type: has-item
        data:
          object: sword
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the sword.
      - type: measure
        data:
          subject: thief
          measure: strength
          max: 1
      - type: chance
        data:
          of: 100
          index: [1..25]
          name: characters-thief-character-sword-1
        failure:
          triggers:
            - type: journal
            - type: response
              data:
                text: Your sword misses the thief by an inch.
    triggers:
      - type: response
        data:
          text: The fatal blow catches the thief squarely, and he crumples to the floor.
      - type: adjust-measure
        data:
          subject: thief
          measure: strength
          by: -1

  - id: attack
    preposition: with
    indirect: sword
    requires:
      - type: has-item
        data:
          object: sword
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the sword.
      - type: chance
        data:
          of: 100
          index: [1..25]
          name: characters-thief-character-sword-2
        failure:
          triggers:
            - type: journal
            - type: response
              data:
                text: Your sword misses the thief by an inch.
    triggers:
      - type: response
