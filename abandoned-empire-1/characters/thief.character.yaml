  - id: attack
    preposition: with
    indirect: rusty-knife
    requires:
      - type: has-item
        data:
          object: rusty-knife
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the rusty knife.
      - type: chance
        data:
          of: 100
          index: [1..25]
          name: characters-thief-character-rusty-knife-2
        failure:
