id: thief

synonyms:
  - robber
  - man
  - person
  - shady thief
  - shady robber
  - shady man
  - shady person
  - suspicious thief
  - suspicious robber
  - suspicious man
  - suspicious person
  - seedy thief
  - seedy robber
  - seedy man
  - seedy person
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: >-
            There is a suspicious-looking individual, holding a large bag, leaning against one wall. He is
            armed with a deadly stiletto.
start: round-room

# In their hands rather than inside them. A thing somebody is holding is not
# in the room, cannot be taken, and changes hands through an action they own -
# which is what these two were always meant to be and could not be said before.
holds: [large-bag, stiletto]

# Zork gives him a strength of five against the troll's two - the toughest fixed
# fight in the game - and settles each blow against a table keyed on both
# fighters' relative strength. Stage has one flat roll per action, the same
# simplification `troll.character.yaml` already makes, so the number moves but
# the shape does not: a strength that only goes down, and a miss/wound pair of
# actions rather than nine outcomes.
measures:
  - id: strength
    max: 5
    start: 5
    thresholds:
      - from: 0
        triggers:
          - type: response
            data:
              text: >-
                Almost as soon as the thief breathes his last breath, a cloud of sinister black
                fog envelops him, and when the fog lifts, the carcass has disappeared.
          - type: remove-object
            data:
              object: thief
          # His bag and blade stay behind, which is what makes killing him worth
          # it: whatever he has stolen over the game is in that bag.
          - type: move-object
            data:
              object: large-bag
              to: here
          - type: move-object
            data:
              object: stiletto
              to: here
          - type: set-flag
            data:
              flag: thief-fighting
              value: false
      - from: 1

# What he says when spoken to, looked at, fought and given things. What he *does* -
# wandering the map and taking whatever you are carrying - is not here and cannot
# be: `remove-from-inventory` names one id, so "take what they are holding" is a
# rule per stealable thing against a set that changes every turn. The roadmap has
# it as a trigger that cannot act on a thing chosen during play.
actions:
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            The thief is a slippery character with beady eyes that flit back and forth. He
            carries, along with an unmistakable arrogance, a large bag over his shoulder and a
            vicious stiletto, whose blade is aimed menacingly in your direction. I'd watch out
            if I were you.

  - id: tell
    triggers:
      - type: response
        data:
          text: The thief is a strong, silent type.

  # Zork lets a treasure buy you a moment's grace, and takes the rest of the fight
  # off a strength that grows with your score. Neither is written: what is written
  # is that he takes it, which is the half a player can see.
  - id: give
    triggers:
      - type: response
        data:
          text: >-
            The thief places the gift in his bag and thanks you politely.

  # ZIL's own villain table names the knife as his one weakness (a sword or bare
  # hands answer through the block below instead) - written above the other
  # because the first requirement that holds decides which action this is, and a
  # nearly-beaten thief is the particular case.
  - id: attack
    preposition: with
    indirect: knife
    requires:
      - type: has-item
        data:
          object: knife
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the knife.
      - type: measure
        data:
          subject: thief
          measure: strength
          max: 1
    chance:
      percent: 40
      failure:
        triggers:
          - type: response
            data:
              text: Your knife misses the thief by an inch.
    triggers:
      - type: response
        data:
          text: The fatal blow catches the thief squarely, and he crumples to the floor.
      - type: adjust-measure
        data:
          subject: thief
          measure: strength
          by: -1

  - id: attack
    preposition: with
    indirect: knife
    requires:
      - type: has-item
        data:
          object: knife
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the knife.
    chance:
      percent: 40
      failure:
        triggers:
          - type: response
            data:
              text: Your knife misses the thief by an inch.
    triggers:
      - type: response
        data:
          text: A quick thrust pinks the thief's arm, and blood starts to trickle down.
      - type: adjust-measure
        data:
          subject: thief
          measure: strength
          by: -1
      - type: set-flag
        data:
          flag: thief-fighting
          value: true

  - id: attack
    triggers:
      - type: response
        data:
          text: >-
            Trying to attack the thief with your bare hands is suicidal - he is armed and you
            are not.
