id: thief

synonyms:
  - robber
  - man
  - person
  - shady thief
  - shady robber
  - shady man
  - shady person
  - suspicious thief
  - suspicious robber
  - suspicious man
  - suspicious person
  - seedy thief
  - seedy robber
  - seedy man
  - seedy person
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: >-
            There is a suspicious-looking individual, holding a large bag, leaning against one wall. He is
            armed with a deadly stiletto.
start: round-room

# In their hands rather than inside them. A thing somebody is holding is not
# in the room, cannot be taken, and changes hands through an action they own -
# which is what these two were always meant to be and could not be said before.
holds: [large-bag, stiletto]

# Zork gives him a strength of five against the troll's two - the toughest fixed
# fight in the game - and settles each blow against a table keyed on both
# fighters' relative strength. Stage has one flat roll per action, the same
# simplification `troll.character.yaml` already makes, so the number moves but
# the shape does not: a strength that only goes down, and a miss/wound pair of
# actions rather than nine outcomes.
measures:
  - id: strength
    max: 5
    start: 5
    thresholds:
      - from: 0
        triggers:
          - type: response
            data:
              text: >-
                Almost as soon as the thief breathes his last breath, a cloud of sinister black
                fog envelops him, and when the fog lifts, the carcass has disappeared.
          - type: remove-object
            data:
              object: thief
          # His bag and blade stay behind, and so does everything he took: the
          # thief's own death is what makes killing him worth it, and
          # `move-tagged` is what makes that literally true rather than a
          # story the bag told about itself. ZIL's `DEPOSIT-BOOTY` drops
          # everything he is holding in the one room he dies in, which is
          # exactly this.
          - type: move-object
            data:
              object: large-bag
              to: here
          - type: move-object
            data:
              object: stiletto
              to: here
          - type: move-tagged
            data:
              tag: treasure
              from: held:thief
              to: here
          - type: set-flag
            data:
              flag: thief-fighting
              value: false
          # A one-turn pulse `every-turn.yaml` reads to open the egg, if it was
          # among what he dropped just now. See `arch/0013`: `DEPOSIT-BOOTY`
          # special-cases the egg among everything else it deposits, and a
          # threshold's own triggers cannot branch on which object this is.
          - type: set-flag
            data:
              flag: thief-just-died
              value: true
      - from: 1

# What he says when spoken to, looked at, fought and given things. What he *does* -
# wandering the map and taking whatever you are carrying - is not here: he wanders,
# so it lives in `every-turn.yaml` rather than in one room's own, and stealing is a
# `tagged`/`move-tagged` pair there rather than one rule per stealable thing.
actions:
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            The thief is a slippery character with beady eyes that flit back and forth. He
            carries, along with an unmistakable arrogance, a large bag over his shoulder and a
            vicious stiletto, whose blade is aimed menacingly in your direction. I'd watch out
            if I were you.

  - id: tell
    triggers:
      - type: response
        data:
          text: The thief is a strong, silent type.

  - id: listen
    triggers:
      - type: response
        data:
          text: The thief says nothing, as you have not been formally introduced.

  - id: get
    triggers:
      - type: response
        data:
          text: Once you got him, what would you do with him?

  # `arch/0013` verified this action's text against ROBBER-FUNCTION and missed
  # the line right above the message it read: real ZIL moves whatever is given
  # straight into the thief's own holdings (`<MOVE ,PRSO ,THIEF>`) before ever
  # choosing which line to print, unconditionally - and a gift worth points
  # (`P?TVALUE` above zero) gets "taken aback... stops to admire its beauty"
  # rather than the plain line below, which is ZIL's answer for something
  # worthless instead. First found from the egg specifically - giving it away
  # is the walkthrough's whole reason to give anything at all, and without the
  # move its weight, and the canary's nested inside it, never actually left
  # the player's own hands the way real Zork's does - but the same is true of
  # every other treasure in the game, not the egg alone: one block below per
  # treasure this port declares, `indirect` naming each and the message
  # naming it back, since this engine has no placeholder standing for
  # whatever a trigger's own object turned out to be, the way ZIL's `D ,PRSO`
  # prints it live.
  - id: give
    indirect: egg
    triggers:
      - type: response
        data:
          text: >-
            The thief is taken aback by your unexpected generosity, but accepts the
            jewel-encrusted egg and stops to admire its beauty.
      - type: move-object
        data:
          object: egg
          to: held:thief

  - id: give
    indirect: bag-of-coins
    triggers:
      - type: response
        data:
          text: >-
            The thief is taken aback by your unexpected generosity, but accepts the
            leather bag of coins and stops to admire its beauty.
      - type: move-object
        data:
          object: bag-of-coins
          to: held:thief

