id: troll

synonyms: [nasty troll]
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: A nasty-looking troll, brandishing a bloody axe, blocks all passages out of the room.
start: troll-room

# In his hands rather than inside him, which is what he was written as before
# characters were used here: a thing in somebody's hands is not in the room, cannot
# be taken, and changes hands through an action they own. His does it when he dies.
holds: [axe]

# Zork gives the troll a strength of two and settles each blow against a table
# of nine outcomes weighted by how the fight is going. Stage has one roll per
# action, so the port spends the variety differently: the troll's strength picks
# which blow this is, and the roll decides whether it lands. Two strengths, two
# actions, and the fight still reads as a fight.
measures:
  - id: strength
    max: 2
    start: 2
    thresholds:
      - from: 0
        triggers:
          - type: response
            data:
              text: >-
                Almost as soon as the troll breathes his last breath, a cloud of sinister black
                fog envelops him, and when the fog lifts, the carcass has disappeared.
          - type: remove-object
            data:
              object: troll
          # He drops what he was holding, which is the only way into this room's
          # other exits being worth anything to you.
          - type: move-object
            data:
              object: axe
              to: here
          - type: set-flag
            data:
              flag: troll-flag
              value: true
      - from: 1

actions:
  # The killing blow. Written above the other because the first requirement that
  # holds decides which action this is, and a wounded troll is the particular case.
  - id: attack
    preposition: with
    indirect: sword
    requires:
      - type: has-item
        data:
          object: sword
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the sword.
      - type: measure
        data:
          subject: troll
          measure: strength
          max: 1
      - type: chance
        data:
          of: 100
          index: [1..60]
          name: characters-troll-character-80
        failure:
          triggers:
            - type: journal
            - type: response
              data:
                text: Clang! Crash! The troll parries.
    triggers:
      - type: response
        data:
          text: 'The fatal blow strikes the troll square in the heart: He dies.'
      - type: adjust-measure
        data:
          subject: troll
          measure: strength
          by: -1

  - id: attack
    preposition: with
    indirect: sword
    requires:
      - type: has-item
        data:
          object: sword
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the sword.
      - type: chance
        data:
          of: 100
          index: [1..60]
          name: characters-troll-character-109
        failure:
          triggers:
            - type: journal
            - type: response
              data:
                text: Your sword misses the troll by an inch.
    triggers:
      - type: response
        data:
          text: The troll is struck on the arm; blood begins to trickle down.
      - type: adjust-measure
        data:
          subject: troll
          measure: strength
          by: -1

  # ZIL's `FIND-WEAPON` answers to any of five blades - stiletto, axe, sword,
  # knife, rusty knife - not the sword alone: `V-ATTACK` only asks
  # `WEAPONBIT`, and `VILLAIN-STRENGTH` only singles the sword out for a
  # further -1 to the troll's own effective strength (`V-BEST-ADV`, the
  # `VILLAINS` table's third field), lower being easier to land a killing
  # blow against. Without a sword this port's `attack` only had the bare-hands
  # block below to fall to - no `preposition` field there to match `with`
  # anything, so `resolve.ts`'s own dispatch (`select`, then `acted`'s
  # fallback to the other object) found nothing at all and answered with the
  # engine's generic refusal instead of a fight. Fixed the same way the sword
  # already was, three more times over, at a flat percentage fifteen points
  # under the sword's own: the nearest true thing this port's one-roll-per-
  # swing model has to a defense strength that is a point higher without the
  # bonus, not a claim that ZIL's own nine-outcome table comes out fifteen
  # points apart - it does not read that way at all, and porting it exactly
  # would mean porting the table, not the fight.
  - id: attack
    preposition: with
    indirect: axe
    requires:
      - type: has-item
        data:
          object: axe
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the axe.
      - type: measure
        data:
          subject: troll
          measure: strength
          max: 1
      - type: chance
        data:
          of: 100
          index: [1..45]
          name: characters-troll-character-axe-1
        failure:
          triggers:
            - type: journal
            - type: response
              data:
                text: Your axe misses the troll by an inch.
    triggers:
      - type: response
        data:
          text: 'The fatal blow strikes the troll square in the heart: He dies.'
      - type: adjust-measure
        data:
          subject: troll
          measure: strength
          by: -1

  - id: attack
    preposition: with
