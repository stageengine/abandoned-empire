      - type: remove-object
        data:
          object: knife
      - type: remove-object
        data:
          object: troll
      - type: move-object
        data:
          object: axe
          to: here
      - type: set-flag
        data:
          flag: troll-flag
          value: true
      - type: achievement
        data: { id: troll-slayer }

  - id: give
    indirect: knife
