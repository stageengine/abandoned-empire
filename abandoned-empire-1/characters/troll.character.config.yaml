id: troll

synonyms: [nasty troll]
conditions:
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: A nasty-looking troll, brandishing a bloody axe, blocks all passages out of the room.
start: troll-room

holds: [axe]

measures:
  - id: strength
    max: 2
    start: 2
    thresholds:
      - from: 0
        triggers:
          - type: response
            data:
              text: >-
                Almost as soon as the troll breathes his last breath, a cloud of sinister black
                fog envelops him, and when the fog lifts, the carcass has disappeared.
          - type: remove-object
            data:
              object: troll
          - type: move-object
            data:
              object: axe
              to: here
          - type: set-flag
            data:
              flag: troll-flag
              value: true
          - type: achievement
            data: { id: troll-slayer }
      - from: 1

actions:
  - id: attack
    preposition: with
    indirect: sword
    conditions:
      - type: has-item
        data:
          object: sword
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the sword.
      - type: measure
        data:
          subject: troll
          measure: strength
          max: 1
      - type: chance
        data:
          of: 100
          index: [1..60]
          name: characters-troll-character-80
        failure:
          triggers:
            - type: journal
            - type: response
              data:
                text: Clang! Crash! The troll parries.
    triggers:
      - type: response
        data:
          text: 'The fatal blow strikes the troll square in the heart: He dies.'
      - type: adjust-measure
        data:
          subject: troll
          measure: strength
          by: -1

  - id: attack
    preposition: with
    indirect: sword
    conditions:
      - type: has-item
        data:
          object: sword
        failure:
          triggers:
            - type: response
              data:
                text: You aren't holding the sword.
      - type: chance
        data:
          of: 100
          index: [1..60]
          name: characters-troll-character-109
        failure:
          triggers:
            - type: journal
            - type: response
              data:
                text: Your sword misses the troll by an inch.
    triggers:
      - type: response
        data:
          text: The troll is struck on the arm; blood begins to trickle down.
      - type: adjust-measure
        data:
          subject: troll
          measure: strength
          by: -1

  - id: attack
    preposition: with
    indirect: axe
