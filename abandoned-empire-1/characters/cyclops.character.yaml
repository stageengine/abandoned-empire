id: cyclops

synonyms:
  - monster
  - eye
  - hungry cyclops
  - hungry monster
  - hungry eye
  - giant cyclops
  - giant monster
  - giant eye
start: cyclops-room

# ZIL's `I-CYCLOPS` is a queued interrupt: once `give lunch` or `attack` (or
# `throw`/`mung`, neither of which this port answers on him at all) first
# enables it, it runs every turn the player spends here with him awake,
# escalating `CYCLOWRATH` by one and reading `CYCLOMAD`'s own line for
# whatever it just became - six of them, and a seventh that grabs the player
# for good rather than talking. `DISABLE`s itself while the player is
# elsewhere or he is asleep, which a `measure`'s own thresholds do nothing to
# imitate on their own; `every-turn.yaml`'s own rule gates the ticking on
# both, so the count sits wherever it was left rather than resetting, exactly
# as a global that nothing but this touches would.
measures:
  - id: wrath
    max: 10
    start: 0
    thresholds:
      - from: 1
        triggers:
          - type: response
            data:
              text: The cyclops seems somewhat agitated.
      - from: 2
        triggers:
          - type: response
            data:
              text: The cyclops appears to be getting more agitated.
      - from: 3
        triggers:
          - type: response
            data:
              text: The cyclops is moving about the room, looking for something.
      - from: 4
        triggers:
          - type: response
            data:
              text: >-
                The cyclops was looking for salt and pepper. No doubt they are condiments for
                his upcoming snack.
      - from: 5
        triggers:
          - type: response
            data:
              text: The cyclops is moving toward you in an unfriendly manner.
      - from: 6
        triggers:
          - type: response
            data:
              text: 'You have two choices: 1. Leave  2. Become dinner.'
      - from: 7
        triggers:
          - type: response
            data:
              text: >-
                The cyclops, tired of all of your games and trickery, grabs you firmly. As he
                licks his chops, he says "Mmm. Just like Mom used to make 'em." It's nice to be
                appreciated.
          - type: set-flag
            data:
              flag: player-died
              value: true

presence:
  - requires:
      - type: flag
        data: { flag: cyclops-asleep }
    triggers:
      - type: response
        data:
          text: The cyclops is asleep at the foot of the stairs.
  - triggers:
      - type: response
        data:
          text: A hungry cyclops is standing at the foot of the stairs.

# ZIL runs the whole of this off one wrath counter: the peppers push it one way,
# the water the other, and the passage opens when he sleeps. Two flags here, for
# the two states a player can tell apart, and the order below is the order the
# first requirement that holds decides between.
#
# `cyclops-room/config.yaml`'s stairs read a third flag, `cyclops-flag`, which is
# ZIL's own name for the one thing it keeps in a single global: asleep, fled, or
# neither. Kept in step here rather than merged into `cyclops-asleep`, because the
# stairs also open when he flees for good (`odysseus`), which is not sleep and
# has no waking-up half.
actions:
  - id: look
    requires:
      - type: flag
        data: { flag: cyclops-asleep }
    triggers:
      - type: response
        data:
          text: The cyclops is sleeping like a baby, albeit a very ugly one.

  - id: look
    triggers:
      - type: response
        data:
          text: A hungry cyclops is standing at the foot of the stairs.

  # The peppers make him thirsty, which is the whole of the puzzle: nothing else
  # will persuade him to drink.
  - id: give
    indirect: lunch
    triggers:
      - type: response
        data:
          text: >-
            The cyclops says "Mmm Mmm. I love hot peppers! But oh, could I use a drink.
            Perhaps I could drink the blood of that thing." From the gleam in his eye, it
            could be surmised that you are "that thing".
      - type: remove-object
        data:
          object: lunch
      - type: set-flag
        data:
          flag: cyclops-thirsty
          value: true
      - type: set-flag
        data:
          flag: cyclops-provoked
          value: true

  # Two blocks rather than one with a refusal written into its requirement. A
  # `failure` here could never be heard: the catch-all below carries no requirements
  # of its own, so it answers whenever a particular one does not, and the
  # particular's words would be dead on the page. The trophy case taught this.
  - id: give
    indirect: bottle
    requires:
      - type: flag
        data: { flag: cyclops-thirsty }
    triggers:
      - type: response
        data:
          text: >-
            The cyclops takes the bottle, checks that it's open, and drinks the water. A
            moment later, he lets out a yawn that nearly blows you over, and then falls fast
            asleep (what did you put in that drink, anyway?).
      - type: move-object
        data:
          object: bottle
          to: here
      - type: set-flag
        data:
          flag: cyclops-asleep
          value: true
      - type: set-flag
        data:
          flag: cyclops-flag
          value: true

  - id: give
    indirect: bottle
    triggers:
      - type: response
        data:
          text: The cyclops apparently is not thirsty and refuses your generous offer.

  - id: give
    indirect: garlic
    triggers:
      - type: response
        data:
          text: The cyclops may be hungry, but there is a limit.

  - id: give
    triggers:
      - type: response
        data:
          text: The cyclops is not so stupid as to eat THAT!

  - id: attack
    requires:
      - type: flag
        data: { flag: cyclops-asleep }
    triggers:
      - type: response
        data:
          text: The cyclops yawns and stares at the thing that woke him up.
      - type: set-flag
        data:
          flag: cyclops-asleep
          value: false
      - type: set-flag
        data:
          flag: cyclops-flag
          value: false
      - type: set-flag
        data:
          flag: cyclops-provoked
          value: true

  - id: attack
    triggers:
      - type: response
        data:
          text: >-
            The cyclops shrugs but otherwise ignores your pitiful attempt.
      - type: set-flag
        data:
          flag: cyclops-provoked
          value: true

  - id: tell
    requires:
      - type: flag
        data: { flag: cyclops-asleep }
    triggers:
      - type: response
        data:
          text: No use talking to him. He's fast asleep.

  - id: tell
    triggers:
      - type: response
        data:
          text: The cyclops prefers eating to making conversation.
