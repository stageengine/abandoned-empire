id: ghosts
name: number of ghosts

noun: plural
synonyms:
  - ghosts
  - spirits
  - fiends
  - force
  - invisible ghosts
  - invisible spirits
  - invisible fiends
  - invisible force
  - evil ghosts
  - evil spirits
  - evil fiends
  - evil force
start: entrance-to-hades

# The ceremony's two windows. Zork queues them as interrupts: six turns from the
# bell to the lit candles, then three from the candles to the prayer. Here they
# are numbers that only move while their flag is set, and the room's own rules
# move them - the ceremony is a thing that happens at this gate and nowhere else.
measures:
  - id: patience
    max: 6
    start: 6
    thresholds:
      - from: 0
        triggers:
          - type: set-flag
            data:
              flag: ceremony
              value: false
          - type: response
            data:
              text: >-
                The tension of this ceremony is broken, and the wraiths, amused but shaken at
                your clumsy attempt, resume their hideous jeering.
      - from: 1

  - id: awe
    max: 3
    start: 3
    thresholds:
      - from: 0
        triggers:
          - type: set-flag
            data:
              flag: blessing
              value: false
          - type: set-flag
            data:
              flag: ceremony
              value: false
          - type: response
            data:
              text: >-
                The tension of this ceremony is broken, and the wraiths, amused but shaken at
                your clumsy attempt, resume their hideous jeering.
      - from: 1

actions:
  - id: tell
    triggers:
      - type: response
        data:
          text: The spirits jeer loudly and ignore you.

  # ZIL's `LLD-ROOM` answers every `EXORCISE`, named object or none, at M-BEG -
  # before the ceremony is done this is what actually answers "exorcise
  # ghosts" too, not the plain line below, which only stands a chance once
  # the spirits are already banished (`lld-flag` set) and naming them at all
  # is closer to moot. Ordered the same way LLD-ROOM checks it: the
  # fully-equipped case, then the general one.
  - id: exorcise
    requires:
      - type: flag
        negate: true
        data:
          flag: lld-flag
      - type: has-item
        data:
          object: bell
      - type: has-item
        data:
          object: book
      - type: has-item
        data:
          object: candles
    triggers:
      - type: response
        data:
          text: You must perform the ceremony.

  - id: exorcise
    requires:
      - type: flag
        negate: true
        data:
          flag: lld-flag
    triggers:
      - type: response
        data:
          text: You aren't equipped for an exorcism.

  - id: exorcise
    triggers:
      - type: response
        data:
          text: Only the ceremony itself has any effect.

  - id: attack
    triggers:
      - type: response
        data:
          text: How can you attack a spirit with material objects?

  - id: break
    triggers:
      - type: response
        data:
          text: How can you attack a spirit with material objects?

  - id: look
    triggers:
      - type: response
        data:
          text: You seem unable to interact with these spirits.
