id: torch-room
tags: [dark]

meta:
  title: Torch Room

actions:
  - id: look
    requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a large room with a prominent doorway leading to a down staircase. Above you
            is a large dome. Up around the edge of the dome (20 feet up) is a wooden railing. In
            the center of the room sits a white marble pedestal.
  - id: look
    triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects: [pedestal, torch]

navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: north-temple
  - id: up
    triggers:
      - type: response
        data:
          text: You cannot reach the rope.
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: north-temple
