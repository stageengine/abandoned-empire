id: egypt-room
tags: [dark]

meta:
  title: Egyptian Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a room which looks like an Egyptian tomb. There is an ascending staircase to
            the west.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects: [sceptre, coffin]

navigation:
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: north-temple
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: north-temple
