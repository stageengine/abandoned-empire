id: cellar
tags: [dark]

meta:
  title: Cellar

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You are in a dark and damp cellar with a narrow passageway leading north, and a
            crawlway to the south. On the west is the bottom of a steep metal ramp which is
            unclimbable.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: cellar.trap-door
    name: trap door
    synonyms:
      - door
      - trapdoor
      - trap-door
      - cover
      - trap trapdoor
      - trap trap-door
      - trap cover
      - dusty door
      - dusty trapdoor
      - dusty trap-door
      - dusty cover
    actions:
      - id: open
        triggers:
          - type: response
            data:
              text: The door is locked from above.
      - id: unlock
        triggers:
          - type: response
            data:
              text: The door is locked from above.

  - id: cellar.slide
    name: chute
    synonyms:
      - ramp
      - slide
      - steep chute
      - steep ramp
      - steep slide
      - metal chute
      - metal ramp
      - metal slide
      - twisting chute
      - twisting ramp
      - twisting slide

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: troll-room
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: east-of-chasm
  - id: west
    triggers:
      - type: response
        data:
          text: >-
            You try to ascend the ramp, but it is impossible, and you slide back down.
  - id: up
    requires:
      - type: flag
        data:
          flag: trap-door-open
    triggers:
      - type: change-scene
        data:
          scene: living-room
