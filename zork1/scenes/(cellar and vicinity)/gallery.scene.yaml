id: gallery

meta:
  title: Gallery

presence:
  - triggers:
      - type: response
        data:
          text: >-
            This is an art gallery. Most of the paintings have been stolen by vandals with
            exceptional taste. The vandals left through either the north or west exits.

objects: [painting]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: studio
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: east-of-chasm
