id: gallery

meta:
  title: Gallery

actions:
  - id: look
    requires:
      - type: object-in
        data:
          object: painting
          location: gallery
    triggers:
      - type: response
        data:
          text: >-
            This is an art gallery. Most of the paintings have been stolen by vandals with
            exceptional taste. The vandals left through either the north or west exits.
      - type: response
        data:
          text: >-
            Fortunately, there is still one chance for you to be a vandal, for on the far wall
            is a painting of unparalleled beauty.
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            This is an art gallery. Most of the paintings have been stolen by vandals with
            exceptional taste. The vandals left through either the north or west exits.

objects: [painting]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: studio
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: east-of-chasm
