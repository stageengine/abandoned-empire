id: studio
tags: [dark]

meta:
  title: Studio

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This appears to have been an artist's studio. The walls and floors are splattered
            with paints of 69 different colors. Strangely enough, nothing of value is hanging
            here. At the south end of the room is an open door (also covered with paint). A dark
            and narrow chimney leads up from a fireplace; although you might be able to get up
            it, it seems unlikely you could get back down.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - owners-manual
  - id: studio.chimney
    name: chimney
    synonyms: [dark chimney, narrow chimney]

navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: gallery
  # The chimney. ZIL lets you up with the lamp and one other thing at most, and
  # that is a count of things rather than a weight of them: the lamp and the
  # coffin are two things and go up together, though they weigh seventy between
  # them. `carrying` reads a total, so it cannot ask this, and a size bound put
  # here would block the coffin that Zork allows. The port asks the half it can -
  # that you have the lamp - and lets the rest through.
  - id: up
    requires:
      - type: has-item
        data:
          object: lamp
        failure:
          triggers:
            - type: response
              data:
                text: You can't get up there with what you're carrying.
    triggers:
      - type: response
        data:
          text: >-
            You squeeze up the chimney, which is narrow and black and drops soot down the back of
            your neck, and come out in the fireplace of the kitchen.
      - type: set-flag
        data:
          flag: trap-door-barred
          value: false
      - type: change-scene
        data:
          scene: kitchen
