id: studio
tags: [dark]

meta:
  title: Studio

actions:
  - id: look
    requires:
      - type: flag
        data:
          flag: light
      - type: object-in
        data:
          object: owners-manual
          location: studio
    triggers:
      - type: response
        data:
          text: >-
            This appears to have been an artist's studio. The walls and floors are splattered
            with paints of 69 different colors. Strangely enough, nothing of value is hanging
            here. At the south end of the room is an open door (also covered with paint). A dark
            and narrow chimney leads up from a fireplace; although you might be able to get up
            it, it seems unlikely you could get back down.
      - type: response
        data:
          text: Loosely attached to a wall is a small piece of paper.
  - id: look
    requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This appears to have been an artist's studio. The walls and floors are splattered
            with paints of 69 different colors. Strangely enough, nothing of value is hanging
            here. At the south end of the room is an open door (also covered with paint). A dark
            and narrow chimney leads up from a fireplace; although you might be able to get up
            it, it seems unlikely you could get back down.
  - id: look
    triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - owners-manual
  - id: studio.chimney
    name: chimney
    synonyms: [dark chimney, narrow chimney]

navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: gallery
  # The chimney. ZIL counts what you are carrying and lets you up with the lamp
  # and one other thing at most; without a carrying limit the port asks the half
  # of that it can - that you have the lamp - and says so when you have not.
  - id: up
    requires:
      - type: has-item
        data:
          object: lamp
        failure:
          triggers:
            - type: response
              data:
                text: You can't get up there with what you're carrying.
    triggers:
      - type: response
        data:
          text: >-
            You squeeze up the chimney, which is narrow and black and drops soot down the back of
            your neck, and come out in the fireplace of the kitchen.
      - type: set-flag
        data:
          flag: trap-door-barred
          value: false
      - type: change-scene
        data:
          scene: kitchen
