# What this room does, and only this room.

every-turn:

  # The troll, who blocks both ways on and does not wait to be asked. One roll a
  # turn: the blow lands or it does not, and which blow it is comes from how the
  # fight is going rather than from Zork's table of nine.
  - requires:
      - type: object-here
        data:
          object: troll
      - type: measure
        data:
          subject: player
          measure: health
          max: 2
    chance:
      percent: 40
      failure:
        triggers:
          - type: response
            data:
              text: The axe sweeps past as you jump aside.
    triggers:
      - type: response
        data:
          text: An axe stroke makes a deep wound in your leg.
      - type: adjust-measure
        data:
          subject: player
          measure: health
          by: -1

  - requires:
      - type: object-here
        data:
          object: troll
    chance:
      percent: 40
      failure:
        triggers:
          - type: response
            data:
              text: The troll swings his axe, but it misses.
    triggers:
      - type: response
        data:
          text: The troll swings his axe, and it nicks your arm as you dodge.
      - type: adjust-measure
        data:
          subject: player
          measure: health
          by: -1
