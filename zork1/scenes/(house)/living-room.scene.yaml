id: living-room

meta:
  title: Living Room

presence:
  - requires:
      - type: flag
        data:
          flag: magic-flag
      - type: flag
        data:
          flag: rug-moved
      - type: flag
        data:
          flag: trap-door-open
    triggers:
      - type: response
        data:
          text: >-
            You are in the living room. There is a doorway to the east. To the west is a
            cyclops-shaped opening in an old wooden door, above which is some strange gothic
            lettering, a trophy case, and a rug lying beside an open trap door.

  - requires:
      - type: flag
        data:
          flag: magic-flag
      - type: flag
        data:
          flag: rug-moved
    triggers:
      - type: response
        data:
          text: >-
            You are in the living room. There is a doorway to the east. To the west is a
            cyclops-shaped opening in an old wooden door, above which is some strange gothic
            lettering, a trophy case, and a closed trap door at your feet.

  - requires:
      - type: flag
        data:
          flag: magic-flag
      - type: flag
        data:
          flag: trap-door-open
    triggers:
      - type: response
        data:
          text: >-
            You are in the living room. There is a doorway to the east. To the west is a
            cyclops-shaped opening in an old wooden door, above which is some strange gothic
            lettering, a trophy case, and an open trap door at your feet.

  - requires:
      - type: flag
        data:
          flag: magic-flag
    triggers:
      - type: response
        data:
          text: >-
            You are in the living room. There is a doorway to the east. To the west is a
            cyclops-shaped opening in an old wooden door, above which is some strange gothic
            lettering, a trophy case, and a large oriental rug in the center of the room.

  - requires:
      - type: flag
        data:
          flag: rug-moved
      - type: flag
        data:
          flag: trap-door-open
    triggers:
      - type: response
        data:
          text: >-
            You are in the living room. There is a doorway to the east, a wooden door with strange
            gothic lettering to the west, which appears to be nailed shut, a trophy case, and a
            rug lying beside an open trap door.

  - requires:
      - type: flag
        data:
          flag: rug-moved
    triggers:
      - type: response
        data:
          text: >-
            You are in the living room. There is a doorway to the east, a wooden door with strange
            gothic lettering to the west, which appears to be nailed shut, a trophy case, and a
            closed trap door at your feet.

  - requires:
      - type: flag
        data:
          flag: trap-door-open
    triggers:
      - type: response
        data:
          text: >-
            You are in the living room. There is a doorway to the east, a wooden door with strange
            gothic lettering to the west, which appears to be nailed shut, a trophy case, and an
            open trap door at your feet.

  - triggers:
      - type: response
        data:
          text: >-
            You are in the living room. There is a doorway to the east, a wooden door with strange
            gothic lettering to the west, which appears to be nailed shut, a trophy case, and a
            large oriental rug in the center of the room.

objects:
  - id: living-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: living-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: living-room.nails
    name: nails
    synonyms: [nails, nail]
    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: "The nails, deeply imbedded in the door, cannot be removed."
  - broken-lamp
  - trophy-case
  - rug
  - trap-door
  - lamp
  - wooden-door
  - sword
  - map

navigation:
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: kitchen
  - id: west
    requires:
      - type: flag
        data:
          flag: magic-flag
        failure:
          triggers:
            - type: response
              data:
                text: The door is nailed shut.
    triggers:
      - type: change-scene
        data:
          scene: strange-passage
  - id: down
    requires:
      - type: flag
        data:
          flag: rug-moved
        failure:
          triggers:
            - type: response
              data:
                text: You can't go that way.
      - type: flag
        data:
          flag: trap-door-open
        failure:
          triggers:
            - type: response
              data:
                text: The trap door is closed.
    triggers:
      - type: change-scene
        data:
          scene: cellar
