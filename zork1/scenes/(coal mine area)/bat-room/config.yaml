id: bat-room
tags: [dark]

meta:
  title: Bat Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You are in a small room which has doors only to the east and south.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects: [bat, jade]

navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: squeeky-room
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: shaft-room
