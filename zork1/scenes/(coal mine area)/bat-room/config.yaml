id: bat-room
tags: [dark]

meta:
  title: Bat Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You are in a small room which has doors only to the east and south.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - jade
  - id: bat-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: bat-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
characters: [bat]

navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: squeeky-room
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: shaft-room
