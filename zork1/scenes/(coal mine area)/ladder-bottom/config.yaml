id: ladder-bottom
tags: [dark]

meta:
  title: Ladder Bottom

actions:
  - id: look
    requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a rather wide room. On one side is the bottom of a narrow wooden ladder. To
            the west and the south are passages leaving the room.
  - id: look
    triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: ladder-bottom.ladder
    name: wooden ladder
    synonyms: [ladder, rickety ladder, narrow ladder]

navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: dead-end-5
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: timber-room
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: ladder-top
