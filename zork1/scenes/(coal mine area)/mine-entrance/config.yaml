id: mine-entrance
tags: [dark]

meta:
  title: Mine Entrance

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You are standing at the entrance of what might have been a coal mine. The shaft
            enters the west wall, and there is another exit on the south end of the room.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: slide-room
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: squeeky-room

objects:
  - id: mine-entrance.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: mine-entrance.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
