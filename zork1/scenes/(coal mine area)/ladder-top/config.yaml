id: ladder-top
tags: [dark]

meta:
  title: Ladder Top

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a very small room. In the corner is a rickety wooden ladder, leading
            downward. It might be safe to descend. There is also a staircase leading upward.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: ladder-top.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: ladder-top.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: ladder-top.ladder
    name: wooden ladder
    synonyms: [ladder, rickety ladder, narrow ladder]

navigation:
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: mine-4
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: ladder-bottom
