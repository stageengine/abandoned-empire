id: stream-view
tags: [dark]

meta:
  title: Stream View

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You are standing on a path beside a gently flowing stream. The path follows the
            stream, which flows from west to east.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: stream-view.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: stream-view.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: stream-view.stream
    name: stream
    synonyms: [stream]
    actions:
      - id: swim
        triggers:
          - type: response
            data:
              text: "You can't swim in the stream."
      - id: cross
        triggers:
          - type: response
            data:
              text: "The other side is a sheer rock cliff."
  - id: stream-view.global-water
    name: water
    synonyms: [quantity]

navigation:
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: reservoir-south
  - id: west
    triggers:
      - type: response
        data:
          text: The stream emerges from a spot too small for you to enter.
