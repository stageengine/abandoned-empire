id: in-stream
tags: [dark]

meta:
  title: Stream

actions:
  - id: look
    requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You are on the gently flowing stream. The upstream route is too narrow to navigate,
            and the downstream route is invisible due to twisting walls. There is a narrow beach
            to land on.
  - id: look
    triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: in-stream.global-water
    name: water
    synonyms: [quantity]

navigation:
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: reservoir
  - id: west
    triggers:
      - type: response
        data:
          text: The channel is too narrow.
  - id: up
    triggers:
      - type: response
        data:
          text: The channel is too narrow.
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: reservoir
  - id: land
    triggers:
      - type: change-scene
        data:
          scene: stream-view
