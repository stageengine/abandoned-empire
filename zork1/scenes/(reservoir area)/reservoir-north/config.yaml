id: reservoir-north
tags: [dark]

meta:
  title: Reservoir North

actions:
  - id: look
    requires:
      - type: flag
        data:
          flag: light
      - type: flag
        data:
          flag: gates-open
      - type: flag
        data:
          flag: low-tide
    triggers:
      - type: response
        data:
          text: >-
            You are in a large cavernous room, the south of which was formerly a lake. However,
            with the water level lowered, there is merely a wide stream running through there.
      - type: response
        data:
          text: >-
            There is a slimy stairway leaving the room to the north.
  - id: look
    requires:
      - type: flag
        data:
          flag: light
      - type: flag
        data:
          flag: gates-open
      - type: flag
        negate: true
        data:
          flag: low-tide
    triggers:
      - type: response
        data:
          text: >-
            You are in a large cavernous area. To the south is a wide lake, whose water level
            appears to be falling rapidly.
      - type: response
        data:
          text: >-
            There is a slimy stairway leaving the room to the north.
  - id: look
    requires:
      - type: flag
        data:
          flag: light
      - type: flag
        negate: true
        data:
          flag: gates-open
      - type: flag
        data:
          flag: low-tide
    triggers:
      - type: response
        data:
          text: >-
            You are in a cavernous area, to the south of which is a very wide stream. The level
            of the stream is rising rapidly, and it appears that before long it will be
            impossible to cross to the other side.
      - type: response
        data:
          text: >-
            There is a slimy stairway leaving the room to the north.
  - id: look
    requires:
      - type: flag
        data:
          flag: light
      - type: flag
        negate: true
        data:
          flag: gates-open
      - type: flag
        negate: true
        data:
          flag: low-tide
    triggers:
      - type: response
        data:
          text: >-
            You are in a large cavernous room, north of a large lake.
      - type: response
        data:
          text: >-
            There is a slimy stairway leaving the room to the north.
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            It is pitch black. You are likely to be eaten by a grue.

objects:
  - pump
  - id: reservoir-north.global-water
    name: water
    synonyms: [quantity]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: atlantis-room
  - id: south
    requires:
      - type: flag
        data:
          flag: low-tide
        failure:
          triggers:
            - type: response
              data:
                text: You would drown.
    triggers:
      - type: change-scene
        data:
          scene: reservoir
