id: stone-barrow

meta:
  title: Stone Barrow

actions:
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            You are standing in front of a massive barrow of stone. In the east face is a huge
            stone door which is open. You cannot see into the dark of the tomb.

objects: [barrow-door, barrow]

navigation:
  - id: northeast
    triggers:
      - type: change-scene
        data:
          scene: west-of-house
