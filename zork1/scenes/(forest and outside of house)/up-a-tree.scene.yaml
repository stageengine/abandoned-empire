id: up-a-tree

tags: [forest]

meta:
  title: Up a Tree

actions:
  - id: look
    requires:
      - type: object-in
        data:
          object: egg
          location: in:nest
    triggers:
      - type: response
        data:
          text: >-
            You are about 10 feet above the ground nestled among some large branches. The
            nearest branch above you is above your reach.
      - type: response
        data:
          text: >-
            In the bird's nest is a large egg encrusted with precious jewels, apparently
            scavenged by a childless songbird. The egg is covered with fine gold inlay, and
            ornamented in lapis lazuli and mother-of-pearl. Unlike most eggs, this one is hinged
            and closed with a delicate looking clasp. The egg appears extremely fragile.

  - id: look
    triggers:
      - type: response
        data:
          text: >-
            You are about 10 feet above the ground nestled among some large branches. The
            nearest branch above you is above your reach.

objects:
  - nest
  - egg
  - broken-egg
  - canary
  - broken-canary
  - id: up-a-tree.tree
    name: tree
    synonyms: [branch, large tree, large branch, storm tree, storm branch]
  - id: up-a-tree.forest
    name: forest
    synonyms: [trees, pines, hemlocks]
  - id: up-a-tree.songbird
    name: songbird
    synonyms: [bird, song bird, song songbird]
  - id: up-a-tree.white-house
    name: white house
    synonyms: [house, beauti house, coloni house]

navigation:
  - id: up
    synonyms: [tree]
    triggers:
      - type: response
        data:
          text: You cannot climb any higher.
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: path
