id: forest-3

tags: [forest]

meta:
  title: Forest

presence:
  - triggers:
      - type: response
        data:
          text: This is a dimly lit forest, with large trees all around.

objects:
  - id: forest-3.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: forest-3.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: forest-3.tree
    name: tree
    synonyms: [branch, large tree, large branch, storm tree, storm branch]
  - id: forest-3.songbird
    name: songbird
    synonyms: [bird, song bird, song songbird]
  - id: forest-3.white-house
    name: white house
    synonyms: [house, beauti house, coloni house]
  - id: forest-3.forest
    name: forest
    synonyms: [trees, pines, hemlocks]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: clearing
  - id: south
    triggers:
      - type: response
        data:
          text: Storm-tossed trees block your way.
  - id: east
    triggers:
      - type: response
        data:
          text: The rank undergrowth prevents eastward movement.
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: forest-1
  - id: northwest
    triggers:
      - type: change-scene
        data:
          scene: south-of-house
  - id: up
    synonyms: [tree]
    triggers:
      - type: response
        data:
          text: There is no tree here suitable for climbing.
