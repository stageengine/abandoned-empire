id: north-of-house

meta:
  title: North of House

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are facing the north side of a white house. There is no door here, and all the
            windows are boarded up. To the north a narrow path winds through the trees.

objects:
  - id: north-of-house.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: north-of-house.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: north-of-house.boarded-window
    name: boarded window
    synonyms: [window]
  - id: north-of-house.board
    name: board
    synonyms: [boards]
  - id: north-of-house.white-house
    name: white house
    synonyms: [house, beauti house, coloni house]
  - id: north-of-house.forest
    name: forest
    synonyms: [trees, pines, hemlocks]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: path
  - id: south
    triggers:
      - type: response
        data:
          text: The windows are all boarded.
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: east-of-house
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: west-of-house
  - id: southeast
    triggers:
      - type: change-scene
        data:
          scene: east-of-house
  - id: southwest
    triggers:
      - type: change-scene
        data:
          scene: west-of-house
