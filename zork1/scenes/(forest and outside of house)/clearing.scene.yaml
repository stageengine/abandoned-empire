id: clearing

meta:
  title: Clearing

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are in a small clearing in a well marked forest path that extends to the east
            and west.

objects:
  - id: clearing.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: clearing.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: clearing.tree
    name: tree
    synonyms: [branch, large tree, large branch, storm tree, storm branch]
  - id: clearing.songbird
    name: songbird
    synonyms: [bird, song bird, song songbird]
  - id: clearing.white-house
    name: white house
    synonyms: [house, beauti house, coloni house]
  - id: clearing.forest
    name: forest
    synonyms: [trees, pines, hemlocks]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: forest-2
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: forest-3
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: canyon-view
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: east-of-house
  - id: up
    triggers:
      - type: response
        data:
          text: There is no tree here suitable for climbing.
