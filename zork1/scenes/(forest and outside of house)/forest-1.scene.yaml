id: forest-1

tags: [forest]

meta:
  title: Forest

presence:
  - triggers:
      - type: response
        data:
          text: >-
            This is a forest, with trees in all directions. To the east, there appears to be
            sunlight.

objects:
  - id: forest-1.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: forest-1.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: forest-1.tree
    name: tree
    synonyms: [branch, large tree, large branch, storm tree, storm branch]
  - id: forest-1.songbird
    name: songbird
    synonyms: [bird, song bird, song songbird]
  - id: forest-1.white-house
    name: white house
    synonyms: [house, beauti house, coloni house]
  - id: forest-1.forest
    name: forest
    synonyms: [trees, pines, hemlocks]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: grating-clearing
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: forest-3
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: path
  - id: west
    triggers:
      - type: response
        data:
          text: You would need a machete to go further west.
  - id: up
    synonyms: [tree]
    triggers:
      - type: response
        data:
          text: There is no tree here suitable for climbing.
