objects:
  - id: dam-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: dam-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - bolt
  - bubble
  - dam
  - control-panel
  - id: dam-room.global-water
    name: water
    synonyms: [quantity]

    actions:
      - id: get
        triggers:
          - type: response
            data:
              text: >-
                The water slips through your fingers.
      - id: drink
        triggers:
          - type: response
            data:
              text: >-
                Thank you very much. I was rather thirsty.
navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: dam-lobby
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: deep-canyon
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: dam-base
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: reservoir-south
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: dam-base
