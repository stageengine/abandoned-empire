id: dam-room

meta:
  title: Dam

presence:
  - requires:
      - type: flag
        data:
          flag: gate-flag
      - type: flag
        data:
          flag: gates-open
      - type: flag
        data:
          flag: low-tide
    triggers:
      - type: response
        data:
          text: >-
            You are standing on the top of the Flood Control Dam #3, which was quite a tourist
            attraction in times far distant. There are paths to the north, south, and west, and
            a scramble down.
      - type: response
        data:
          text: >-
            The water level behind the dam is low: The sluice gates have been opened. Water
            rushes through the dam and downstream.
      - type: response
        data:
          text: >-
            There is a control panel here, on which a large metal bolt is mounted. Directly
            above the bolt is a small green plastic bubble which is glowing serenely.
  - requires:
      - type: flag
        data:
          flag: gate-flag
      - type: flag
        data:
          flag: gates-open
      - type: flag
        negate: true
