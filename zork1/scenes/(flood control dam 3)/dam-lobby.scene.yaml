id: dam-lobby

meta:
  title: Dam Lobby

actions:
  - id: look
    requires:
      - type: object-in
        data:
          object: match
          location: dam-lobby
      - type: object-in
        data:
          object: guide
          location: dam-lobby
    triggers:
      - type: response
        data:
          text: >-
            This room appears to have been the waiting room for groups touring the dam. There
            are open doorways here to the north and east marked "Private", and there is a path
            leading south over the top of the dam.
      - type: response
        data:
          text: >-
            There is a matchbook whose cover says "Visit Beautiful FCD#3" here.
      - type: response
        data:
          text: >-
            Some guidebooks entitled "Flood Control Dam #3" are on the reception desk.
