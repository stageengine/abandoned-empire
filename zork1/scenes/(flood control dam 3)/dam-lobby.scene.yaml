id: dam-lobby

meta:
  title: Dam Lobby

actions:
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            This room appears to have been the waiting room for groups touring the dam. There
            are open doorways here to the north and east marked "Private", and there is a path
            leading south over the top of the dam.

objects: [match, guide]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: maintenance-room
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: dam-room
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: maintenance-room
