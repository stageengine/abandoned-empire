id: loud-room
tags: [dark]

meta:
  title: Loud Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a large room with a ceiling which cannot be detected from the ground. There
            is a narrow passage from east to west and a stone stairway leading upward.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects: [bar]

navigation:
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: damp-cave
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: round-room
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: deep-canyon
