id: ns-passage
tags: [dark]

meta:
  title: North-South Passage

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a high north-south passage, which forks to the northeast.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: chasm-room
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: round-room
  - id: northeast
    triggers:
      - type: change-scene
        data:
          scene: deep-canyon

objects:
  - id: ns-passage.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: ns-passage.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
