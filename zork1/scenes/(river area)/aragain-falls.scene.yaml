id: aragain-falls

meta:
  title: Aragain Falls

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are at the top of Aragain Falls, an enormous waterfall with a drop of about 450
            feet. The only path here is on the north end.

objects:
  - id: aragain-falls.global-water
    name: water
    synonyms: [quantity]
  - id: aragain-falls.river
    name: river
    synonyms: [frigid river]
  - id: aragain-falls.rainbow
    name: rainbow

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: shore
  - id: west
    requires:
      - type: flag
        data:
          flag: rainbow-flag
    triggers:
      - type: change-scene
        data:
          scene: on-rainbow
  - id: up
    requires:
      - type: flag
        data:
          flag: rainbow-flag
    triggers:
      - type: change-scene
        data:
          scene: on-rainbow
  - id: down
    triggers:
      - type: response
        data:
          text: It's a long way...
