id: river-4
tags: [dark]

meta:
  title: Frigid River

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            The river is running faster here and the sound ahead appears to be that of rushing
            water. On the east shore is a sandy beach. A small area of beach can also be seen
            below the cliffs on the west shore.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: river-4.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: river-4.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - emerald
  - buoy
  - id: river-4.global-water
    name: water
    synonyms: [quantity]
  - id: river-4.river
    name: river
    synonyms: [frigid river]

navigation:
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: sandy-beach
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: white-cliffs-south
  - id: up
    triggers:
      - type: response
        data:
          text: You cannot go upstream due to strong currents.
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: river-5
  - id: land
    triggers:
      - type: response
        data:
          text: You can land either to the east or the west.
