id: river-5

meta:
  title: Frigid River

presence:
  - triggers:
      - type: response
        data:
          text: >-
            The sound of rushing water is nearly unbearable here. On the east shore is a large
            landing area.

objects:
  - id: river-5.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: river-5.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - id: river-5.global-water
    name: water
    synonyms: [quantity]
  - id: river-5.river
    name: river
    synonyms: [frigid river]

navigation:
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: shore
  - id: up
    triggers:
      - type: response
        data:
          text: You cannot go upstream due to strong currents.
  - id: land
    triggers:
      - type: change-scene
        data:
          scene: shore
