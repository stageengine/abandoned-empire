id: shore

meta:
  title: Shore

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are on the east shore of the river. The water here seems somewhat treacherous. A
            path travels from north to south here, the south end quickly turning around a sharp
            corner.

objects:
  - id: shore.global-water
    name: water
    synonyms: [quantity]
  - id: shore.river
    name: river
    synonyms: [frigid river]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: sandy-beach
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: aragain-falls
