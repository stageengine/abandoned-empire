id: dam-base

meta:
  title: Dam Base

actions:
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            You are at the base of Flood Control Dam #3, which looms above you and to the north.
            The river Frigid is flowing by here. Along the river are the White Cliffs which seem
            to form giant walls stretching from north to south along the shores of the river as
            it winds its way downstream.

objects:
  - inflated-boat
  - punctured-boat
  - inflatable-boat
  - boat-label
  - id: dam-base.global-water
    name: water
    synonyms: [quantity]
  - id: dam-base.river
    name: river
    synonyms: [frigid river]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: dam-room
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: dam-room
