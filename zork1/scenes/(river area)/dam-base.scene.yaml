id: dam-base

meta:
  title: Dam Base

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are at the base of Flood Control Dam #3, which looms above you and to the north.
            The river Frigid is flowing by here. Along the river are the White Cliffs which seem
            to form giant walls stretching from north to south along the shores of the river as
            it winds its way downstream.

objects:
  - id: dam-base.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: dam-base.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - inflated-boat
  - punctured-boat
  - inflatable-boat
  - boat-label
  - id: dam-base.global-water
    name: water
    synonyms: [quantity]
  - id: dam-base.river
    name: river
    synonyms: [frigid river]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: dam-room
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: dam-room
