id: canyon-bottom

meta:
  title: Canyon Bottom

actions:
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            You are beneath the walls of the river canyon which may be climbable here. The
            lesser part of the runoff of Aragain Falls flows by below. To the north is a narrow
            path.

objects:
  - id: canyon-bottom.global-water
    name: water
    synonyms: [quantity]
  - id: canyon-bottom.climbable-cliff
    name: cliff
    synonyms:
      - wall
      - walls
      - ledge
      - rocky wall
      - rocky cliff
      - rocky walls
      - rocky ledge
      - sheer wall
      - sheer cliff
      - sheer walls
      - sheer ledge
  - id: canyon-bottom.river
    name: river
    synonyms: [frigid river]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: end-of-rainbow
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: cliff-middle
