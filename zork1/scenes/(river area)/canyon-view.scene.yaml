id: canyon-view

meta:
  title: Canyon View

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are at the top of the Great Canyon on its west wall. From here there is a
            marvelous view of the canyon and parts of the Frigid River upstream. Across the
            canyon, the walls of the White Cliffs join the mighty ramparts of the Flathead
            Mountains to the east. Following the Canyon upstream to the north, Aragain Falls may
            be seen, complete with rainbow. The mighty Frigid River flows out from a great dark
            cavern. To the west and south can be seen an immense forest, stretching for miles
            around. A path leads northwest. It is possible to climb down into the canyon from
            here.

objects:
  - id: canyon-view.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: canyon-view.climbable-cliff
    name: cliff
    synonyms:
      - wall
      - walls
      - ledge
      - rocky wall
      - rocky cliff
      - rocky walls
      - rocky ledge
      - sheer wall
      - sheer cliff
      - sheer walls
      - sheer ledge
  - id: canyon-view.river
    name: river
    synonyms: [frigid river]
  - id: canyon-view.rainbow
    name: rainbow

navigation:
  - id: south
    triggers:
      - type: response
        data:
          text: Storm-tossed trees block your way.
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: cliff-middle
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: forest-3
  - id: northwest
    triggers:
      - type: change-scene
        data:
          scene: clearing
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: cliff-middle

actions:
  - id: jump
    triggers:
      - type: response
        data:
          text: "Nice view, lousy place to jump."
      - type: end-game
        data:
          journal: jumped from Canyon View, which was a lousy place to jump

