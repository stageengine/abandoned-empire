id: cliff-middle

meta:
  title: Rocky Ledge

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are on a ledge about halfway up the wall of the river canyon. You can see from
            here that the main flow from Aragain Falls twists along a passage which it is
            impossible for you to enter. Below you is the canyon bottom. Above you is more
            cliff, which appears climbable.

objects:
  - id: cliff-middle.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: cliff-middle.climbable-cliff
    name: cliff
    synonyms:
      - wall
      - walls
      - ledge
      - rocky wall
      - rocky cliff
      - rocky walls
      - rocky ledge
      - sheer wall
      - sheer cliff
      - sheer walls
      - sheer ledge
    actions:
      - id: climb
        triggers:
          - type: response
            data:
              text: >-
                The cliff is too steep for climbing here.
  - id: cliff-middle.river
    name: river
    synonyms: [frigid river]

    actions:
      - id: swim
        triggers:
          - type: response
            data:
              text: >-
                A look before leaping reveals that the river is wide and dangerous, with swift currents
                and large, half-submerged rocks.
      - id: cross
        triggers:
          - type: response
            data:
              text: >-
                You should get in the boat then launch it.
navigation:
  - id: up
    triggers:
      - type: change-scene
        data:
          scene: canyon-view
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: canyon-bottom
