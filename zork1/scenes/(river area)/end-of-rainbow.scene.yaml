id: end-of-rainbow

meta:
  title: End of Rainbow

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are on a small, rocky beach on the continuation of the Frigid River past the
            Falls. The beach is narrow due to the presence of the White Cliffs. The river canyon
            opens here and sunlight shines in from above. A rainbow crosses over the falls to
            the east and a narrow path continues to the southwest.

objects:
  - id: end-of-rainbow.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: end-of-rainbow.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - pot-of-gold
  - id: end-of-rainbow.global-water
    name: water
    synonyms: [quantity]
  - id: end-of-rainbow.rainbow
    name: rainbow
  - id: end-of-rainbow.river
    name: river
    synonyms: [frigid river]

navigation:
  - id: east
    requires:
      - type: flag
        data:
          flag: rainbow-flag
    triggers:
      - type: change-scene
        data:
          scene: on-rainbow
  - id: northeast
    requires:
      - type: flag
        data:
          flag: rainbow-flag
    triggers:
      - type: change-scene
        data:
          scene: on-rainbow
  - id: southwest
    triggers:
      - type: change-scene
        data:
          scene: canyon-bottom
  - id: up
    requires:
      - type: flag
        data:
          flag: rainbow-flag
    triggers:
      - type: change-scene
        data:
          scene: on-rainbow
