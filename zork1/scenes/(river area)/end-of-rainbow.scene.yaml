id: end-of-rainbow

meta:
  title: End of Rainbow

actions:
  - id: look
    requires:
      - type: object-in
        data:
          object: pot-of-gold
          location: end-of-rainbow
    triggers:
      - type: response
        data:
          text: >-
            You are on a small, rocky beach on the continuation of the Frigid River past the
            Falls. The beach is narrow due to the presence of the White Cliffs. The river canyon
            opens here and sunlight shines in from above. A rainbow crosses over the falls to
            the east and a narrow path continues to the southwest.
      - type: response
        data:
          text: At the end of the rainbow is a pot of gold.
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            You are on a small, rocky beach on the continuation of the Frigid River past the
            Falls. The beach is narrow due to the presence of the White Cliffs. The river canyon
            opens here and sunlight shines in from above. A rainbow crosses over the falls to
            the east and a narrow path continues to the southwest.

objects:
  - pot-of-gold
  - id: end-of-rainbow.global-water
    name: water
    synonyms: [quantity]
  - id: end-of-rainbow.rainbow
    name: rainbow
  - id: end-of-rainbow.river
    name: river
    synonyms: [frigid river]

navigation:
  - id: east
    requires:
      - type: flag
        data:
          flag: rainbow-flag
    triggers:
      - type: change-scene
        data:
          scene: on-rainbow
  - id: northeast
    requires:
      - type: flag
        data:
          flag: rainbow-flag
    triggers:
      - type: change-scene
        data:
          scene: on-rainbow
  - id: southwest
    triggers:
      - type: change-scene
        data:
          scene: canyon-bottom
  - id: up
    requires:
      - type: flag
        data:
          flag: rainbow-flag
    triggers:
      - type: change-scene
        data:
          scene: on-rainbow
