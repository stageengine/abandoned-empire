id: sandy-beach
tags: [dark]

meta:
  title: Sandy Beach

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You are on a large sandy beach on the east shore of the river, which is flowing
            quickly by. A path runs beside the river to the south here, and a passage is
            partially buried in sand to the northeast.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: sandy-beach.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: sandy-beach.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
  - shovel
  - id: sandy-beach.global-water
    name: water
    synonyms: [quantity]
  - id: sandy-beach.river
    name: river
    synonyms: [frigid river]

navigation:
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: shore
  - id: northeast
    triggers:
      - type: change-scene
        data:
          scene: sandy-cave
