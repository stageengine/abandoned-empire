id: sandy-cave
tags: [dark]

meta:
  title: Sandy Cave

actions:
  - id: look
    requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: This is a sand-filled cave whose exit is to the southwest.
  - id: look
    triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects: [sand, scarab]

navigation:
  - id: southwest
    triggers:
      - type: change-scene
        data:
          scene: sandy-beach
