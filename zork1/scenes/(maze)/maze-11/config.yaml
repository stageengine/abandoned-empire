id: maze-11
tags: [dark]

meta:
  title: Maze

actions:
  - id: look
    requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: This is part of a maze of twisty little passages, all alike.
  - id: look
    triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

navigation:
  - id: northeast
    triggers:
      - type: change-scene
        data:
          scene: grating-room
  - id: northwest
    triggers:
      - type: change-scene
        data:
          scene: maze-13
  - id: southwest
    triggers:
      - type: change-scene
        data:
          scene: maze-12
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: maze-10
