id: grating-room
tags: [dark]

meta:
  title: Grating Room

actions:
  - id: look
    requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            You are in a small room near the maze. There are twisty passages in the immediate
            vicinity.
  - id: look
    triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects:
  - id: grating-room.grate
    name: grating
    synonyms: [grate]

navigation:
  - id: southwest
    triggers:
      - type: change-scene
        data:
          scene: maze-11
  - id: up
    requires:
      - type: flag
        data:
          flag: grate-open
        failure:
          triggers:
            - type: response
              data:
                text: The grating is closed.
    triggers:
      - type: change-scene
        data:
          scene: grating-clearing
