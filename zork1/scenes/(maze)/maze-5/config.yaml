id: maze-5
tags: [dark]

meta:
  title: Maze

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is part of a maze of twisty little passages, all alike. A skeleton, probably
            the remains of a luckless adventurer, lies here.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

objects: [bones, burned-out-lantern, bag-of-coins, rusty-knife, keys]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: maze-3
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: dead-end-2
  - id: southwest
    triggers:
      - type: change-scene
        data:
          scene: maze-6
