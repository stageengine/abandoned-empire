id: maze-1
tags: [dark]

meta:
  title: Maze

actions:
  - id: look
    requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: This is part of a maze of twisty little passages, all alike.
  - id: look
    triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: maze-1
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: maze-2
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: troll-room
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: maze-4
