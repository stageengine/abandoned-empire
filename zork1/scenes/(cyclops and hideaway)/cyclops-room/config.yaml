id: cyclops-room
tags: [dark]

meta:
  title: Cyclops Room

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This room has an exit on the northwest, and a staircase leading up.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

characters: [cyclops]

# `odysseus`'s other answer, "Wasn't he a sailor?", lives in the game's own
# `actions.yaml` and is what a failed `requires` here falls through to - once he
# has fled, or from anywhere else in the game.
actions:
  - id: odysseus
    requires:
      - type: character-here
        data: { character: cyclops }
      - type: flag
        negate: true
        data: { flag: cyclops-flag }
    triggers:
      - type: response
        data:
          text: >-
            The cyclops, hearing the name of his father's deadly nemesis, flees the room by
            knocking down the wall on the east of the room.
      - type: remove-object
        data:
          object: cyclops
      - type: set-flag
        data:
          flag: cyclops-flag
          value: true
      - type: set-flag
        data:
          flag: magic-flag
          value: true

navigation:
  - id: east
    requires:
      - type: flag
        data:
          flag: magic-flag
        failure:
          triggers:
            - type: response
              data:
                text: The east wall is solid rock.
    triggers:
      - type: change-scene
        data:
          scene: strange-passage
  - id: northwest
    triggers:
      - type: change-scene
        data:
          scene: maze-15
  - id: up
    requires:
      - type: flag
        data:
          flag: cyclops-flag
        failure:
          triggers:
            - type: response
              data:
                text: The cyclops doesn't look like he'll let you past.
    triggers:
      - type: change-scene
        data:
          scene: treasure-room

objects:
  - id: cyclops-room.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: cyclops-room.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
