id: small-cave
tags: [dark]

meta:
  title: Cave

presence:
  - requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a tiny cave with entrances west and north, and a staircase leading down.
  - triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: mirror-room-1
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: atlantis-room
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: twisting-passage
  - id: down
    triggers:
      - type: change-scene
        data:
          scene: atlantis-room

objects:
  - id: small-cave.teeth
    name: set of teeth
    synonyms: [teeth, tooth]
    actions:
      - id: brush
        triggers:
          - type: response
            data:
              text: >-
                Dental hygiene is highly recommended, but I'm not sure what you want to brush
                them with.
  - id: small-cave.wall
    name: surrounding wall
    synonyms: [wall, walls]
    actions:
      - id: look
        triggers:
          - type: response
            data:
              text: The wall is a wall, and gives nothing away.
