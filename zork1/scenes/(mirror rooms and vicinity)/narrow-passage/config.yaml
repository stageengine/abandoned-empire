id: narrow-passage
tags: [dark]

meta:
  title: Narrow Passage

actions:
  - id: look
    requires:
      - type: flag
        data:
          flag: light
    triggers:
      - type: response
        data:
          text: >-
            This is a long and narrow corridor where a long north-south passageway briefly
            narrows even further.
  - id: look
    triggers:
      - type: response
        data:
          text: It is pitch black. You are likely to be eaten by a grue.

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: round-room
  - id: south
    triggers:
      - type: change-scene
        data:
          scene: mirror-room-2
