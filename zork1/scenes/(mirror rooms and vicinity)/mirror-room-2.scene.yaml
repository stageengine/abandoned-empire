id: mirror-room-2

meta:
  title: Mirror Room

presence:
  - triggers:
      - type: response
        data:
          text: >-
            You are in a large square room with tall ceilings. On the south wall is an enormous
            mirror which fills the entire wall. There are exits on the other three sides of the
            room.

objects: [mirror-2]

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: narrow-passage
  - id: east
    triggers:
      - type: change-scene
        data:
          scene: tiny-cave
  - id: west
    triggers:
      - type: change-scene
        data:
          scene: winding-passage
