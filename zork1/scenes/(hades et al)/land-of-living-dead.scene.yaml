id: land-of-living-dead

meta:
  title: Land of the Dead

actions:
  - id: look
    requires:
      - type: object-in
        data:
          object: skull
          location: land-of-living-dead
    triggers:
      - type: response
        data:
          text: >-
            You have entered the Land of the Living Dead. Thousands of lost souls can be heard
            weeping and moaning. In the corner are stacked the remains of dozens of previous
            adventurers less fortunate than yourself. A passage exits to the north.
      - type: response
        data:
          text: >-
            Lying in one corner of the room is a beautifully carved crystal skull. It appears to
            be grinning at you rather nastily.
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            You have entered the Land of the Living Dead. Thousands of lost souls can be heard
            weeping and moaning. In the corner are stacked the remains of dozens of previous
            adventurers less fortunate than yourself. A passage exits to the north.

objects:
  - skull
  - id: land-of-living-dead.bodies
    name: pile of bodies
    synonyms:
      - bodies
      - body
      - remains
      - pile
      - mangled bodies
      - mangled body
      - mangled remains
      - mangled pile

navigation:
  - id: north
    triggers:
      - type: change-scene
        data:
          scene: entrance-to-hades