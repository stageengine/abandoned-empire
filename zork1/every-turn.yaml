      - type: flag
        negate: true
        data:
          flag: found-bauble
    triggers:
      - type: set-flag
        data:
          flag: found-bauble
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 1

  - requires:
      - type: has-item
        data:
          object: bracelet
      - type: flag
        negate: true
        data:
          flag: found-bracelet
    triggers:
      - type: set-flag
        data:
          flag: found-bracelet
      - type: adjust-measure
        data:
          subject: player
