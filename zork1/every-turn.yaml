  # without being taken - the canary comes out of the egg - and a rule asking what
  # is in the player's hands catches every route.

  - requires:
      - type: has-item
        data:
          object: bag-of-coins
      - type: flag
        negate: true
        data:
          flag: found-bag-of-coins
    triggers:
      - type: set-flag
        data:
          flag: found-bag-of-coins
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 10

