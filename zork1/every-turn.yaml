  # Zork scores four rooms for being reached at all, which is the last sixty-five of
  # the three hundred and fifty and the part the port had none of. `visited` asks
  # the question directly, so this is one rule each and the flag is what makes it
  # happen once.

  - requires:
      - type: visited
        data:
          scene: kitchen
      - type: flag
        negate: true
        data:
          flag: reached-kitchen
    triggers:
      - type: set-flag
        data:
          flag: reached-kitchen
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 10

  - requires:
      - type: visited
        data:
          scene: cellar
      - type: flag
        negate: true
        data:
          flag: reached-cellar
    triggers:
      - type: set-flag
        data:
          flag: reached-cellar
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 25

  - requires:
      - type: visited
        data:
          scene: treasure-room
      - type: flag
        negate: true
        data:
          flag: reached-treasure-room
    triggers:
      - type: set-flag
        data:
          flag: reached-treasure-room
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 25

  - requires:
      - type: visited
        data:
          scene: ew-passage
      - type: flag
        negate: true
        data:
          flag: reached-ew-passage
    triggers:
      - type: set-flag
        data:
          flag: reached-ew-passage
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 5

  # The skeleton's curse, carried out. One rule per treasure and then the flag is
  # put down again, so it happens on the turn the ghost appears and no other.

