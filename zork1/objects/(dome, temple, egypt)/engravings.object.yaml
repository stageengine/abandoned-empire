id: engravings
name: wall with engravings

synonyms:
  - wall
  - engravings
  - inscription
  - old wall
  - old engravings
  - old inscription
  - ancient wall
  - ancient engravings
  - ancient inscription
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There are old engravings on the walls here.
start: engravings-cave

actions:
  - id: look
    triggers:
      - type: response
        data:
          text: >-
            The engravings were incised in the living rock of the cave wall by an unknown hand.
            They depict, in symbolic form, the beliefs of the ancient Zorkers. Skillfully
            interwoven with the bas reliefs are excerpts illustrating the major religious tenets
            of that time. Unfortunately, a later age seems to have considered them blasphemous
            and just as skillfully excised them.
