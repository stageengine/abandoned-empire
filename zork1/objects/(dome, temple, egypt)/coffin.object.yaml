id: coffin
name: gold coffin

synonyms:
  - coffin
  - casket
  - treasure
  - solid coffin
  - solid casket
  - solid treasure
  - gold casket
  - gold treasure
portable: true
size: 55
contains: true
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: The solid-gold coffin used for the burial of Ramses II is here.
start: egypt-room
