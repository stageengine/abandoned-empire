id: broken-lamp
name: broken lantern

# The same words the working lamp answers to, which is what ZIL gives both of
# them. Safe since Stage 0.8.0: where a word matches two things and only one is
# within reach, the one in the room is what the player meant, so `take the lamp`
# reaches whichever of these is actually there.
synonyms: [lamp, lantern, broken lamp, broken lantern, smashed lamp, smashed lantern]
portable: true
size: 5
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a broken lantern here.
start: offstage
