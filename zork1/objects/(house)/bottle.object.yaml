id: bottle
name: glass bottle

synonyms: [bottle, container, clear bottle, clear container, glass container]
portable: true
size: 5
contains: true
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: bottle }
    triggers:
      - type: response
        data:
          text: A bottle is sitting on the table.
  - triggers:
      - type: response
        data:
          text: There is a glass bottle here.
start: in:kitchen-table
