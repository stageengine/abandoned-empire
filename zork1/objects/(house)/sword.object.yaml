id: sword

synonyms:
  - orcrist
  - glamdring
  - blade
  - elvish sword
  - elvish orcrist
  - elvish glamdring
  - elvish blade
  - old sword
  - old orcrist
  - old glamdring
  - old blade
  - antique sword
  - antique orcrist
  - antique glamdring
  - antique blade
portable: true
size: 30
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - requires:
      - type: handled
        negate: true
        data: { object: sword }
    triggers:
      - type: response
        data:
          text: Above the trophy case hangs an elvish sword of great antiquity.
  - triggers:
      - type: response
        data:
          text: There is a sword here.
start: living-room

actions:
  - id: look
    requires:
      - type: any-of
        data:
          conditions:
            - type: character-here
              data: { character: troll }
            - type: character-here
              data: { character: thief }
            - type: character-here
              data: { character: cyclops }
    triggers:
      - type: response
        data: { text: Your sword is glowing very brightly. }

  - id: look
    triggers:
      - type: response
        data: { text: Your sword is no longer glowing. }
