  # Anything that is not one of the twenty-one. Below them all, and carrying no
  # requirements, so it answers for everything they do not.
  - id: put
    preposition: in
    triggers:
      - type: response
        data:
          text: The trophy case is for treasures, and that is not one.

  - id: look
    triggers:
      - type: response
        data:
          text: >-
            A glass-fronted case, securely fastened to the wall, and empty of everything but
            dust and the promise of what might go in it.
  - id: open
    triggers:
      - type: response
        data:
          text: >-
            Opening the trophy case reveals an ancient map.

  - id: close
    triggers:
      - type: response
        data:
          text: >-
            Closed.
