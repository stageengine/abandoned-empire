id: trophy-case
name: trophy case

synonyms: [case, trophy case]
contains: true
start: living-room

actions:
  - id: get
    triggers:
      - type: response
        data:
          text: The trophy case is securely fastened to the wall.

  # One of these per treasure, and the reason is not the one this comment used to
  # give. Stage has containers now - `put the coin in the sack` works without
  # anybody writing it - but the built-in only moves a thing, and each treasure
  # here is worth a different number of points. A trigger names a fixed object and
  # a fixed amount, so there is no way to write "score whatever they just put in
  # by whatever it is worth" once. That is the engine's own test failing, and it
  # is on the roadmap as a trigger that cannot act on a thing chosen during play.
  #
  # Sent offstage rather than into the case, which is also not the old reason. A
  # thing may be `in:trophy-case` now, and putting one there would be worse: the
  # room cannot recite a container's contents, so the treasure would be invisible
  # and still reachable, and `take the coffin` would quietly undo the score. Until
  # a room lists what is in a container standing in it, offstage is the honest
  # place for a thing the player has finished with.
  #
  # No gate on any of them, and that is worth saying because two were tried. A
  # `has-item` requirement cannot be heard when it fails: the catch-all below
  # carries no requirements, so it answers whenever a particular one does not, and
  # the particular's own words are dead on the page. A `once` cannot be reached
  # either, for a different reason - the treasure is offstage the moment it is
  # deposited, so a second attempt names nothing and the catch-all answers that
  # too. What is left is the honest shape: no gate, because there is no second
  # time to gate against.

  - id: put
    preposition: in
    indirect: bag-of-coins
    triggers:
      - type: response
        data:
          text: Done.
      - type: move-object
        data:
          object: bag-of-coins
          to: offstage
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 5

