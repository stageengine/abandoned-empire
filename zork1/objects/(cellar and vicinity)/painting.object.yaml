id: painting

synonyms: [painting, art, canvas, treasure, beauti painting, beauti art, beauti canvas]
portable: true
start: gallery

actions:
  # Zork scores a treasure twice: once for getting it out of wherever it was,
  # and again for putting it in the case. The first of those has to be written
  # as an action of its own, because the engine's own taking cannot be hooked -
  # so `once` does the scoring and its failure does the plain taking ever after.
  - id: get
    once:
      failure:
        triggers:
          - type: response
            data:
              text: Taken.
          - type: add-to-inventory
            data:
              object: painting
    triggers:
      - type: response
        data:
          text: Taken.
      - type: add-to-inventory
        data:
          object: painting
      - type: adjust-measure
        data:
          subject: player
          measure: score
          by: 4

  - id: break
    once:
      failure:
        triggers:
          - type: response
            data:
              text: There is a worthless piece of canvas here.
    triggers:
      - type: response
        data:
          text: >-
            Congratulations! Unlike the other vandals, who merely stole the artist's
            masterpieces, you have destroyed one.
      - type: set-flag
        data:
          flag: painting-ruined
          value: true

  - id: look
    requires:
      - type: flag
        data:
          flag: painting-ruined
    triggers:
      - type: response
        data:
          text: There is a worthless piece of canvas here.

  - id: look
    triggers:
      - type: response
        data:
          text: A painting by a neglected genius.
