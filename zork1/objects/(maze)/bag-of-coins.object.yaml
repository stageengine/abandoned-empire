id: bag-of-coins
name: leather bag of coins

synonyms:
  - bag
  - coins
  - treasure
  - old bag
  - old coins
  - old treasure
  - leather bag
  - leather coins
  - leather treasure
portable: true
size: 15
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: An old leather bag, bulging with coins, is here.
start: maze-5
