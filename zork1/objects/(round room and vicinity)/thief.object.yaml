id: thief

synonyms:
  - robber
  - man
  - person
  - shady thief
  - shady robber
  - shady man
  - shady person
  - suspicious thief
  - suspicious robber
  - suspicious man
  - suspicious person
  - seedy thief
  - seedy robber
  - seedy man
  - seedy person
contains: true
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: >-
            There is a suspicious-looking individual, holding a large bag, leaning against one wall. He is
            armed with a deadly stiletto.
start: round-room
