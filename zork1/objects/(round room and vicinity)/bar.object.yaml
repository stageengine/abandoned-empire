id: bar
name: platinum bar

synonyms:
  - bar
  - platinum
  - treasure
  - platinum platinum
  - platinum treasure
  - large bar
  - large platinum
  - large treasure
portable: true
size: 20
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: On the ground is a large platinum bar.
start: loud-room
