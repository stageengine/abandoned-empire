id: broken-canary
name: broken clockwork canary

synonyms:
  - canary
  - treasure
  - broken canary
  - broken treasure
  - clockwork canary
  - clockwork treasure
  - gold canary
  - gold treasure
  - golden canary
  - golden treasure
portable: true
size: 5
first: >-
  There is a golden clockwork canary nestled in the egg. It seems to have recently had a bad
  experience. experience. The mountings for its jewel-like eyes are empty, and its silver beak is
  crumpled. Through a cracked crystal window below its left wing you can see the remains of
  intricate machinery. It is not clear what result winding it would have, as the mainspring seems
  sprung.
here: There is a broken clockwork canary here.
start: in:broken-egg

actions:
  - id: turn
    triggers:
      - type: response
        data:
          text: There is an unpleasant grinding noise from inside the canary.
