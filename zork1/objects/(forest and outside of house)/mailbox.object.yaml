id: mailbox
name: small mailbox

synonyms: [mailbox, box, small box]
contains: true
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a small mailbox here.
start: west-of-house

actions:
  - id: get
    triggers:
      - type: response
        data: { text: It is securely anchored. }
  - id: open
    triggers:
      - type: response
        data:
          text: >-
            Opening the small mailbox reveals a leaflet.

  - id: close
    triggers:
      - type: response
        data:
          text: >-
            Closed.
