id: nest
name: bird's nest

synonyms: [nest, birds nest]
portable: true
size: 5
contains: true
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  # Untouched, and with the egg still in it: the nest first, then what is in it.
  - requires:
      - type: handled
        negate: true
        data: { object: nest }
      - type: object-in
        data:
          object: egg
          location: in:nest
    triggers:
      - type: response
        data:
          text: Beside you on the branch is a small bird's nest.
      - type: response
        data:
          text: >-
            In the bird's nest is a large egg encrusted with precious jewels, apparently
            scavenged by a childless songbird. The egg is covered with fine gold inlay, and
            ornamented in lapis lazuli and mother-of-pearl. Unlike most eggs, this one is hinged
            and closed with a delicate looking clasp. The egg appears extremely fragile.
  - requires:
      - type: handled
        negate: true
        data: { object: nest }
    triggers:
      - type: response
        data:
          text: Beside you on the branch is a small bird's nest.
  # Carried off the branch and put down somewhere, and still saying what is in it.
  - requires:
      - type: object-in
        data:
          object: egg
          location: in:nest
    triggers:
      - type: response
        data:
          text: There is a bird's nest here.
      - type: response
        data:
          text: >-
            In the bird's nest is a large egg encrusted with precious jewels, apparently
            scavenged by a childless songbird. The egg is covered with fine gold inlay, and
            ornamented in lapis lazuli and mother-of-pearl. Unlike most eggs, this one is hinged
            and closed with a delicate looking clasp. The egg appears extremely fragile.
  - triggers:
      - type: response
        data:
          text: There is a bird's nest here.
start: up-a-tree

actions:
  - id: drop
    requires:
      - type: scene
        data:
          id: up-a-tree
      - type: object-in
        data:
          object: egg
          location: in:nest
    triggers:
      - type: response
        data:
          text: >-
            The nest falls to the ground, and the egg spills out of it, seriously damaged.
      # The action stands in for the drop, so it has to do the dropping. Zork
      # leaves the nest up here even though it says otherwise.
      - type: move-object
        data:
          object: nest
          to: here
      - type: remove-object
        data:
          object: egg
      - type: move-object
        data:
          object: broken-egg
          to: path
