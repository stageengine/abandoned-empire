id: scarab
name: beautiful jeweled scarab

synonyms:
  - scarab
  - bug
  - beetle
  - treasure
  - beauti scarab
  - beauti bug
  - beauti beetle
  - beauti treasure
  - carved scarab
  - carved bug
  - carved beetle
  - carved treasure
  - jeweled scarab
  - jeweled bug
  - jeweled beetle
  - jeweled treasure
portable: true
size: 8
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }

  # Buried until somebody digs it out of the sand, which is three turns with the
  # shovel and one turn too many kills you.
  - type: flag
    data: { flag: scarab-found }
presence:
  - triggers:
      - type: response
        data:
          text: There is a beautiful jeweled scarab here.
start: sandy-cave
