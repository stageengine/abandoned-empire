id: inflatable-boat
name: pile of plastic

synonyms:
  - boat
  - pile
  - plastic
  - valve
  - plastic boat
  - plastic pile
  - plastic plastic
  - plastic valve
  - inflat boat
  - inflat pile
  - inflat plastic
  - inflat valve
portable: true
size: 20
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a folded pile of plastic here which has a small valve attached.
start: dam-base
