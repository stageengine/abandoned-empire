id: inflated-boat
name: magic boat

synonyms:
  - boat
  - raft
  - inflat boat
  - inflat raft
  - magic raft
  - plastic boat
  - plastic raft
  - seaworthy boat
  - seaworthy raft
portable: true
size: 20
contains: true
requires:
  # Whether the player can see. Seventy times, which is what
  # ROADMAP.md's "whether the player can see" is about: one block on the game
  # would say this once and reach a thing carried in and dropped besides.
  - type: any-of
    data:
      conditions:
        - type: scene
          negate: true
          data: { tag: dark }
        - type: flag
          data: { flag: light }
presence:
  - triggers:
      - type: response
        data:
          text: There is a magic boat here.
start: offstage

actions:
  - id: inflate
    triggers:
      - type: response
        data: { text: Inflating it further would probably burst it. }

  - id: get
    triggers:
      - type: response
        data:
          text: The boat is too heavy to carry about unless it is deflated.
